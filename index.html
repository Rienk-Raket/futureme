<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FutureMe">
<meta name="application-name" content="FutureMe">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101216" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<title>FutureMe</title>
<style>
/* ============================================================
   FutureMe — persoonlijke taken- en logboek-app
   Alles in één bestand. Geen externe bronnen.
   ============================================================ */

:root{
  --bg:#f4f4f7;
  --bg2:#ececf1;
  --card:#ffffff;
  --card2:#f8f8fa;
  --text:#15171c;
  --muted:#6b7280;
  --faint:#9aa0ab;
  --line:#e3e4e9;
  --line2:#d6d8df;
  --accent:#2f6fed;
  --accent-text:#ffffff;
  --accent-soft:#e7f0ff;
  --green:#12875a;
  --green-soft:#e2f5ec;
  --amber:#b7791f;
  --amber-soft:#fdf3e0;
  --red:#d63c42;
  --red-soft:#fdeaea;
  --purple:#7a4fd6;
  --purple-soft:#f0eaff;
  --shadow:0 1px 2px rgba(16,18,22,.06), 0 8px 24px rgba(16,18,22,.06);
  --shadow-lg:0 -2px 8px rgba(16,18,22,.06), 0 -16px 48px rgba(16,18,22,.14);
  --radius:16px;
  --radius-sm:11px;
  --tap:44px;
  --t:1;          /* tekstschaal, instelbaar */
  --d:1;          /* dichtheid van lijsten */
  --safe-t:env(safe-area-inset-top, 0px);
  --safe-b:env(safe-area-inset-bottom, 0px);
  --safe-l:env(safe-area-inset-left, 0px);
  --safe-r:env(safe-area-inset-right, 0px);
  --navh:calc(58px + var(--safe-b));
}
@media (prefers-color-scheme: dark){
  html:not([data-thema="licht"]){
    --bg:#101216;
    --bg2:#0a0b0e;
    --card:#191c22;
    --card2:#21252c;
    --text:#e8eaee;
    --muted:#98a0ac;
    --faint:#6e7683;
    --line:#272b33;
    --line2:#333843;
    --accent:#5e8dff;
    --accent-text:#0a0d14;
    --accent-soft:#1a2440;
    --green:#4ad18f;
    --green-soft:#12291f;
    --amber:#e8b45c;
    --amber-soft:#2a2214;
    --red:#ff6b70;
    --red-soft:#2e1618;
    --purple:#b08cff;
    --purple-soft:#211a33;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --shadow-lg:0 -2px 8px rgba(0,0,0,.35), 0 -16px 48px rgba(0,0,0,.5);
  }
}
html[data-thema="donker"]{
    --bg:#101216;
    --bg2:#0a0b0e;
    --card:#191c22;
    --card2:#21252c;
    --text:#e8eaee;
    --muted:#98a0ac;
    --faint:#6e7683;
    --line:#272b33;
    --line2:#333843;
    --accent:#5e8dff;
    --accent-text:#0a0d14;
    --accent-soft:#1a2440;
    --green:#4ad18f;
    --green-soft:#12291f;
    --amber:#e8b45c;
    --amber-soft:#2a2214;
    --red:#ff6b70;
    --red-soft:#2e1618;
    --purple:#b08cff;
    --purple-soft:#211a33;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --shadow-lg:0 -2px 8px rgba(0,0,0,.35), 0 -16px 48px rgba(0,0,0,.5);
}

html[data-thema="licht"]{color-scheme:light}
html[data-thema="donker"]{color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  overflow-anchor:none;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:calc(16px * var(--t));line-height:1.45;
  background:var(--bg);color:var(--text);
  overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
  touch-action:manipulation;
}
button,input,textarea,select{font:inherit;color:inherit;font-size:calc(16px * var(--t))}
button{background:none;border:0;padding:0;cursor:pointer;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,textarea,select{-webkit-appearance:none;appearance:none}
textarea{font-family:inherit}
::placeholder{color:var(--faint)}
a{color:var(--accent)}
/* Vangnet: elk icoon heeft altijd een maat, ook zonder eigen regel. */
svg{width:20px;height:20px;flex:0 0 auto}

/* ---------- App-raamwerk ---------- */
#app{
  display:flex;flex-direction:column;
  height:100vh;height:100dvh;
  padding-left:var(--safe-l);padding-right:var(--safe-r);
}
header#top{
  flex:0 0 auto;
  padding:calc(var(--safe-t) + 10px) 14px 8px;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(180%) blur(16px);
  -webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid transparent;
  transition:border-color .2s;
  z-index:30;
}
header#top.scrolled{border-bottom-color:var(--line)}
.top-row{display:flex;align-items:center;gap:8px;min-height:36px}
h1#titel{font-size:calc(26px * var(--t));line-height:1.15;font-weight:800;letter-spacing:-.02em;margin:0;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:calc(13px * var(--t));color:var(--muted);margin-top:2px}
.icon-btn{
  min-width:var(--tap);min-height:var(--tap);
  display:inline-flex;align-items:center;justify-content:center;
  border-radius:12px;color:var(--muted);flex:0 0 auto;
}
.icon-btn:active{background:var(--card2)}
.icon-btn svg{width:22px;height:22px;display:block}

main#scherm{
  flex:1 1 auto;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overflow-anchor:none;   /* anders verspringt de tijdlijn bij hertekenen */
  padding:4px 14px calc(var(--navh) + 24px);
}

nav#tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:flex;
  padding:0 max(6px,var(--safe-l)) var(--safe-b) max(6px,var(--safe-r));
  background:color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter:saturate(180%) blur(18px);
  -webkit-backdrop-filter:saturate(180%) blur(18px);
  border-top:1px solid var(--line);
}
nav#tabs button{
  flex:1 1 0;min-height:58px;min-width:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--faint);font-size:calc(9.8px * var(--t));font-weight:600;letter-spacing:-.01em;
  padding:6px 1px 4px;border-radius:12px;overflow:hidden;
}
nav#tabs button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav#tabs button svg{width:23px;height:23px}
nav#tabs button[aria-current="true"]{color:var(--accent)}
nav#tabs button:active{opacity:.6}
.tab-dot{position:absolute;transform:translate(13px,-11px);width:8px;height:8px;border-radius:50%;background:var(--red)}

/* ---------- Kaarten & lijsten ---------- */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin:12px 0;overflow:hidden}
.card-pad{padding:14px}
.sectie{margin:22px 0 8px;display:flex;align-items:baseline;gap:8px}
.sectie h2{font-size:calc(14px * var(--t));font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--muted);margin:0}
.sectie .telling{font-size:calc(13px * var(--t));color:var(--faint);font-weight:600}
.sectie .actie{margin-left:auto;font-size:calc(14px * var(--t));color:var(--accent);font-weight:600;min-height:32px;display:flex;align-items:center}

.leeg{text-align:center;padding:34px 18px;color:var(--muted)}
.leeg .em{font-size:calc(34px * var(--t));display:block;margin-bottom:8px;opacity:.7}
.leeg p{margin:4px 0;font-size:calc(14px * var(--t))}

/* ---------- Taakregel ---------- */
.taak{
  display:flex;gap:11px;padding:11px 13px;align-items:flex-start;
  background:var(--card);border-bottom:1px solid var(--line);
  position:relative;min-height:var(--tap);
  touch-action:pan-y;
}
.taak:last-child{border-bottom:0}
.taak.slepen{opacity:.92;box-shadow:var(--shadow);border-radius:12px;background:var(--card2);z-index:5;position:relative}
.taak.plek{opacity:.25}
.vink{
  flex:0 0 auto;width:44px;height:44px;margin:-9px -5px -9px -10px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;position:relative;
}
.vink::before{
  content:"";position:absolute;width:26px;height:26px;border-radius:50%;
  border:2px solid var(--line2);box-sizing:border-box;transition:background .16s,border-color .16s;
}
.vink svg{width:15px;height:15px;opacity:0;transform:scale(.5);transition:all .16s;position:relative;z-index:1}
.taak.af .vink::before,.vink.gedaan::before{background:var(--green);border-color:var(--green)}
.taak.af .vink svg,.vink.gedaan svg{opacity:1;transform:scale(1);color:var(--card)}
.vink.p1::before{border-color:var(--red);background:var(--red-soft)}
.vink.p2::before{border-color:var(--amber);background:var(--amber-soft)}
.vink.p3::before{border-color:var(--accent);background:var(--accent-soft)}
.taak-mid{flex:1 1 auto;min-width:0}
.taak-titel{font-size:calc(15.5px * var(--t));line-height:1.35;word-break:break-word}
.taak.af .taak-titel{text-decoration:line-through;color:var(--faint)}
.taak-meta{display:flex;flex-wrap:wrap;gap:5px 9px;margin-top:4px;font-size:calc(12.5px * var(--t));color:var(--muted);align-items:center}
.taak-meta .laat{color:var(--red);font-weight:700}
.taak-meta .vandaag{color:var(--green);font-weight:700}
.taak-notitie{font-size:calc(13px * var(--t));color:var(--muted);margin-top:3px;white-space:pre-wrap;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.greep{flex:0 0 auto;width:30px;min-height:34px;display:flex;align-items:center;justify-content:center;color:var(--line2);touch-action:none;margin:-4px -6px -4px 0}
.greep svg{width:18px;height:18px}
.subvoortgang{font-size:calc(12px * var(--t));color:var(--muted)}

/* ---------- Chips ---------- */
.chip{
  display:inline-flex;align-items:center;gap:4px;
  padding:2px 8px;border-radius:999px;font-size:calc(12px * var(--t));font-weight:600;
  background:var(--card2);color:var(--muted);white-space:nowrap;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;
}
.chip.groot{padding:6px 12px;font-size:calc(13.5px * var(--t));min-height:34px}
.chip.blauw{background:var(--accent-soft);color:var(--accent)}
.chip.groen{background:var(--green-soft);color:var(--green)}
.chip.rood{background:var(--red-soft);color:var(--red)}
.chip.oranje{background:var(--amber-soft);color:var(--amber)}
.chip.paars{background:var(--purple-soft);color:var(--purple)}
.chip svg{width:13px;height:13px;flex:0 0 auto}
.chiprij{display:flex;flex-wrap:wrap;gap:6px}
.chiprij.scroll{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;margin:0 -14px;padding-left:14px;padding-right:14px;scrollbar-width:none}
.chiprij.scroll::-webkit-scrollbar{display:none}

/* ---------- Knoppen ---------- */
.knop{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:var(--tap);padding:0 18px;border-radius:13px;
  background:var(--card2);color:var(--text);font-weight:650;font-size:calc(15px * var(--t));
  border:1px solid transparent;
}
.knop:active{transform:scale(.975)}
.knop.primair{background:var(--accent);color:var(--accent-text)}
.knop.rand{background:transparent;border-color:var(--line2);color:var(--text)}
.knop.gevaar{background:var(--red-soft);color:var(--red)}
.knop.breed{width:100%}
.knop.klein{min-height:36px;padding:0 13px;font-size:calc(14px * var(--t));border-radius:10px}
.knop svg{width:18px;height:18px}
.knop[disabled]{opacity:.4}
.knoprij{display:flex;gap:9px;flex-wrap:wrap}
.knoprij>.knop{flex:1 1 auto}

/* ---------- Snel vastleggen ---------- */
.vastleg{position:relative;margin:10px 0 2px}
.vastleg-box{
  display:flex;align-items:center;gap:8px;background:var(--card);
  border:1.5px solid var(--line);border-radius:14px;padding:6px 6px 6px 12px;
  box-shadow:var(--shadow);transition:border-color .15s;
}
.vastleg-box:focus-within{border-color:var(--accent)}
.vastleg-box input{
  flex:1 1 auto;min-width:0;border:0;background:none;outline:none;
  font-size:calc(16px * var(--t));min-height:38px;padding:0;
}
.vastleg-box .mini{min-width:38px;min-height:38px;display:flex;align-items:center;justify-content:center;border-radius:10px;color:var(--muted)}
.vastleg-box .mini svg{width:20px;height:20px}
.vastleg-box .mini.aan{color:var(--red)}
.vastleg-box .verstuur{background:var(--accent);color:var(--accent-text);width:40px;height:40px;flex:0 0 auto;border-radius:11px;display:flex;align-items:center;justify-content:center}
.vastleg-box .verstuur svg{width:21px;height:21px}
.vastleg-box .verstuur[disabled]{background:var(--line);color:var(--faint)}
.parser-uit{display:flex;flex-wrap:wrap;gap:6px;padding:9px 4px 2px;font-size:calc(12px * var(--t));min-height:8px}
.parser-uit .hint{color:var(--faint);font-size:calc(12.5px * var(--t))}

/* ---------- Banner ---------- */
.banner{
  display:flex;gap:11px;align-items:flex-start;padding:13px 14px;border-radius:14px;
  background:var(--amber-soft);color:var(--amber);margin:12px 0;font-size:calc(14px * var(--t));line-height:1.4;
}
.banner.blauw{background:var(--accent-soft);color:var(--accent)}
.banner.rood{background:var(--red-soft);color:var(--red)}
.banner b{display:block;margin-bottom:2px}
.banner svg{width:20px;height:20px;flex:0 0 auto;margin-top:1px}
.banner .sluit{margin-left:auto;min-width:32px;min-height:32px;display:flex;align-items:center;justify-content:center;opacity:.7}
.incasso-mini{margin:12px 0;border-radius:15px;overflow:hidden;background:var(--card);box-shadow:var(--shadow)}
.incasso-mini summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:11px;padding:13px 14px;min-height:var(--tap)}
.incasso-mini summary::-webkit-details-marker{display:none}
.incasso-mini .titel{display:block;font-weight:700;font-size:calc(14.5px * var(--t))}
.incasso-mini .chev{width:16px;height:16px;color:var(--line2);flex:0 0 auto;transition:transform .2s}
.incasso-mini[open] summary{border-bottom:1px solid var(--line)}
.incasso-mini[open] .chev{transform:rotate(90deg)}
.incasso-mini .inhoud .actie{display:flex;justify-content:center;width:100%;padding:11px;font-weight:700;
  color:var(--accent);font-size:calc(13.5px * var(--t));border-top:1px solid var(--line);min-height:var(--tap)}

/* ---------- Formulier ---------- */
.veld{margin:14px 0}
.veld label,.labeltekst{display:block;font-size:calc(12.5px * var(--t));font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px}
.invoer{
  width:100%;min-height:var(--tap);padding:11px 13px;border-radius:12px;
  background:var(--card2);border:1.5px solid transparent;outline:none;font-size:calc(16px * var(--t));
}
.invoer:focus{border-color:var(--accent);background:var(--card)}
textarea.invoer{min-height:88px;resize:vertical;line-height:1.5}
select.invoer{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:38px}
.rij2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rij3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keuzerij{display:flex;gap:7px;flex-wrap:wrap}
.keuze{
  min-height:40px;padding:0 14px;border-radius:11px;background:var(--card2);
  font-size:calc(14px * var(--t));font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:5px;
  border:1.5px solid transparent;
}
.keuze[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.keuze.dag{min-width:42px;justify-content:center;padding:0}
.schakel{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:var(--tap);padding:8px 0}
.schakel .tekst{flex:1;min-width:0}
.schakel .tekst small{display:block;color:var(--muted);font-size:calc(12.5px * var(--t));font-weight:400;text-transform:none;letter-spacing:0;margin-top:1px}
.toggle{flex:0 0 auto;width:52px;height:31px;border-radius:999px;background:var(--line2);position:relative;transition:background .2s}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.toggle[aria-pressed="true"]{background:var(--green)}
.toggle[aria-pressed="true"]::after{transform:translateX(21px)}

/* ---------- Bladen (sheets) ---------- */
.overlay{
  position:fixed;inset:0;z-index:60;background:rgba(8,10,14,.45);
  opacity:0;pointer-events:none;transition:opacity .22s;
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
}
.overlay.open{opacity:1;pointer-events:auto}
.blad{
  position:fixed;left:0;right:0;bottom:0;z-index:61;
  background:var(--bg);border-radius:20px 20px 0 0;box-shadow:var(--shadow-lg);
  transform:translateY(100%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  max-height:94dvh;display:flex;flex-direction:column;
  padding-left:var(--safe-l);padding-right:var(--safe-r);
}
.blad.open{transform:translateY(0)}
.blad-kop{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 14px 10px;
  border-bottom:1px solid var(--line);
}
.blad-kop h3{flex:1;margin:0;font-size:calc(17px * var(--t));font-weight:700;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blad-greep{width:38px;height:5px;border-radius:3px;background:var(--line2);margin:8px auto 0}
.blad-inhoud{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 14px calc(18px + var(--safe-b))}
.blad-voet{flex:0 0 auto;padding:10px 14px calc(10px + var(--safe-b));border-top:1px solid var(--line);background:var(--card)}

/* ---------- Toast ---------- */
#toast{
  position:fixed;left:50%;bottom:calc(var(--navh) + 14px);transform:translate(-50%,16px);
  z-index:90;background:var(--text);color:var(--bg);
  padding:11px 16px;border-radius:13px;font-size:calc(14px * var(--t));font-weight:600;
  box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:all .22s;
  width:max-content;max-width:calc(100vw - 32px);display:flex;align-items:center;gap:12px;
}
#toast>span{min-width:0}
#toast.zicht{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{color:var(--accent);font-weight:700;min-height:34px;padding:0 4px}

/* ---------- Kalender ---------- */
.kal-kop{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:5px}
.kal-kop span{text-align:center;font-size:calc(11px * var(--t));font-weight:700;color:var(--faint);text-transform:uppercase}
.kal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.kal-dag{
  aspect-ratio:1/1.08;border-radius:10px;background:var(--card);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding-top:5px;font-size:calc(14px * var(--t));font-weight:600;min-height:var(--tap);position:relative;
}
.kal-dag.buiten{opacity:.32}
.kal-dag.vandaag{outline:2px solid var(--accent);outline-offset:-2px;color:var(--accent)}
.kal-dag[aria-pressed="true"]{background:var(--accent);color:var(--accent-text)}
.kal-punten{display:flex;gap:2px;margin-top:3px;flex-wrap:wrap;justify-content:center;max-width:90%}
.kal-punt{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.kal-punt.p1{background:var(--red)}
.kal-punt.afspraak{background:var(--purple)}
.kal-punt.incasso{background:var(--green)}
.kal-tgl{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:99px;border:1px solid var(--line);
  background:var(--card2);font-size:calc(11.5px * var(--t));font-weight:700;color:var(--muted);white-space:nowrap}
.kal-tgl .stip{width:8px;height:8px;border-radius:50%;background:var(--green);opacity:.35}
.kal-tgl[aria-pressed="true"]{color:var(--green);border-color:color-mix(in srgb,var(--green) 45%,var(--line))}
.kal-tgl[aria-pressed="true"] .stip{opacity:1}
.kal-dag[aria-pressed="true"] .kal-punt{background:var(--accent-text)}

/* ---------- Tijdlijn / logboek ---------- */
.tijdlijn{position:relative;padding-left:26px}
.tijdlijn::before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:9px 0}
.tl-item::before{
  content:"";position:absolute;left:-22px;top:15px;width:11px;height:11px;border-radius:50%;
  background:var(--accent);border:2.5px solid var(--bg);
}
.tl-item.taak-af::before{background:var(--green)}
.tl-item.afspraak::before{background:var(--purple)}
.tl-item.gewoonte::before{background:var(--amber)}
.tl-item.dagboek::before{background:var(--accent)}
.tl-tijd{font-size:calc(12px * var(--t));color:var(--faint);font-weight:600}
.tl-tekst{font-size:calc(15px * var(--t));margin-top:1px}
.dagkop{position:sticky;top:-4px;z-index:2;background:var(--bg);padding:12px 0 6px;font-size:calc(13px * var(--t));font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}

/* ---------- Voortgang ---------- */
.balk{height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.balk>i{display:block;height:100%;background:var(--green);border-radius:4px;transition:width .3s}
.ring{--p:0;width:44px;height:44px;border-radius:50%;flex:0 0 auto;
  background:conic-gradient(var(--green) calc(var(--p)*1%), var(--line) 0);
  display:flex;align-items:center;justify-content:center;font-size:calc(11px * var(--t));font-weight:800}
.ring>span{width:34px;height:34px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center}

/* ---------- Statistiek ---------- */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--card);border-radius:14px;padding:13px;box-shadow:var(--shadow)}
.stat .getal{font-size:calc(27px * var(--t));font-weight:800;letter-spacing:-.02em;line-height:1.1}
.stat .lab{font-size:calc(12.5px * var(--t));color:var(--muted);margin-top:2px}
.grafiek{display:flex;align-items:flex-end;gap:6px;height:110px;padding-top:8px}
.grafiek .kolom{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.grafiek .staaf{width:100%;max-width:34px;background:var(--accent);border-radius:6px 6px 3px 3px;min-height:3px;transition:height .3s}
.grafiek .dag{font-size:calc(10.5px * var(--t));color:var(--faint);font-weight:700}
.grafiek .waarde{font-size:calc(10.5px * var(--t));color:var(--muted);font-weight:700}

/* ---------- Gewoontes ---------- */
.gew{display:flex;align-items:center;gap:11px;padding:11px 13px;border-bottom:1px solid var(--line)}
.gew:last-child{border-bottom:0}
.gew-week{display:flex;gap:4px;margin-left:auto}
.gew-bol{width:26px;height:26px;border-radius:9px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:calc(10px * var(--t));font-weight:700;color:var(--faint)}
.gew-bol.af{background:var(--green);color:var(--card)}
.gew-bol.vandaag{outline:2px solid var(--accent);outline-offset:-2px}
.gew-bol.nvt{opacity:.3}
.streak{font-size:calc(12.5px * var(--t));font-weight:700;color:var(--amber)}

/* ---------- Timer ---------- */
.timer-groot{font-size:calc(58px * var(--t));font-weight:200;letter-spacing:-.03em;text-align:center;font-variant-numeric:tabular-nums;margin:10px 0}
#timerbalk{
  position:fixed;left:8px;right:8px;bottom:calc(var(--navh) + 8px);z-index:45;
  background:var(--text);color:var(--bg);border-radius:14px;padding:9px 12px;
  display:none;align-items:center;gap:10px;box-shadow:var(--shadow);font-size:calc(14px * var(--t));
}
#timerbalk.zicht{display:flex}
#timerbalk .tijd{font-variant-numeric:tabular-nums;font-weight:800;font-size:calc(16px * var(--t))}
#timerbalk .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
#timerbalk button{color:var(--bg);min-width:36px;min-height:36px;display:flex;align-items:center;justify-content:center;border-radius:9px;background:rgba(255,255,255,.14)}
#timerbalk button svg{width:17px;height:17px}

/* ---------- Diversen ---------- */
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.menu-kaart{
  background:var(--card);border-radius:15px;padding:14px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:7px;min-height:88px;text-align:left;
}
.menu-kaart svg{width:23px;height:23px;color:var(--accent)}
.menu-kaart .nm{font-weight:700;font-size:calc(15px * var(--t))}
.menu-kaart .ds{font-size:calc(12px * var(--t));color:var(--muted);line-height:1.35}
.rijknop{
  display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;
  border-bottom:1px solid var(--line);min-height:var(--tap);text-align:left;background:var(--card);
}
.rijknop:last-child{border-bottom:0}
.rijknop .nm{flex:1;min-width:0;font-size:calc(15px * var(--t));overflow:hidden;text-overflow:ellipsis}
.rijknop .rechts{color:var(--faint);font-size:calc(13.5px * var(--t));display:flex;align-items:center;gap:6px}
.rijknop svg.pijl{width:16px;height:16px;color:var(--line2)}
.kleurbol{width:12px;height:12px;border-radius:50%;flex:0 0 auto}
.hr{height:1px;background:var(--line);margin:16px 0;border:0}
.klein{font-size:calc(13px * var(--t));color:var(--muted);line-height:1.5}
.klein p{margin:7px 0}
.klein code{background:var(--card2);padding:1px 5px;border-radius:5px;font-size:calc(12px * var(--t));font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.nowrap{white-space:nowrap}
.mono{font-variant-numeric:tabular-nums}
.verborgen{display:none !important}
.zoekbalk{display:flex;align-items:center;gap:8px;background:var(--card2);border-radius:12px;padding:0 12px;min-height:var(--tap);margin:8px 0}
.zoekbalk input{flex:1;border:0;background:none;outline:none;min-height:var(--tap)}
.zoekbalk svg{width:18px;height:18px;color:var(--faint);flex:0 0 auto}
.bijlagen{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.bijlage{position:relative;width:74px;height:74px;border-radius:11px;overflow:hidden;background:var(--card2);display:flex;align-items:center;justify-content:center}
.bijlage img{width:100%;height:100%;object-fit:cover}
.bijlage .x{position:absolute;top:2px;right:2px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:flex;align-items:center;justify-content:center;font-size:calc(14px * var(--t))}
.bijlage .bestandsnaam{font-size:calc(9.5px * var(--t));padding:4px;text-align:center;word-break:break-all;color:var(--muted);line-height:1.2}
.subtaak{display:flex;align-items:center;gap:7px;padding:3px 0;min-height:44px}
.subtaak input[type="text"]{flex:1;border:0;background:none;outline:none;font-size:calc(15px * var(--t));min-height:36px}
.subtaak.af input[type="text"]{text-decoration:line-through;color:var(--faint)}
.mini-vink{width:44px;height:44px;margin-left:-10px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto;position:relative}
.mini-vink::before{content:"";position:absolute;width:24px;height:24px;border-radius:50%;border:2px solid var(--line2);box-sizing:border-box}
.mini-vink svg{width:13px;height:13px;opacity:0;position:relative;z-index:1}
.subtaak.af .mini-vink::before{background:var(--green);border-color:var(--green)}
.subtaak.af .mini-vink svg{opacity:1;color:var(--card)}

/* ---------- Instelbaar: tekstgrootte, dichtheid, contrast ---------- */
html[data-tekst="klein"]{--t:.92}
html[data-tekst="normaal"]{--t:1}
html[data-tekst="groot"]{--t:1.13}
html[data-tekst="extra"]{--t:1.28}
html[data-dicht="compact"]{--d:.78}
html[data-dicht="ruim"]{--d:1.28}
.taak{padding:calc(11px * var(--d)) 13px}
.rijknop{padding:calc(13px * var(--d)) 14px}
.gew{padding:calc(11px * var(--d)) 13px}
html[data-contrast="1"]{--line:#9aa0ab;--line2:#6b7280;--muted:#3d434d;--faint:#5c636e}
@media (prefers-color-scheme: dark){
  html[data-contrast="1"]{--line:#5a6270;--line2:#79818f;--muted:#c3c9d3;--faint:#a3aab5}
}
html[data-contrast="1"] .card{border:1px solid var(--line)}
html[data-contrast="1"] .chip{outline:1px solid color-mix(in srgb,currentColor 35%,transparent)}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}
html[data-rust="1"] .kal-punt,html[data-rust="1"] .leeg .em{opacity:.5}
html[data-rust="1"] .banner{background:var(--card2);color:var(--muted)}

/* ---------- Vegen (swipe) over een taakregel ---------- */
.swipe{position:relative;overflow:hidden;background:var(--card);border-bottom:1px solid var(--line)}
.swipe:last-child{border-bottom:0}
.swipe .taak{border-bottom:0;position:relative;z-index:1;transition:transform .18s cubic-bezier(.32,.72,0,1);will-change:transform}
.swipe.sleept .taak{transition:none}
.swipe-laag{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;font-size:calc(13px * var(--t));font-weight:700;color:#fff}
.swipe-laag .links{background:transparent;display:flex;align-items:center;gap:7px}
.swipe-laag .rechts{display:flex;align-items:center;gap:7px}
.swipe-laag.groen{background:var(--green)}
.swipe-laag.oranje{background:var(--amber)}
.swipe-laag svg{width:19px;height:19px}

/* ---------- Meerdere selecteren ---------- */
.taak.gekozen{background:var(--accent-soft)}
#bulkbalk{position:fixed;left:8px;right:8px;bottom:calc(var(--navh) + 8px);z-index:46;
  background:var(--accent);color:var(--accent-text);border-radius:14px;padding:8px 10px;
  display:none;align-items:center;gap:8px;box-shadow:var(--shadow)}
#bulkbalk.zicht{display:flex}
#bulkbalk .nm{flex:1;font-weight:700;font-size:calc(14px * var(--t))}
#bulkbalk button{min-width:40px;min-height:40px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;background:rgba(255,255,255,.18)}
#bulkbalk button svg{width:18px;height:18px}

/* ---------- Focusmodus ---------- */
.focuskaart{background:var(--card);border-radius:20px;padding:26px 20px;box-shadow:var(--shadow);text-align:center;margin:18px 0}
.focuskaart .wat{font-size:calc(22px * var(--t));font-weight:700;line-height:1.3;margin-bottom:10px}
.focuskaart .waarom{font-size:calc(14px * var(--t));color:var(--muted);white-space:pre-wrap}
.focus-teller{font-size:calc(13px * var(--t));color:var(--faint);font-weight:700;letter-spacing:.04em;text-transform:uppercase}

/* ---------- Jaarheatmap ---------- */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:2px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.heat::-webkit-scrollbar{display:none}
.heat i{width:11px;height:11px;border-radius:3px;background:var(--line);display:block}
.heat i[data-n="1"]{background:color-mix(in srgb,var(--green) 45%,var(--line))}
.heat i[data-n="2"]{background:var(--green)}
.heat i.nvt{opacity:.35}

/* ---------- Vergrendeling ---------- */
#slot{position:fixed;inset:0;z-index:200;background:var(--bg);display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:30px}
#slot.zicht{display:flex}
.pincode{display:flex;gap:11px}
.pincode i{width:15px;height:15px;border-radius:50%;border:2px solid var(--line2);display:block}
.pincode i.vol{background:var(--accent);border-color:var(--accent)}
.cijfers{display:grid;grid-template-columns:repeat(3,76px);gap:12px;margin-top:6px}
.cijfers button{height:64px;border-radius:50%;background:var(--card);font-size:calc(24px * var(--t));font-weight:600;box-shadow:var(--shadow)}
.cijfers button.leeg{background:none;box-shadow:none}

/* ---------- Diversen uit de testrondes ---------- */
.uitklap{margin-top:7px;padding-left:2px;border-left:2px solid var(--line);padding-left:10px}
.uitklap .sub-regel{display:flex;align-items:center;gap:8px;min-height:36px;font-size:calc(14px * var(--t));color:var(--muted)}
.uitklap .sub-regel.af{text-decoration:line-through;opacity:.6}
.telbol{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;
  border-radius:11px;background:var(--accent);color:var(--accent-text);font-size:calc(11px * var(--t));font-weight:800}
nav#tabs .tab-badge{position:absolute;transform:translate(14px,-12px)}
nav#tabs button{position:relative}
.segment{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px}
.segment button{flex:1;min-height:38px;border-radius:9px;font-size:calc(13.5px * var(--t));font-weight:650;color:var(--muted)}
.segment button[aria-pressed="true"]{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.stap{display:flex;gap:10px;align-items:flex-start;padding:9px 0}
.stap .nr{width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
  font-size:calc(12px * var(--t));font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto}

/* ---------- Startscherm met 3D-knoppen ---------- */
.startgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin:14px 0 4px}
.knop3d{
  --k:var(--accent);
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;
  gap:8px;min-height:134px;padding:13px;border-radius:19px;text-align:left;color:#fff;
  background:linear-gradient(177deg,
    color-mix(in srgb,var(--k) 78%,#ffffff) 0%,
    var(--k) 46%,
    color-mix(in srgb,var(--k) 84%,#000000) 100%);
  box-shadow:
    0 6px 0 0 color-mix(in srgb,var(--k) 55%,#000000),
    0 11px 20px -4px color-mix(in srgb,var(--k) 45%,transparent),
    inset 0 1.5px 0 0 rgba(255,255,255,.42),
    inset 0 -2px 6px rgba(0,0,0,.18);
  transform:translateY(0);
  transition:transform .09s cubic-bezier(.3,.7,.4,1), box-shadow .09s;
  -webkit-tap-highlight-color:transparent;
}
.knop3d:active{
  transform:translateY(5px);
  box-shadow:
    0 1px 0 0 color-mix(in srgb,var(--k) 55%,#000000),
    0 3px 7px -2px color-mix(in srgb,var(--k) 40%,transparent),
    inset 0 1.5px 0 0 rgba(255,255,255,.3),
    inset 0 -1px 4px rgba(0,0,0,.2);
}
/* Elke knop heeft een eigen illustratie, rechtsboven in het paneel. */
.knop3d .ill3d{
  position:absolute;top:4px;right:4px;width:88px;height:70px;
  color:#fff;opacity:.9;pointer-events:none;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.18));
}
.knop3d .tekst3d{position:relative;z-index:1;max-width:100%}
.knop3d .nm3d{font-size:calc(16px * var(--t));font-weight:750;letter-spacing:-.01em;line-height:1.2;
  text-shadow:0 1px 1px rgba(0,0,0,.22)}
.knop3d .ds3d{font-size:calc(11.5px * var(--t));line-height:1.3;opacity:.88;font-weight:500}
.knop3d .bal3d{
  position:absolute;top:12px;left:13px;z-index:1;
  background:rgba(255,255,255,.28);border-radius:11px;min-width:25px;height:23px;
  display:flex;align-items:center;justify-content:center;padding:0 8px;
  font-size:calc(11.5px * var(--t));font-weight:800;text-shadow:none;
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
}
.knop3d.breed{grid-column:1 / -1;min-height:92px;flex-direction:row;align-items:center;gap:13px;padding:13px 16px}
.knop3d.breed .ill3d{top:50%;right:8px;transform:translateY(-50%);width:82px;height:66px}
.knop3d.breed .tekst3d{flex:1 1 auto;min-width:0;margin-right:86px}
.knop3d.breed .bal3d{top:50%;left:auto;right:96px;transform:translateY(-50%)}
html[data-rust="1"] .knop3d{
  background:var(--card);color:var(--text);
  box-shadow:0 3px 0 0 var(--line2),0 5px 12px rgba(0,0,0,.08),inset 0 1px 0 rgba(255,255,255,.4);
}
html[data-rust="1"] .knop3d .ill3d{color:var(--k);opacity:.26;filter:none}
html[data-rust="1"] .knop3d .nm3d{text-shadow:none}
html[data-rust="1"] .knop3d .bal3d{background:var(--card2);color:var(--muted)}
@media (prefers-reduced-motion:reduce){.knop3d:active{transform:none}}
.startstrip{
  display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:15px;
  background:var(--card);box-shadow:var(--shadow);margin-top:10px;width:100%;text-align:left;min-height:var(--tap);
}
.startstrip .nm{flex:1;font-size:calc(14.5px * var(--t))}

/* ==================== Tijdlijn op het Vandaag-scherm ==================== */
.tl2-balk{
  position:sticky;top:0;z-index:14;background:var(--bg);
  margin:0 -14px;padding:6px 14px 7px;
  box-shadow:0 6px 10px -8px rgba(0,0,0,.18);
}
.tl2-laatst{
  display:flex;align-items:center;gap:8px;width:100%;min-height:36px;
  font-size:calc(12.5px * var(--t));color:var(--muted);text-align:left;
}
.tl2-laatst .stip{width:8px;height:8px;border-radius:50%;background:var(--green);flex:0 0 auto}
.tl2-laatst .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl2-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:3px 0 1px}
.tl2-chips::-webkit-scrollbar{display:none}
.tl2-chip{
  flex:0 0 auto;min-height:32px;padding:0 11px;border-radius:9px;background:var(--card2);
  font-size:calc(12.5px * var(--t));font-weight:650;color:var(--muted);
  display:inline-flex;align-items:center;gap:5px;border:1.5px solid transparent;
}
.tl2-chip .stip{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.75}
.tl2-chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.tl2-chip[aria-pressed="false"] .stip{opacity:.3}

.tl2{position:relative;padding:4px 0 40px}
.tl2::before{
  content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;
  background:var(--line);border-radius:1px;
}
/* dikke lijn = nieuwe week */
.tl2-week{position:relative;z-index:3;display:flex;align-items:center;gap:9px;margin:18px 0 4px}
.tl2-week::before,.tl2-week::after{content:"";flex:1;height:3px;background:var(--line2);border-radius:2px}
.tl2-week b{
  font-size:calc(10.5px * var(--t));font-weight:800;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);background:var(--bg);padding:0 4px;white-space:nowrap;
}
/* dunne lijn = nieuwe dag */
.tl2-dag{position:relative;min-height:58px;padding:0 0 4px}
.tl2-dag::before{
  content:"";position:absolute;left:50%;top:0;width:28px;height:1.5px;margin-left:-14px;
  background:var(--line);
}
.tl2-tickrij{position:relative;display:flex;justify-content:center;min-height:46px;align-items:center;z-index:2}
.tl2-tick{
  min-width:48px;min-height:44px;padding:0 6px;border-radius:13px;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;
}
.tl2-tick b{font-size:calc(15px * var(--t));font-weight:800;letter-spacing:-.02em}
.tl2-tick span{font-size:calc(9.5px * var(--t));color:var(--faint);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.tl2-dag.leeg .tl2-tick b{color:var(--faint);font-weight:600}
.tl2-dag.nu > .tl2-tickrij .tl2-tick{background:var(--accent);color:var(--accent-text);box-shadow:0 2px 10px -2px var(--accent)}
.tl2-dag.nu > .tl2-tickrij .tl2-tick span{color:var(--accent-text);opacity:.85}
.tl2-dag.nu{background:color-mix(in srgb, var(--accent) 7%, transparent);border-radius:16px}
.tl2-dag.later .tl2-tick b{opacity:.75}
.tl2-dag.maandstart::after{
  content:attr(data-maand);position:absolute;left:0;top:14px;
  font-size:calc(10px * var(--t));font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);
}

.tl2-rij{position:relative;display:grid;grid-template-columns:1fr 54px 1fr;align-items:start;margin:3px 0;z-index:1}
.tl2-rij::before{content:"";position:absolute;top:20px;height:2px;width:17px;background:var(--dot);opacity:.5}
.tl2-rij.links::before{right:calc(50% + 6px)}
.tl2-rij.rechts::before{left:calc(50% + 6px)}
.tl2-rij::after{
  content:"";position:absolute;top:15px;left:50%;transform:translateX(-50%);
  width:11px;height:11px;border-radius:50%;background:var(--dot);border:2.5px solid var(--bg);z-index:2;
}
.tl2-rij.gepland::after{background:var(--bg);border-color:var(--dot)}
.tl2-kaart{
  background:var(--card);border-radius:13px;box-shadow:var(--shadow);padding:8px 11px;
  text-align:left;min-height:44px;width:100%;display:block;
  border-left:3px solid var(--dot);
}
.tl2-rij.links .tl2-kaart{grid-column:1;border-left:0;border-right:3px solid var(--dot)}
.tl2-rij.rechts .tl2-kaart{grid-column:3}
.tl2-kaart.gepland{background:transparent;border:1.5px dashed var(--dot);box-shadow:none}
.tl2-kaart .t{font-size:calc(10.5px * var(--t));color:var(--faint);font-weight:700;letter-spacing:.03em}
.tl2-kaart .s{font-size:calc(13.5px * var(--t));line-height:1.32;margin-top:1px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tl2-kaart:active{transform:scale(.98)}

#naarvandaag{
  position:fixed;left:50%;transform:translateX(-50%) translateY(10px);bottom:calc(var(--navh) + 12px);z-index:44;
  background:var(--accent);color:var(--accent-text);border-radius:999px;padding:0 16px;min-height:40px;
  display:none;align-items:center;gap:7px;font-size:calc(13.5px * var(--t));font-weight:700;
  box-shadow:0 4px 14px -2px var(--accent);opacity:0;transition:opacity .2s,transform .2s;
}
#naarvandaag.zicht{display:flex;opacity:1;transform:translateX(-50%) translateY(0)}
#naarvandaag svg{width:15px;height:15px}

/* ==================== Dagpaneel op het Nieuw-scherm ==================== */
.dagpaneel{
  background:var(--card);border-radius:19px;box-shadow:var(--shadow);
  padding:14px;margin:10px 0 4px;overflow:hidden;
}
.dp-kop{display:flex;align-items:center;gap:12px}
.dp-datum{font-size:calc(17px * var(--t));font-weight:750;letter-spacing:-.01em;line-height:1.2}
.dp-sub{font-size:calc(12.5px * var(--t));color:var(--muted);margin-top:2px}
.dp-kop .ring{width:52px;height:52px;font-size:calc(12px * var(--t))}
.dp-kop .ring>span{width:41px;height:41px}
.dp-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:13px}
.dp-stat{
  background:var(--card2);border-radius:12px;padding:8px 4px;text-align:center;min-height:56px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
}
.dp-stat b{font-size:calc(19px * var(--t));font-weight:800;line-height:1.1;letter-spacing:-.02em}
.dp-stat span{font-size:calc(10.5px * var(--t));color:var(--muted);font-weight:600}
.dp-stat.alarm{background:var(--red-soft)}
.dp-stat.alarm b{color:var(--red)}
.dp-volgende{
  display:flex;align-items:center;gap:10px;margin-top:11px;padding:10px 12px;border-radius:12px;
  background:var(--accent-soft);color:var(--accent);width:100%;text-align:left;min-height:var(--tap);
}
.dp-volgende .tijd{font-weight:800;font-variant-numeric:tabular-nums;font-size:calc(14px * var(--t))}
.dp-volgende .wat{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:calc(13.5px * var(--t));font-weight:600}
.dp-weekstrip{display:flex;gap:4px;align-items:flex-end;height:44px;margin-top:13px}
.dp-weekstrip button{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%;
  min-height:44px;border-radius:7px;
}
.dp-weekstrip .st{width:100%;max-width:26px;background:var(--accent);border-radius:4px;min-height:3px;opacity:.5}
.dp-weekstrip button.nu .st{opacity:1}
.dp-weekstrip button.toekomst .st{background:var(--line2);opacity:.6}
.dp-weekstrip .dg{font-size:calc(9.5px * var(--t));color:var(--faint);font-weight:700}
.dp-weekstrip button.nu .dg{color:var(--accent)}
.dp-knoppen{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:13px}
.dp-knop{
  background:var(--card2);border-radius:12px;min-height:46px;display:flex;align-items:center;
  justify-content:center;gap:6px;font-size:calc(13.5px * var(--t));font-weight:650;
}
.dp-knop svg{width:16px;height:16px;color:var(--accent)}
.dp-knop:active{background:var(--line)}

/* ==================== Week-, maand- en vooruitblikoverzicht ============ */
.ov-nav{display:flex;align-items:center;gap:8px;margin:10px 0 4px}
.ov-nav b{flex:1;text-align:center;font-size:calc(16px * var(--t));font-weight:750}
.ov-dag{
  display:flex;align-items:center;gap:11px;width:100%;padding:10px 13px;min-height:var(--tap);
  border-bottom:1px solid var(--line);text-align:left;
}
.ov-dag:last-child{border-bottom:0}
.ov-dag .kop{width:44px;flex:0 0 auto;text-align:center}
.ov-dag .kop b{display:block;font-size:calc(16px * var(--t));font-weight:800;line-height:1.05}
.ov-dag .kop span{font-size:calc(9.5px * var(--t));color:var(--faint);text-transform:uppercase;font-weight:700}
.ov-dag.nu .kop b{color:var(--accent)}
.ov-dag .mid{flex:1;min-width:0}
.ov-dag .balkjes{display:flex;gap:3px;margin-top:5px}
.ov-dag .bj{height:6px;border-radius:3px;min-width:4px}
.ov-dag .lbl{font-size:calc(12.5px * var(--t));color:var(--muted)}
.ov-dag.vrij .lbl{color:var(--faint);font-style:italic}
.ov-heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.ov-heat .cel{
  aspect-ratio:1;border-radius:9px;background:var(--card2);position:relative;
  display:flex;align-items:flex-start;justify-content:flex-end;padding:3px 5px;
  font-size:calc(10.5px * var(--t));font-weight:700;color:var(--muted);min-height:38px;
}
.ov-heat .cel.buiten{opacity:.3}
.ov-heat .cel.nu{outline:2.5px solid var(--accent);outline-offset:-2px}
.ov-heat .cel .vul{position:absolute;left:4px;right:4px;bottom:4px;border-radius:5px;background:var(--accent);opacity:.75}
.ov-heat .cel.toekomst .vul{background:var(--line2)}
.ov-legenda{display:flex;align-items:center;gap:7px;justify-content:center;margin-top:9px;
  font-size:calc(11px * var(--t));color:var(--faint)}
.ov-legenda i{width:13px;height:13px;border-radius:4px;background:var(--accent);display:block}
.vb-staaf{display:flex;align-items:flex-end;gap:4px;height:96px;margin-top:6px}
.vb-staaf button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;min-height:44px}
.vb-staaf .st{width:100%;max-width:22px;border-radius:5px 5px 2px 2px;background:var(--accent);min-height:3px}
.vb-staaf .st.druk{background:var(--amber)}
.vb-staaf .st.vol{background:var(--red)}
.vb-staaf .dg{font-size:calc(9px * var(--t));color:var(--faint);font-weight:700}
.vb-staaf button.nu .dg{color:var(--accent)}

/* ==================== Dag uitvergroot: agenda per uur ==================== */
.ag-heledag{display:flex;gap:9px;align-items:flex-start;background:var(--card);border-radius:13px;
  padding:9px 11px;box-shadow:var(--shadow);margin:8px 0 12px}
.ag-heledag .lb{font-size:calc(10.5px * var(--t));font-weight:800;text-transform:uppercase;letter-spacing:.05em;
  color:var(--faint);flex:0 0 auto;padding-top:9px;width:44px}
.ag-heledag .rij{flex:1;display:flex;flex-wrap:wrap;gap:6px}
.ag-chip{
  display:flex;flex-direction:column;gap:1px;padding:6px 10px;border-radius:10px;min-height:var(--tap);
  justify-content:center;text-align:left;max-width:100%;
  background:color-mix(in srgb, var(--k) 15%, var(--card2));border-left:3px solid var(--k);
  font-size:calc(13px * var(--t));font-weight:600;
}
.ag-chip small{font-size:calc(10.5px * var(--t));color:var(--muted);font-weight:500}
.ag-chip.af{opacity:.6}
.ag-chip.af{text-decoration:line-through}
.ag-chip.af small{text-decoration:none}

.ag-wrap{position:relative;margin:2px 0 4px}
.ag-uur{display:grid;grid-template-columns:48px 1fr;height:var(--uh)}
.ag-uur .lb{font-size:calc(10.5px * var(--t));color:var(--faint);font-weight:700;text-align:right;
  padding-right:9px;transform:translateY(-6px);font-variant-numeric:tabular-nums}
.ag-uur .vak{border-top:1px solid var(--line);position:relative;border-radius:0}
.ag-uur .vak::after{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px dashed var(--line);opacity:.45}
.ag-uur .vak:active{background:var(--accent-soft)}
.ag-lagen{position:absolute;left:48px;right:0;top:0;bottom:0;pointer-events:none}
.ag-item{
  position:absolute;pointer-events:auto;border-radius:10px;padding:4px 8px;overflow:hidden;text-align:left;
  background:color-mix(in srgb, var(--k) 17%, var(--card));border-left:3px solid var(--k);
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:1px;z-index:2;
}
.ag-item .tt{font-size:calc(10px * var(--t));color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-item .ss{font-size:calc(13px * var(--t));font-weight:600;line-height:1.2;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ag-item.af .ss{text-decoration:line-through;opacity:.65}
.ag-item:active{transform:scale(.985)}
.ag-item.kort{flex-direction:row;align-items:center;gap:7px;padding:3px 8px}
.ag-item.kort .tt{flex:0 0 auto}
.ag-item.kort .ss{-webkit-line-clamp:1;font-size:calc(12.5px * var(--t))}
.ag-nu{position:absolute;left:40px;right:0;height:2px;background:var(--red);z-index:4;pointer-events:none}
.ag-nu::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--red)}

/* ==================== Werk ==================== */
:root{--werk:#c0202f;--werk-zacht:#fdeaec}
@media (prefers-color-scheme: dark){
  html:not([data-thema="licht"]){--werk:#ff6b76;--werk-zacht:#2d1519}
}
html[data-thema="donker"]{--werk:#ff6b76;--werk-zacht:#2d1519}
.chip.werk{background:var(--werk-zacht);color:var(--werk)}
.werkpil{
  display:inline-flex;align-items:center;gap:5px;min-height:34px;padding:0 10px;border-radius:10px;
  background:var(--card2);color:var(--muted);font-size:calc(12px * var(--t));font-weight:700;flex:0 0 auto;
}
.werkpil svg{width:15px;height:15px}
.werkpil[data-f="alleen"]{background:var(--werk-zacht);color:var(--werk)}
.werkpil[data-f="uit"]{background:var(--card2);color:var(--faint);text-decoration:line-through}
.werk-kop{
  background:linear-gradient(160deg, color-mix(in srgb,var(--werk) 88%,#fff) 0%, var(--werk) 60%, color-mix(in srgb,var(--werk) 86%,#000) 100%);
  color:#fff;border-radius:18px;padding:15px;box-shadow:0 8px 20px -8px var(--werk);margin:10px 0 4px;position:relative;overflow:hidden;
}
.werk-kop .ttl{font-size:calc(17px * var(--t));font-weight:750}
.werk-kop .sub{font-size:calc(12.5px * var(--t));opacity:.85;margin-top:2px}
.werk-kop .cijfers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.werk-kop .cf{background:rgba(255,255,255,.18);border-radius:11px;padding:7px 4px;text-align:center}
.werk-kop .cf b{display:block;font-size:calc(19px * var(--t));font-weight:800;line-height:1.1}
.werk-kop .cf span{font-size:calc(10px * var(--t));opacity:.9;font-weight:600}
.werk-kop .ill{position:absolute;right:-6px;top:-8px;width:92px;height:74px;opacity:.22;color:#fff}
.werkgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0 4px}
.werkknop{
  display:flex;align-items:center;gap:9px;background:var(--card);border-radius:13px;padding:11px;
  box-shadow:var(--shadow);min-height:56px;text-align:left;border-left:3px solid var(--k,var(--werk));
}
.werkknop svg{width:19px;height:19px;color:var(--k,var(--werk));flex:0 0 auto}
.werkknop .nm{font-size:calc(13.5px * var(--t));font-weight:650;line-height:1.2}
.docrij{display:flex;align-items:flex-start;gap:11px;width:100%;padding:11px 13px;border-bottom:1px solid var(--line);text-align:left;min-height:var(--tap)}
.docrij:last-child{border-bottom:0}
.docrij .nm{flex:1;min-width:0}
.docrij .nm b{font-size:calc(14.5px * var(--t));font-weight:650;display:block}
.statuschip{font-size:calc(10.5px * var(--t));font-weight:800;text-transform:uppercase;letter-spacing:.04em;
  padding:2px 7px;border-radius:7px;white-space:nowrap}
.statuschip.concept{background:var(--card2);color:var(--muted)}
.statuschip.actief{background:var(--green-soft);color:var(--green)}
.statuschip.afgerond{background:var(--accent-soft);color:var(--accent)}
.statuschip.archief{background:var(--card2);color:var(--faint)}
.mijlpaal{display:flex;align-items:center;gap:9px;padding:7px 0;min-height:44px;border-bottom:1px solid var(--line)}
.mijlpaal:last-child{border-bottom:0}
.mijlpaal .dt{font-size:calc(11px * var(--t));font-weight:800;color:var(--muted);width:66px;flex:0 0 auto}
.mijlpaal .tx{flex:1;min-width:0;font-size:calc(14px * var(--t))}
.mijlpaal.af .tx{text-decoration:line-through;color:var(--faint)}

/* ==================== Financieel ==================== */
.geldkaart{
  background:linear-gradient(160deg,#17a08f 0%, #0f766e 58%, #0b5d57 100%);
  color:#fff;border-radius:19px;padding:17px 16px;margin:10px 0 4px;
  box-shadow:0 9px 22px -9px #0f766e;text-align:center;
}
.geldkaart.op{background:linear-gradient(160deg,#e05561 0%, #c0202f 58%, #971a26 100%);box-shadow:0 9px 22px -9px #c0202f}
.geldkaart .lbl{font-size:calc(12.5px * var(--t));opacity:.88;font-weight:600}
.geldkaart .bedrag{font-size:calc(38px * var(--t));font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:3px 0 4px;
  font-variant-numeric:tabular-nums}
.geldkaart .knop{min-height:42px}

/* ==================== Vaste lasten: hangend bakje op een tijdlijn ==================== */
.segment.vier button{font-size:calc(12px * var(--t));padding:0 2px;white-space:nowrap}
.segment.vijf{flex-wrap:wrap}
.segment.vijf button{flex:1 1 30%;min-height:34px;font-size:calc(12px * var(--t));padding:5px 2px;white-space:nowrap}
.vl-kaart{background:var(--card);border-radius:17px;box-shadow:var(--shadow);padding:14px 10px 10px;margin:10px 0 4px;overflow:hidden}
.vl-lijn{position:relative;height:190px;margin-top:10px;touch-action:pan-y}
.vl-rail{position:absolute;left:0;right:0;top:96px;height:3px;border-radius:2px;z-index:1;
  background:linear-gradient(90deg,var(--line) 0%,var(--line2) 50%,var(--line) 100%)}
.vl-dagen{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;gap:1px}
.vl-dag{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;border-radius:8px;padding:0}
.vl-dag .blokken{height:94px;width:100%;display:flex;flex-direction:column-reverse;justify-content:flex-start;
  align-items:center;gap:2px;padding-bottom:1px}
.vl-dag .gat{height:60px}
.vl-dag .nr{font-size:calc(11px * var(--t));font-weight:800;color:var(--faint);line-height:1.05}
.vl-dag .dg{font-size:calc(8.5px * var(--t));color:var(--faint);text-transform:uppercase;letter-spacing:.04em}
.vl-dag.vandaag .nr,.vl-dag.vandaag .dg{color:var(--green)}
.vl-dag.verleden{background:color-mix(in srgb,var(--line) 30%,transparent)}
.vl-dag .tik{position:absolute;top:96px;width:1.5px;height:8px;background:var(--line2);z-index:2}
.vl-dag.vandaag .tik{background:var(--green);width:3px;height:12px}
.vl-blok{
  width:76%;min-height:14px;border-radius:5px;background:var(--k,#0f766e);color:#fff;
  font-size:calc(8.5px * var(--t));font-weight:800;display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 3px rgba(0,0,0,.2);transition:opacity .35s, filter .35s;overflow:hidden;flex:0 0 auto;
}
.vl-blok.betaald{opacity:.4;filter:saturate(.4);box-shadow:none;
  outline:1.5px dashed color-mix(in srgb,var(--k) 55%,transparent);outline-offset:-2px}
.vl-bakje{position:absolute;top:96px;z-index:4;display:flex;flex-direction:column;align-items:center;pointer-events:none}
.vl-bakje.glij{transition:left .5s cubic-bezier(.34,.8,.3,1)}
.vl-haak{width:11px;height:11px;border-radius:50%;background:var(--card);border:2.5px solid var(--green);margin-top:-5px;z-index:2}
.vl-touw{width:2px;height:12px;background:var(--line2)}
.vl-pot{
  position:relative;
  background:linear-gradient(170deg,#17a08f,#0f766e);color:#fff;border-radius:10px 10px 14px 14px;
  padding:5px 11px 7px;box-shadow:0 6px 13px -5px rgba(15,118,110,.8);
  font-weight:800;font-size:calc(14px * var(--t));white-space:nowrap;font-variant-numeric:tabular-nums;
  transform-origin:top center;animation:vlzwaai 4.5s ease-in-out infinite;text-align:center;
}
.vl-pot small{display:block;font-size:calc(8px * var(--t));font-weight:600;opacity:.85;letter-spacing:.04em;text-transform:uppercase}
.vl-pot.leeg{background:linear-gradient(170deg,#94a3b8,#64748b);box-shadow:0 6px 13px -5px rgba(100,116,139,.6)}
@keyframes vlzwaai{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@media (prefers-reduced-motion:reduce){.vl-pot{animation:none}.vl-bakje.glij{transition:none}}
.vl-legenda{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px;
  font-size:calc(10.5px * var(--t));color:var(--faint)}
.vl-legenda i{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.vl-rij{display:flex;align-items:center;gap:10px;width:100%;padding:10px 13px;min-height:var(--tap);
  border-bottom:1px solid var(--line);text-align:left}
.vl-rij:last-child{border-bottom:0}
.vl-rij .nm{flex:1;min-width:0}
.vl-rij .nm b{font-weight:650;font-size:calc(14.5px * var(--t));display:block}

/* ==================== Rookvrij ==================== */
.rookwidget{
  position:relative;overflow:hidden;width:100%;text-align:left;display:block;
  background:linear-gradient(160deg,#3fae7a 0%, #17864f 58%, #106b3f 100%);
  color:#fff;border-radius:17px;padding:13px 14px;margin:12px 0 2px;
  box-shadow:0 8px 18px -8px rgba(16,107,63,.8);
}
.rookwidget .ill{position:absolute;right:-8px;top:-6px;width:88px;height:70px;opacity:.2;color:#fff}
.rookwidget .kop{display:flex;align-items:baseline;justify-content:space-between;gap:8px;position:relative}
.rookwidget .lb{font-size:calc(12px * var(--t));font-weight:650;opacity:.92;display:flex;align-items:center;gap:5px}
.rookwidget .lb svg{width:14px;height:14px}
.rookwidget .dg{font-size:calc(13px * var(--t));font-weight:800;opacity:.95;white-space:nowrap}
.rookwidget .cijfers{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px;position:relative}
.rookwidget .cf{background:rgba(255,255,255,.2);border-radius:11px;padding:8px 6px;text-align:center}
.rookwidget .cf b{display:block;font-size:calc(18px * var(--t));font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
.rookwidget .cf span{font-size:calc(10px * var(--t));opacity:.92;font-weight:600}
.rookwidget .volgende{display:block;margin-top:9px;font-size:calc(11px * var(--t));opacity:.88;position:relative}
.rookkaart{
  position:relative;overflow:hidden;text-align:center;
  background:linear-gradient(160deg,#3fae7a 0%, #17864f 58%, #106b3f 100%);
  color:#fff;border-radius:19px;padding:18px 16px 16px;margin:10px 0 2px;
  box-shadow:0 9px 22px -9px rgba(16,107,63,.85);
}
.rookkaart .ill{position:absolute;right:-10px;top:-8px;width:104px;height:84px;opacity:.2;color:#fff}
.rookkaart .lb{font-size:calc(12.5px * var(--t));opacity:.92;font-weight:600;position:relative;
  display:flex;align-items:center;justify-content:center;gap:6px}
.rookkaart .lb svg{width:15px;height:15px}
.rookkaart .groot{font-size:calc(52px * var(--t));font-weight:800;letter-spacing:-.03em;line-height:1.05;
  margin:4px 0 2px;position:relative;font-variant-numeric:tabular-nums}
.mijlrij{display:flex;flex-wrap:wrap;gap:7px}
.mijl{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:58px;flex:1;
  background:var(--card2);border-radius:11px;padding:8px 4px;text-align:center}
.mijl b{font-size:calc(13px * var(--t));font-weight:800;color:var(--muted);display:flex;align-items:center;justify-content:center;min-height:17px}
.mijl small{font-size:calc(9px * var(--t));color:var(--faint);line-height:1.15}
.mijl.af{background:var(--green-soft)}
.mijl.af b{color:var(--green)}
.mijl.af small{color:var(--green);opacity:.85}

@media (min-width:640px){
  #app{max-width:720px;margin:0 auto;box-shadow:0 0 0 1px var(--line)}
  nav#tabs{max-width:720px;margin:0 auto}
  #timerbalk{max-width:704px;margin:0 auto}
  .blad{max-width:720px;margin:0 auto}
  .stats{grid-template-columns:repeat(4,1fr)}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

<script>
"use strict";
/* ==========================================================================
   1. Hulpjes
   ========================================================================== */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const ico = (naam, stijl) => `<svg${stijl ? ' style="' + stijl + '"' : ""}><use href="#i-${naam}"/></svg>`;
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));

let toastTimer = null;
function toast(tekst, actieLabel, actieFn, ms) {
  const el = $("#toast");
  el.innerHTML = `<span>${esc(tekst)}</span>`;
  if (actieLabel) {
    const b = document.createElement("button");
    b.textContent = actieLabel;
    b.onclick = () => { el.classList.remove("zicht"); actieFn && actieFn(); };
    el.appendChild(b);
  }
  el.classList.add("zicht");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("zicht"), ms || (actieLabel ? 5200 : 2400));
}
function tril(ms) { try { if (inst("trillen", true) && navigator.vibrate) navigator.vibrate(ms || 8); } catch (e) {} }

/* ==========================================================================
   2. Datum & tijd
   ========================================================================== */
const DAGNAMEN = ["zondag", "maandag", "dinsdag", "woensdag", "donderdag", "vrijdag", "zaterdag"];
const DAGKORT  = ["zo", "ma", "di", "wo", "do", "vr", "za"];
const MAANDNAMEN = ["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];
const MAANDKORT  = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];

const dISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const vandaagISO = () => dISO(new Date());
const parseISO = s => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, m - 1, d, 12, 0, 0); };
const plusDagen = (iso, n) => { const d = parseISO(iso); d.setDate(d.getDate() + n); return dISO(d); };
const plusMaanden = (iso, n) => {
  const d = parseISO(iso); const dag = d.getDate();
  d.setDate(1); d.setMonth(d.getMonth() + n);
  d.setDate(Math.min(dag, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate()));
  return dISO(d);
};
const nuTijd = () => { const d = new Date(); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
const dagVerschil = (a, b) => Math.round((parseISO(a) - parseISO(b)) / 86400000);
const weekdagVan = iso => parseISO(iso).getDay();
/** maandag = start van de week */
function weekStart(iso) { const d = parseISO(iso); const w = (d.getDay() + 6) % 7; return plusDagen(iso, -w); }
function weekNummer(iso) {
  const d = parseISO(iso); const t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  t.setDate(t.getDate() + 3 - ((t.getDay() + 6) % 7));
  const eerste = new Date(t.getFullYear(), 0, 4);
  return 1 + Math.round(((t - eerste) / 86400000 - 3 + ((eerste.getDay() + 6) % 7)) / 7);
}
function datumLabel(iso, lang) {
  if (!iso) return "";
  const v = vandaagISO(), d = dagVerschil(iso, v), dt = parseISO(iso);
  if (d === 0) return "Vandaag";
  if (d === 1) return "Morgen";
  if (d === 2) return "Overmorgen";
  if (d === -1) return "Gisteren";
  if (!lang && d > 2 && d < 7) return DAGNAMEN[dt.getDay()][0].toUpperCase() + DAGNAMEN[dt.getDay()].slice(1);
  const jaar = dt.getFullYear() !== new Date().getFullYear() ? " " + dt.getFullYear() : "";
  return `${DAGKORT[dt.getDay()]} ${dt.getDate()} ${MAANDKORT[dt.getMonth()]}${jaar}`;
}
function langDatumLabel(iso) {
  const dt = parseISO(iso);
  return `${DAGNAMEN[dt.getDay()]} ${dt.getDate()} ${MAANDNAMEN[dt.getMonth()]} ${dt.getFullYear()}`;
}
const isVerleden = (iso, tijd) => {
  if (!iso) return false;
  const v = vandaagISO();
  if (iso < v) return true;
  if (iso > v) return false;
  return tijd ? tijd < nuTijd() : false;
};
function duurTekst(min) {
  if (!min) return "";
  if (min < 60) return min + " min";
  const u = Math.floor(min / 60), m = min % 60;
  return m ? `${u} u ${m} m` : `${u} uur`;
}
function secTekst(sec) {
  const u = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return u ? `${u}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}

/* ==========================================================================
   3. Opslag — IndexedDB
   ========================================================================== */
const DB_NAAM = "futureme", DB_VERSIE = 4;
const WINKELS = {
  taken: "id", projecten: "id", labels: "id", afspraken: "id", checklists: "id",
  gewoontes: "id", gewoontelog: "id", dagboek: "id", tijdlog: "id",
  personen: "id", bijlagen: "id", filters: "id", gebeurtenissen: "id",
  werkdocs: "id", uitgaven: "id", incassos: "id", potjes: "id", instellingen: "sleutel"
};
let db = null;

function openDB() {
  return new Promise((res, rej) => {
    let v;
    try { v = indexedDB.open(DB_NAAM, DB_VERSIE); }
    catch (e) { return rej(e); }
    v.onupgradeneeded = e => {
      const d = e.target.result;
      for (const [naam, sleutel] of Object.entries(WINKELS))
        if (!d.objectStoreNames.contains(naam)) d.createObjectStore(naam, { keyPath: sleutel });
    };
    v.onsuccess = () => res(v.result);
    v.onerror = () => rej(v.error);
    v.onblocked = () => rej(new Error("Database geblokkeerd — sluit andere tabbladen van deze app."));
  });
}
function idbAlles(winkel) {
  return new Promise((res, rej) => {
    const r = db.transaction(winkel, "readonly").objectStore(winkel).getAll();
    r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error);
  });
}
function idbZet(winkel, obj) {
  return new Promise((res, rej) => {
    const t = db.transaction(winkel, "readwrite");
    t.objectStore(winkel).put(obj);
    t.oncomplete = () => res(obj); t.onerror = () => rej(t.error);
  });
}
function idbWis(winkel, sleutel) {
  return new Promise((res, rej) => {
    const t = db.transaction(winkel, "readwrite");
    t.objectStore(winkel).delete(sleutel);
    t.oncomplete = () => res(); t.onerror = () => rej(t.error);
  });
}
function idbLeeg(winkel) {
  return new Promise((res, rej) => {
    const t = db.transaction(winkel, "readwrite");
    t.objectStore(winkel).clear();
    t.oncomplete = () => res(); t.onerror = () => rej(t.error);
  });
}

/* Alles in het geheugen; elke wijziging wordt meteen weggeschreven. */
const S = {
  taken: [], projecten: [], labels: [], afspraken: [], checklists: [],
  gewoontes: [], gewoontelog: [], dagboek: [], tijdlog: [],
  personen: [], bijlagen: [], filters: [], gebeurtenissen: [], werkdocs: [],
  uitgaven: [], incassos: [], potjes: [], instellingen: {}
};
const vind = (lijst, id) => S[lijst].find(x => x.id === id);

async function bewaar(winkel, obj) {
  const lijst = S[winkel];
  const i = lijst.findIndex(x => x.id === obj.id);
  if (i >= 0) lijst[i] = obj; else lijst.push(obj);
  try { await idbZet(winkel, obj); } catch (e) { opslagFout(e); }
  return obj;
}
async function verwijder(winkel, id) {
  const i = S[winkel].findIndex(x => x.id === id);
  if (i >= 0) S[winkel].splice(i, 1);
  try { await idbWis(winkel, id); } catch (e) { opslagFout(e); }
}
async function zetInst(sleutel, waarde) {
  S.instellingen[sleutel] = waarde;
  try { await idbZet("instellingen", { sleutel, waarde }); } catch (e) { opslagFout(e); }
}
const inst = (sleutel, standaard) =>
  S.instellingen[sleutel] === undefined ? standaard : S.instellingen[sleutel];

function opslagFout(e) {
  console.error("Opslagfout:", e);
  toast("Opslaan mislukt — maak een back-up", "Back-up", () => ga("backup"), 8000);
}

async function logGebeurtenis(soort, tekst, refId, extra) {
  const g = Object.assign({
    id: uid(), soort, tekst, refId: refId || null,
    ts: new Date().toISOString(), datum: vandaagISO()
  }, extra || {});
  await bewaar("gebeurtenissen", g);
  return g;
}

/* ==========================================================================
   4. PWA — icoon, manifest, service worker, opslag vastzetten
   ========================================================================== */
const PWA = { manifest: false, sw: "niet geprobeerd", persist: "onbekend", standalone: false };

function maakIcoonPNG(maat) {

function volgendeDatum(iso, h) {
  if (!h) return null;
  const basis = (iso && iso >= vandaagISO()) ? iso : vandaagISO();
  const elke = h.elke || 1;
  if (h.soort === "dag") return plusDagen(basis, elke);
  if (h.soort === "week") {
    if (h.dagen && h.dagen.length) {
      for (let i = 1; i <= 21; i++) { const d = plusDagen(basis, i); if (h.dagen.includes(weekdagVan(d))) return d; }
    }
    return plusDagen(basis, 7 * elke);
  }
  if (h.soort === "maand") {
    if (h.dagVanMaand) {
      let d = plusMaanden(basis, elke);
      const dt = parseISO(d);
      const laatste = new Date(dt.getFullYear(), dt.getMonth() + 1, 0).getDate();
      return `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(Math.min(h.dagVanMaand, laatste))}`;
    }
    return plusMaanden(basis, elke);
  }
  if (h.soort === "jaar") return plusMaanden(basis, 12 * elke);
  return null;
}

function herhaalTekst(h) {
  if (!h) return "";
  const e = h.elke || 1;
  if (h.soort === "week" && h.dagen && h.dagen.length) {
    if (h.dagen.join() === "1,2,3,4,5") return "elke werkdag";
    if (h.dagen.join() === "0,6") return "elk weekend";
    return "elke " + h.dagen.map(d => DAGKORT[d]).join(", ");
  }
  if (h.soort === "maand" && h.dagVanMaand) return `elke ${h.dagVanMaand}e van de maand`;
  const woord = { dag: e === 1 ? "dag" : "dagen", week: e === 1 ? "week" : "weken", maand: e === 1 ? "maand" : "maanden", jaar: e === 1 ? "jaar" : "jaar" }[h.soort] || h.soort;
  return e === 1 ? `elke ${woord}` : `elke ${e} ${woord}`;
}

/** Chips die tonen wat de parser herkende. */
function parserChips(p) {
  const c = [];
  if (p.datum) c.push(`<span class="chip blauw">${ico("komend")}${esc(datumLabel(p.datum))}</span>`);
  if (p.tijd) c.push(`<span class="chip blauw">${ico("klok")}${esc(p.tijd)}</span>`);
  if (p.herhaal) c.push(`<span class="chip paars">${ico("herhaal")}${esc(herhaalTekst(p.herhaal))}</span>`);
  if (p.prioriteit < 4) c.push(`<span class="chip ${p.prioriteit === 1 ? "rood" : p.prioriteit === 2 ? "oranje" : "blauw"}">${ico("vlag")}P${p.prioriteit}</span>`);
  if (p.project) c.push(`<span class="chip groen">${ico("map")}${esc(p.project)}</span>`);
  p.labels.forEach(l => c.push(`<span class="chip">${ico("label")}${esc(l)}</span>`));
  p.personen.forEach(l => c.push(`<span class="chip">${ico("persoon")}${esc(l)}</span>`));
  if (p.duur) c.push(`<span class="chip oranje">${ico("tijd")}${esc(duurTekst(p.duur))}</span>`);
  if (p.energie) c.push(`<span class="chip">${ico("bliksem")}${esc(p.energie)}</span>`);
  return c.join("");
}

/* ==========================================================================
   7. Agenda-export (.ics)
   ========================================================================== */
const icsEsc = s => String(s == null ? "" : s)
  .replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
function icsVouw(regel) {
  if (regel.length <= 73) return regel;
  let uit = regel.slice(0, 73), rest = regel.slice(73);
  while (rest.length > 72) { uit += "\r\n " + rest.slice(0, 72); rest = rest.slice(72); }
  return uit + (rest ? "\r\n " + rest : "");
}
const icsStempel = () => new Date().toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
const icsDatum = iso => iso.replace(/-/g, "");
const icsDatumTijd = (iso, tijd) => iso.replace(/-/g, "") + "T" + (tijd || "09:00").replace(":", "") + "00";
const ICS_DAG = ["SU", "MO", "TU", "WE", "TH", "FR", "SA"];

function icsRrule(h) {
  if (!h) return null;
  const e = h.elke || 1;
  if (h.soort === "dag") return `FREQ=DAILY${e > 1 ? ";INTERVAL=" + e : ""}`;
  if (h.soort === "week") {
    let r = `FREQ=WEEKLY${e > 1 ? ";INTERVAL=" + e : ""}`;
    if (h.dagen && h.dagen.length) r += ";BYDAY=" + h.dagen.map(d => ICS_DAG[d]).join(",");
    return r;
  }
  if (h.soort === "maand") return `FREQ=MONTHLY${e > 1 ? ";INTERVAL=" + e : ""}${h.dagVanMaand ? ";BYMONTHDAY=" + h.dagVanMaand : ""}`;
  if (h.soort === "jaar") return `FREQ=YEARLY${e > 1 ? ";INTERVAL=" + e : ""}`;
  return null;
}

function icsEvenement(o) {
  // o: {uid, titel, datum, tijd, eindTijd, duurMin, notitie, plek, herhaal, alarm}
  const L = ["BEGIN:VEVENT", "UID:" + (o.uid || uid()) + "@futureme", "DTSTAMP:" + icsStempel()];
  if (o.tijd) {
    L.push("DTSTART:" + icsDatumTijd(o.datum, o.tijd));
    let eind = o.eindTijd;
    if (!eind) {
      const [u, m] = o.tijd.split(":").map(Number);
      const tot = u * 60 + m + (o.duurMin || 30);
      eind = pad(Math.floor(tot / 60) % 24) + ":" + pad(tot % 60);
    }
    L.push("DTEND:" + icsDatumTijd(o.datum, eind));
  } else {
    L.push("DTSTART;VALUE=DATE:" + icsDatum(o.datum));
    L.push("DTEND;VALUE=DATE:" + icsDatum(plusDagen(o.eindDatum || o.datum, 1)));
  }
  L.push("SUMMARY:" + icsEsc(o.titel));
  if (o.notitie) L.push("DESCRIPTION:" + icsEsc(o.notitie));
  if (o.plek) L.push("LOCATION:" + icsEsc(o.plek));
  const rr = icsRrule(o.herhaal);
  if (rr) L.push("RRULE:" + rr);
  if (o.alarm !== false) {
    L.push("BEGIN:VALARM", "ACTION:DISPLAY",
      "DESCRIPTION:" + icsEsc(o.titel),
      "TRIGGER:" + (o.tijd ? "-PT" + (o.alarmMin == null ? 10 : o.alarmMin) + "M" : "PT9H"),
      "END:VALARM");
  }
  L.push("END:VEVENT");
  return L;
}

function icsBestand(evenementen) {
  const L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//FutureMe//NL", "CALSCALE:GREGORIAN", "METHOD:PUBLISH"];
  evenementen.forEach(e => L.push(...e));
  L.push("END:VCALENDAR");
  return L.map(icsVouw).join("\r\n") + "\r\n";
}

function taakNaarIcs(t) {
  if (!t.datum) return null;
  return icsEvenement({
    uid: t.id, titel: t.titel, datum: t.datum, tijd: t.tijd,
    duurMin: t.duur || 30, notitie: t.notitie, herhaal: t.herhaal,
    alarmMin: t.tijd ? 10 : null
  });
}
function afspraakNaarIcs(a) {
  const stuk = [];
  if (a.voorbereiding) stuk.push(a.voorbereiding);
  if (a.personen && a.personen.length) stuk.push("Met: " + a.personen.join(", "));
  if (a.deadline) stuk.push("Uiterlijk klaar op: " + a.deadline);
  // Zonder datum gebruiken we de deadline als dag in de agenda.
  const datum = a.datum || a.deadline;
  if (!datum) return null;
  const opDeadline = !a.datum;
  return icsEvenement({
    uid: a.id,
    titel: (opDeadline ? "Deadline: " : "") + a.titel,
    datum, tijd: opDeadline ? "" : a.tijd,
    eindTijd: a.eindTijd, duurMin: 60, plek: a.plek,
    eindDatum: !opDeadline && a.totDatum && a.totDatum !== a.datum ? a.totDatum : null,
    notitie: stuk.join("\n\n"), alarmMin: 15

}

/* ==========================================================================
   8. Filters & slimme lijsten
   ========================================================================== */
/**
 * Zoektaal: vandaag | morgen | week | achterstallig | geen-datum | af | open |
 *           p1..p4 | #project | @label | +persoon | vrije tekst
 */
function filterTaken(query, bron) {
  const taken = bron || S.taken;
  const q = (query || "").trim().toLowerCase();
  if (!q) return taken.filter(t => !t.af);
  const delen = q.split(/\s+/);
  const v = vandaagISO();
  let toonAf = false, alleenAf = false;
  const tests = [];
  for (const d of delen) {
    if (d === "af" || d === "afgerond" || d === "klaar") { alleenAf = true; toonAf = true; }
    else if (d === "open") tests.push(t => !t.af);
    else if (d === "alles") toonAf = true;
    else if (d === "vandaag") tests.push(t => t.datum && t.datum <= v);
    else if (d === "morgen") tests.push(t => t.datum === plusDagen(v, 1));
    else if (d === "week" || d === "deze-week") tests.push(t => t.datum && t.datum >= v && t.datum <= plusDagen(v, 7));
    else if (d === "achterstallig" || d === "te-laat") tests.push(t => t.datum && t.datum < v);
    else if (d === "geen-datum" || d === "zonder-datum") tests.push(t => !t.datum);
    else if (/^p[1-4]$/.test(d)) tests.push(t => t.prioriteit === +d[1]);
    else if (d[0] === "#") { const nm = d.slice(1); tests.push(t => { const p = vind("projecten", t.projectId); return p && p.naam.toLowerCase().includes(nm); }); }
    else if (d[0] === "@") { const nm = d.slice(1); tests.push(t => (t.labels || []).some(l => l.toLowerCase().includes(nm))); }
    else if (d[0] === "+") { const nm = d.slice(1); tests.push(t => (t.personen || []).some(l => l.toLowerCase().includes(nm))); }
    else tests.push(t => (t.titel + " " + (t.notitie || "") + " " + (t.labels || []).join(" ")).toLowerCase().includes(d));
  }
  return taken.filter(t => {
    if (alleenAf && !t.af) return false;
    if (!toonAf && t.af) return false;
    return tests.every(f => f(t));
  });
}

function taakZichtbaar(t) {
  if (t.af) return false;
  if (t.uitgesteldTot && t.uitgesteldTot > new Date().toISOString()) return false;
  return true;
}
function geblokkeerd(t) {
  return (t.hangtAf || []).some(id => { const a = vind("taken", id); return a && !a.af; });
}
function sorteerTaken(a, b) {
  if (!!a.af !== !!b.af) return a.af ? 1 : -1;
  const ad = a.datum || "9999-99-99", bd = b.datum || "9999-99-99";
  if (ad !== bd) return ad < bd ? -1 : 1;
  const at = a.tijd || "99:99", bt = b.tijd || "99:99";
  if (at !== bt) return at < bt ? -1 : 1;
  if (a.prioriteit !== b.prioriteit) return a.prioriteit - b.prioriteit;
  return (a.volgorde || 0) - (b.volgorde || 0);
}
