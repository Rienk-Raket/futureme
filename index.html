function vwVandaag() {
  const v = vandaagISO();
  const zichtbaar = openTaken();
  const laat = zichtbaar.filter(t => t.datum && t.datum < v).sort(sorteerTaken);
  const nu = zichtbaar.filter(t => t.datum === v).sort(sorteerTaken);
  const afVandaag = S.taken.filter(t => t.af && (t.afOp || "").slice(0, 10) === v && werkOk(t));
  const afspraken = S.afspraken.filter(a => a.datum === v && werkOk(a)).sort((a, b) => (a.tijd || "") < (b.tijd || "") ? -1 : 1);
  const gew = gewoontesVoor(v);
  let h = backupBanner();

  if (laat.length) {
    h += sectie("Achterstallig", laat.length, `<button class="actie" data-act="alles-vandaag">Alles naar vandaag</button>`);
    h += takenLijst(laat);
  }
  const deadlines = S.afspraken.filter(a => !a.uitkomst && a.deadline && a.deadline <= v && a.datum !== v && werkOk(a)).sort(afsprSorteer);
  if (afspraken.length || deadlines.length) {
    h += sectie("Afspraken", afspraken.length + deadlines.length, `<button class="actie" data-act="nieuwe-afspraak">Nieuw</button>`);
    h += `<div class="card">${afspraken.concat(deadlines).map(afspraakRij).join("")}</div>`;
  }
  h += sectie("Taken vandaag", nu.length, nu.length ? `<button class="actie" data-act="ga" data-view="kalender">Kalender</button>` : "");
  h += nu.length ? takenLijst(nu, { sleep: true }) :
    `<div class="card">${leeg("🌤️", "Niets gepland vandaag", "Leg iets vast via het veld hierboven, of pak iets uit je inbox.")}</div>`;

  if (gew.length) {
    const afG = gew.filter(g => gewoonteAf(g.id, v)).length;
    h += sectie("Gewoontes", `${afG}/${gew.length}`, `<button class="actie" data-act="ga" data-view="gewoontes">Alles</button>`);
    h += `<div class="card">${gew.map(g => gewoonteRij(g, v, true)).join("")}</div>`;
  }

  h += sectie("Wat past er nu?", null, "");
  h += `<div class="chiprij scroll" style="margin-bottom:6px">
    ${[5, 15, 30, 60, 120].map(m => `<button class="keuze" data-act="planmin" data-min="${m}" aria-pressed="${V.planMin === m}">${ico("bliksem")} ${m} min</button>`).join("")}
  </div>`;
  if (V.planMin) {
    const past = zichtbaar.filter(t => !geblokkeerd(t) && t.duur && t.duur <= V.planMin).sort(sorteerTaken).slice(0, 8);
    h += past.length ? takenLijst(past) : `<div class="card"><div class="leeg"><p>Geen taken met een geschatte duur van ${V.planMin} minuten of minder.</p><p class="klein">Tip: zet bij een taak een geschatte duur, of typ <code>~15m</code> bij het vastleggen.</p></div></div>`;
  }

  if (afVandaag.length) {
    h += sectie("Vandaag afgerond", afVandaag.length, `<button class="actie" data-act="ga" data-view="logboek">Logboek</button>`);
    h += takenLijst(afVandaag.slice(0, 8), { notitie: false });
  }
  const inboxAantal = openTaken().filter(t => !t.projectId).length;
  h += `<div class="chiprij scroll" style="margin-top:18px">
    <button class="keuze" data-act="ga" data-view="inbox">${ico("inbox")} Inbox${inboxAantal ? ` <span class="telbol">${inboxAantal}</span>` : ""}</button>
    <button class="keuze" data-act="ga" data-view="projecten">${ico("map")} Projecten</button>
    <button class="keuze" data-act="ga" data-view="kalender">${ico("komend")} Kalender</button>
    <button class="keuze" data-act="ga" data-view="checklists">${ico("lijst")} Checklists</button>
  </div>`;
  const dbVandaag = S.dagboek.find(d => d.datum === v);
  h += `<div style="margin-top:16px"><button class="knop breed rand" data-act="dagboek-nu">${ico("boek")} ${dbVandaag ? "Dagboek van vandaag bewerken" : "Dagboek van vandaag schrijven"}</button></div>`;
  return h;
}

function vwKomend() {
  const v = vandaagISO();
  let h = "";
  const zicht = openTaken();
  h += `<div class="chiprij scroll" style="margin-top:8px">` +
    Array.from({ length: 14 }, (_, i) => {
      const d = plusDagen(v, i);
      const n = zicht.filter(t => t.datum === d).length + S.afspraken.filter(a => a.datum === d && werkOk(a)).length;
      return `<button class="keuze" data-act="scroll-dag" data-datum="${d}" style="flex-direction:column;min-height:56px;padding:4px 10px">
        <span style="font-size:10px;opacity:.7">${DAGKORT[weekdagVan(d)]}</span>
        <span style="font-size:16px;font-weight:800">${parseISO(d).getDate()}</span>
        ${n ? `<span style="font-size:9px">${n}</span>` : `<span style="font-size:9px;opacity:.4">–</span>`}
      </button>`;
    }).join("") + `</div>`;

  for (let i = 0; i < 7; i++) {
    const d = plusDagen(v, i);
    const taken = zicht.filter(t => t.datum === d).sort(sorteerTaken);
    const afspr = S.afspraken.filter(a => a.datum === d && werkOk(a)).sort((a, b) => (a.tijd || "") < (b.tijd || "") ? -1 : 1);
    h += `<div class="dagkop" id="dag-${d}">${esc(datumLabel(d))} · ${parseISO(d).getDate()} ${MAANDKORT[parseISO(d).getMonth()]}</div>`;
    if (!taken.length && !afspr.length) h += `<div class="klein" style="padding:2px 2px 8px;color:var(--faint)">Vrij</div>`;
    if (afspr.length) h += `<div class="card">${afspr.map(afspraakRij).join("")}</div>`;
    if (taken.length) h += takenLijst(taken);
  }
  const later = zicht.filter(t => t.datum && t.datum > plusDagen(v, 6)).sort(sorteerTaken);
  if (later.length) { h += sectie("Later", later.length); h += takenLijst(later.slice(0, 20)); }
  return h;
}

function vwInbox() {
  const lijst = openTaken().filter(t => !t.projectId).sort(sorteerTaken);
  let h = sectie("Inbox", lijst.length, S.projecten.length ? `<button class="actie" data-act="ga" data-view="projecten">Projecten</button>` : "");
  h += lijst.length ? takenLijst(lijst, { sleep: true }) :
    `<div class="card">${leeg("📥", "Inbox is leeg", "Alles is ingedeeld in een project. Netjes.")}</div>`;
  const zonderDatum = openTaken().filter(t => !t.datum && t.projectId).sort(sorteerTaken);
  if (zonderDatum.length) { h += sectie("Wel een project, geen datum", zonderDatum.length); h += takenLijst(zonderDatum.slice(0, 25)); }
  return h;
}

const LOGFILTERS = [["alles", "Alles"], ["taak", "Taken"], ["afspraak", "Afspraken"], ["gewoonte", "Gewoontes"], ["dagboek", "Dagboek"], ["notitie", "Notities"], ["tijd", "Tijd"]];
function vwLogboek() {
  let h = `<div class="chiprij scroll" style="margin-top:8px">` +
    LOGFILTERS.map(([k, l]) => `<button class="keuze" data-act="logfilter" data-f="${k}" aria-pressed="${V.logFilter === k}">${l}</button>`).join("") +
    `</div>
    <button class="knop breed rand" style="margin:10px 0" data-act="snelle-notitie">${ico("pen")} Notitie in logboek zetten</button>`;
  let items = S.gebeurtenissen.slice();
  if (V.logFilter !== "alles") items = items.filter(g => g.soort === V.logFilter);
  items.sort((a, b) => a.ts < b.ts ? 1 : -1);
  if (!items.length) return h + `<div class="card">${leeg("📖", "Nog niets in het logboek", "Alles wat je afvinkt, afrondt of noteert komt hier chronologisch te staan.")}</div>`;
  let huidigeDag = "";
  h += `<div class="tijdlijn">`;
  items.slice(0, 400).forEach(g => {
    const dag = g.datum || g.ts.slice(0, 10);
    if (dag !== huidigeDag) {
      huidigeDag = dag;
      h += `</div><div class="dagkop">${esc(datumLabel(dag, true))}</div><div class="tijdlijn">`;
    }
    const kl = { taak: "taak-af", afspraak: "afspraak", gewoonte: "gewoonte", dagboek: "dagboek" }[g.soort] || "";
    h += `<div class="tl-item ${kl}" ${g.refId ? `data-act="log-open" data-soort="${g.soort}" data-id="${g.refId}"` : ""}>
      <div class="tl-tijd">${esc(g.ts.slice(11, 16))}${g.soort !== "taak" ? " · " + esc(g.soort) : ""}</div>
      <div class="tl-tekst">${esc(g.tekst)}</div>
    </div>`;
  });
  h += `</div>`;
  return h;
}

function vwProjecten() {
  let h = `<button class="knop breed primair" style="margin:10px 0" data-act="nieuw-project">${ico("plus")} Nieuw project</button>`;
  if (!S.projecten.length) return h + `<div class="card">${leeg("📁", "Nog geen projecten", "Typ <code>#naam</code> bij het vastleggen en het project wordt vanzelf gemaakt.")}</div>`;
  h += `<div class="card">` + S.projecten.slice().sort((a, b) => (a.volgorde || 0) - (b.volgorde || 0)).map(p => {
    const t = takenVanProject(p.id), open = t.filter(x => !x.af).length;

      <span class="kleurbol" style="background:${p.kleur}"></span>

function vwProject() {
  const p = vind("projecten", V.param);
  if (!p) return leeg("🤷", "Project bestaat niet meer");
  const alle = takenVanProject(p.id);
  const open = alle.filter(taakZichtbaar).sort(sorteerTaken);
  const af = alle.filter(t => t.af).sort((a, b) => (a.afOp || "") < (b.afOp || "") ? 1 : -1);
  const pct = alle.length ? Math.round(af.length / alle.length * 100) : 0;
  let h = `<div class="card card-pad" style="display:flex;align-items:center;gap:13px">
      <div class="ring" style="--p:${pct}"><span>${pct}%</span></div>
      <div style="flex:1"><b>${esc(p.naam)}</b><div class="klein">${open.length} open · ${af.length} afgerond</div></div>
      <button class="icon-btn" data-act="bewerk-project" data-id="${p.id}">${ico("pen")}</button>
    </div>`;
  h += sectie("Open", open.length);
  h += open.length ? takenLijst(open, { sleep: true }) : `<div class="card">${leeg("✅", "Alles af in dit project")}</div>`;
  if (af.length) { h += sectie("Afgerond", af.length); h += takenLijst(af.slice(0, 30), { notitie: false }); }
  return h;
}

function kalIncassoAan() {
  return typeof tlAan === "function" ? tlAan("incasso") : inst("tlFilter_incasso", true);
}
function kalIncassosIn(van, tot) {
  if (!kalIncassoAan()) return [];
  if (typeof werkStand === "function" && werkStand() === "alleen") return [];
  return typeof incassosIn === "function" ? incassosIn(van, tot) : [];
}
function vwKalender() {
  const sel = V.kalDatum, d = parseISO(sel);
  const eerste = new Date(d.getFullYear(), d.getMonth(), 1);
  const start = plusDagen(dISO(eerste), -((eerste.getDay() + 6) % 7));
  const incassoAan = kalIncassoAan();
  const einde = plusDagen(start, 41);
  const incassoPerDag = {};
  kalIncassosIn(start, einde).forEach(x => (incassoPerDag[x.datum] = incassoPerDag[x.datum] || []).push(x.incasso));
  let h = `<div class="card card-pad">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
      <button class="icon-btn" data-act="kal-maand" data-n="-1">${ico("pijll")}</button>
      <b style="flex:1;text-align:center;font-size:16px">${MAANDNAMEN[d.getMonth()]} ${d.getFullYear()}</b>
      <button class="icon-btn" data-act="kal-maand" data-n="1">${ico("pijlr")}</button>
    </div>
    <div style="display:flex;justify-content:flex-end;margin-bottom:8px">
      <button class="kal-tgl" data-act="tl-filter" data-f="incasso" aria-pressed="${incassoAan}">
        <span class="stip"></span>Incasso's ${incassoAan ? "tonen" : "verbergen"}</button>
    </div>
    <div class="kal-kop">${["ma","di","wo","do","vr","za","zo"].map(x => `<span>${x}</span>`).join("")}</div>
    <div class="kal">`;
  for (let i = 0; i < 42; i++) {
    const dag = plusDagen(start, i), dt = parseISO(dag);
    const taken = S.taken.filter(t => t.datum === dag && !t.af && werkOk(t));
    const afspr = S.afspraken.filter(a => a.datum === dag && werkOk(a));
    const incasso = incassoPerDag[dag] || [];
    const punten = [];
    if (taken.some(t => t.prioriteit === 1)) punten.push('<i class="kal-punt p1"></i>');
    if (taken.some(t => t.prioriteit !== 1)) punten.push('<i class="kal-punt"></i>');
    if (afspr.length) punten.push('<i class="kal-punt afspraak"></i>');
    if (incasso.length) punten.push('<i class="kal-punt incasso"></i>');
    h += `<button class="kal-dag${dt.getMonth() !== d.getMonth() ? " buiten" : ""}${dag === vandaagISO() ? " vandaag" : ""}"
      aria-pressed="${dag === sel}" data-act="kal-dag" data-datum="${dag}">
      ${dt.getDate()}<span class="kal-punten">${punten.join("")}</span></button>`;
  }
  h += `</div></div>`;
  const taken = S.taken.filter(t => t.datum === sel && werkOk(t)).sort(sorteerTaken);
  const afspr = S.afspraken.filter(a => a.datum === sel && werkOk(a)).sort((a, b) => (a.tijd || "") < (b.tijd || "") ? -1 : 1);
  const incasso = incassoPerDag[sel] || [];
  h += sectie(langDatumLabel(sel), taken.length + afspr.length + incasso.length,
    `<button class="actie" data-act="nieuw-op-datum" data-datum="${sel}">Toevoegen</button>`);
  if (incasso.length && typeof incassoRij === "function")
    h += `<div class="card">${incasso.map(i => incassoRij(i, sel)).join("")}</div>`;
  if (afspr.length) h += `<div class="card">${afspr.map(afspraakRij).join("")}</div>`;
  h += taken.length ? takenLijst(taken) : (afspr.length || incasso.length ? "" : `<div class="card">${leeg("📅", "Niets gepland")}</div>`);
  return h;
}

function checklistRij(c) {

  </div>
  <div class="knoprij" style="margin-top:9px">
    <button class="knop rand" data-act="cl-hernoem" data-id="${c.id}">${ico("pen")} Hernoemen</button>
    <button class="knop gevaar" data-act="cl-verwijder" data-id="${c.id}">${ico("prullenbak")} Verwijderen</button>
  </div>`;
  return h;
}

const AFSPRAAK_SOORTEN = {
  gesprek: { naam: "Gesprek", icoon: "groep", kleur: "paars" },
  toezegging: { naam: "Toezegging", icoon: "ketting", kleur: "blauw" }
};
const afspraakSoort = a => AFSPRAAK_SOORTEN[a.soort] ? a.soort : "gesprek";
function tijdspan(a) {
  if (!a.tijd) return "";
  return a.eindTijd ? a.tijd + "–" + a.eindTijd : a.tijd;
}
/** Korte omschrijving van wanneer een afspraak speelt. */
function afspraakWanneer(a) {
  const stuk = [];
  if (a.datum) {
    stuk.push(datumLabel(a.datum) + (a.totDatum && a.totDatum !== a.datum ? " t/m " + datumLabel(a.totDatum) : ""));
    if (tijdspan(a)) stuk.push(tijdspan(a));
  }
  if (a.deadline) stuk.push("uiterlijk " + datumLabel(a.deadline));
  if (!stuk.length) stuk.push("geen datum");
  return stuk.join(" · ");
}
const afspraakLaat = a => !!(a.deadline && !a.uitkomst && a.deadline < vandaagISO());
function afspraakRij(a) {
  const soort = afspraakSoort(a);
  const status = a.uitkomst ? "afgerond" : a.notities ? "bezig" : "";
  const laat = afspraakLaat(a);
  const links = a.datum
    ? `<span class="mono" style="display:block;font-size:15px;font-weight:800">${esc(a.tijd || "—")}</span>

        ${a.totDatum && a.totDatum !== a.datum ? `<span class="chip">${ico("komend")}t/m ${esc(datumLabel(a.totDatum))}</span>` : ""}
        ${a.deadline ? `<span class="chip ${laat ? "rood" : "oranje"}">${ico("klok")}uiterlijk ${esc(datumLabel(a.deadline))}</span>` : ""}

}
const afsprSorteer = (a, b) => ((a.datum || a.deadline || "9999") + (a.tijd || "")) < ((b.datum || b.deadline || "9999") + (b.tijd || "")) ? -1 : 1;

const AFSPR_FILTERS = [["alles", "Alles"], ["gesprek", "Gesprekken"], ["toezegging", "Toezeggingen"], ["open", "Lopend"], ["geweest", "Afgehandeld"]];
function vwAfspraken() {
  const v = vandaagISO();
  let lijst = S.afspraken.filter(werkOk);
  const f = V.afsprFilter;
  if (f === "gesprek" || f === "toezegging") lijst = lijst.filter(a => afspraakSoort(a) === f);
  else if (f === "open") lijst = lijst.filter(a => !a.uitkomst);
  else if (f === "geweest") lijst = lijst.filter(a => !!a.uitkomst);

  let h = `<div class="knoprij" style="margin:10px 0">

  </div>
  <div class="chiprij scroll">${AFSPR_FILTERS.map(([k, l]) =>
    `<button class="keuze" data-act="afsprfilter" data-f="${k}" aria-pressed="${f === k}">${l}</button>`).join("")}
    ${werkChip()}</div>`;

  if (!lijst.length && !S.afspraken.filter(werkOk).length)
    return h + `<div class="card">${leeg("🤝", "Nog geen afspraken", "Leg hier vast wat je met iemand hebt afgesproken: met wie, waarover, en wanneer het af moet zijn. Een datum is niet verplicht.")}</div>`;

  const laat = lijst.filter(a => afspraakLaat(a)).sort(afsprSorteer);
  const zonderDatum = lijst.filter(a => !a.datum && !afspraakLaat(a) && !a.uitkomst).sort(afsprSorteer);
  const komend = lijst.filter(a => a.datum && (a.totDatum || a.datum) >= v).sort(afsprSorteer);
  const gehad = lijst.filter(a => a.datum && (a.totDatum || a.datum) < v).sort((a, b) => afsprSorteer(b, a));
  const openGehad = gehad.filter(a => !a.uitkomst);

  if (laat.length) { h += sectie("Deadline verstreken", laat.length); h += `<div class="card">${laat.map(afspraakRij).join("")}</div>`; }
  if (komend.length) { h += sectie("Komend", komend.length); h += `<div class="card">${komend.map(afspraakRij).join("")}</div>`; }
  if (zonderDatum.length) {
    h += sectie("Zonder datum", zonderDatum.length, `<span class="telling">lopende afspraken</span>`);
    h += `<div class="card">${zonderDatum.map(afspraakRij).join("")}</div>`;
  }
  if (openGehad.length) {
    h += sectie("Nog afronden", openGehad.length, `<span class="telling">uitkomst ontbreekt</span>`);
    h += `<div class="card">${openGehad.slice(0, 10).map(afspraakRij).join("")}</div>`;

  if (gehad.length) { h += sectie("Geweest", gehad.length); h += `<div class="card">${gehad.slice(0, 40).map(afspraakRij).join("")}</div>`; }
  if (!laat.length && !komend.length && !zonderDatum.length && !gehad.length)
    h += `<div class="card">${leeg("🔍", "Niets in dit filter")}</div>`;
  return h;
}

/** Haalt zinnen met actiewoorden uit de notities en stelt ze voor als taak. */
function voorstelActies(a) {
  const tekst = [a.notities, a.uitkomst].filter(Boolean).join("\n");
  if (!tekst) return [];
  const woorden = /(afspraak|actie|todo|to-?do|ik ga|ik zal|ik stuur|mail|bel |bellen|opvolgen|nakijken|uitzoeken|regelen|checken|sturen|maken|plannen|terugkoppel|volgende stap)/i;
  return tekst.split(/\n|(?<=[.!?])\s+/)
    .map(z => z.replace(/^[-*•\s]+/, "").trim())
    .filter(z => z.length > 6 && z.length < 110 && woorden.test(z))
    .slice(0, 6);
}

function gewoontesVoor(datum) {
  const wd = weekdagVan(datum);
  return S.gewoontes.filter(g => !g.archief && (!g.dagen || !g.dagen.length || g.dagen.includes(wd)));
}
const gewoonteAf = (id, datum) => S.gewoontelog.some(l => l.id === id + "|" + datum);
function streakVan(g) {
  let n = 0, d = vandaagISO();
  if (!gewoonteAf(g.id, d)) d = plusDagen(d, -1);
  for (let i = 0; i < 400; i++) {
    const wd = weekdagVan(d);
    if (g.dagen && g.dagen.length && !g.dagen.includes(wd)) { d = plusDagen(d, -1); continue; }
    if (gewoonteAf(g.id, d)) { n++; d = plusDagen(d, -1); } else break;
  }
  return n;
}
function gewoonteRij(g, datum, compact) {
  const af = gewoonteAf(g.id, datum), s = streakVan(g);
  const week = Array.from({ length: 7 }, (_, i) => {
    const d = plusDagen(weekStart(vandaagISO()), i);
    const hoort = !g.dagen || !g.dagen.length || g.dagen.includes(weekdagVan(d));
    return `<span class="gew-bol${gewoonteAf(g.id, d) ? " af" : ""}${d === vandaagISO() ? " vandaag" : ""}${hoort ? "" : " nvt"}">${DAGKORT[weekdagVan(d)][0].toUpperCase()}</span>`;
  }).join("");
  return `<div class="gew">
    <button class="vink${af ? " gedaan" : ""}" data-act="gew-vink" data-id="${g.id}" data-datum="${datum}" aria-label="Afvinken">${ico("check")}</button>
    <div style="flex:1;min-width:0" ${compact ? "" : `data-act="bewerk-gewoonte" data-id="${g.id}"`}>
      <div style="font-size:15px">${esc(g.naam)}</div>
      ${s ? `<div class="streak">${ico("vuur", "width:12px;height:12px;vertical-align:-2px")} ${s} dagen op rij</div>` : `<div class="klein">nog geen reeks</div>`}
    </div>
    <div class="gew-week">${week}</div></div>`;
}
function vwGewoontes() {

  let h = `<button class="knop breed primair" style="margin:10px 0" data-act="nieuwe-gewoonte">${ico("plus")} Nieuwe gewoonte</button>`;
  if (!actief.length) return h + `<div class="card">${leeg("🔥", "Nog geen gewoontes", "Bijvoorbeeld: elke dag 10 minuten lezen, of 3× per week sporten.")}</div>`;
  const vandaagLijst = gewoontesVoor(v);
  h += sectie("Vandaag", `${vandaagLijst.filter(g => gewoonteAf(g.id, v)).length}/${vandaagLijst.length}`);
  h += `<div class="card">${vandaagLijst.map(g => gewoonteRij(g, v)).join("")}</div>`;

function vwStats() {
  const v = vandaagISO(), start = weekStart(v);
  const dagen = Array.from({ length: 7 }, (_, i) => plusDagen(start, i));
  const perDag = dagen.map(d => S.taken.filter(t => t.af && (t.afOp || "").slice(0, 10) === d).length);
  const max = Math.max(1, ...perDag);
  const afWeek = perDag.reduce((a, b) => a + b, 0);
  const vorigeStart = plusDagen(start, -7);
  const afVorige = S.taken.filter(t => t.af && (t.afOp || "") >= vorigeStart && (t.afOp || "").slice(0, 10) < start).length;
  const afsprWeek = S.afspraken.filter(a => a.datum >= start && a.datum <= plusDagen(start, 6)).length;
  const tijdWeek = S.tijdlog.filter(l => l.datum >= start).reduce((a, b) => a + b.seconden, 0);
  const dbWeek = S.dagboek.filter(d => d.datum >= start);
  const stemming = dbWeek.filter(d => d.stemming).reduce((a, b) => a + b.stemming, 0) / (dbWeek.filter(d => d.stemming).length || 1);
  const open = openTaken().length, laat = openTaken().filter(t => t.datum && t.datum < v).length;

  let h = `<div class="stats">
    <div class="stat"><div class="getal">${afWeek}</div><div class="lab">afgerond deze week</div></div>
    <div class="stat"><div class="getal">${afVorige ? (afWeek >= afVorige ? "+" : "") + (afWeek - afVorige) : "—"}</div><div class="lab">t.o.v. vorige week</div></div>
    <div class="stat"><div class="getal">${open}</div><div class="lab">nog open${laat ? ` · ${laat} te laat` : ""}</div></div>
    <div class="stat"><div class="getal">${secTekst(tijdWeek).split(":")[0]}<span style="font-size:14px">u</span></div><div class="lab">geregistreerde tijd</div></div>
  </div>`;
  h += sectie("Afgerond per dag");
  h += `<div class="card card-pad"><div class="grafiek">` + perDag.map((n, i) => `
    <div class="kolom"><span class="waarde">${n || ""}</span>
      <div class="staaf" style="height:${Math.round(n / max * 100)}%;${dagen[i] === v ? "" : "opacity:.6"}"></div>
      <span class="dag">${DAGKORT[weekdagVan(dagen[i])]}</span></div>`).join("") + `</div></div>`;

  const perProject = {};
  S.taken.filter(t => t.af && (t.afOp || "") >= start).forEach(t => {
    const p = vind("projecten", t.projectId); const nm = p ? p.naam : "Zonder project";
    perProject[nm] = (perProject[nm] || 0) + 1;
  });
  const pp = Object.entries(perProject).sort((a, b) => b[1] - a[1]);
  if (pp.length) {
    h += sectie("Per project");
    h += `<div class="card card-pad">` + pp.map(([nm, n]) => `
      <div style="margin:9px 0"><div style="display:flex;justify-content:space-between;font-size:14px"><span>${esc(nm)}</span><b>${n}</b></div>
      <div class="balk" style="margin-top:4px"><i style="width:${Math.round(n / pp[0][1] * 100)}%;background:var(--accent)"></i></div></div>`).join("") + `</div>`;
  }
  h += sectie("Gewoontes & stemming");
  h += `<div class="card card-pad">
    ${S.gewoontes.filter(g => !g.archief).map(g => {
      const n = dagen.filter(d => gewoonteAf(g.id, d)).length;
      const doel = dagen.filter(d => !g.dagen || !g.dagen.length || g.dagen.includes(weekdagVan(d))).length;
      return `<div style="margin:9px 0"><div style="display:flex;justify-content:space-between;font-size:14px"><span>${esc(g.naam)}</span><b>${n}/${doel}</b></div>
        <div class="balk" style="margin-top:4px"><i style="width:${doel ? Math.round(n / doel * 100) : 0}%"></i></div></div>`;
    }).join("") || `<div class="klein">Nog geen gewoontes.</div>`}
    <div class="hr"></div>
    <div style="display:flex;align-items:center;gap:10px">
      <span style="font-size:28px">${dbWeek.length ? STEMMINGEN[Math.round(stemming) - 1] || "😐" : "—"}</span>
      <div class="klein">Gemiddelde stemming deze week over ${dbWeek.filter(d => d.stemming).length} dag(en).<br>
      ${afsprWeek} afspraak(en) deze week.</div></div>
  </div>`;
  h += `<div class="knoprij" style="margin-top:14px">
    <button class="knop rand" data-act="terugblik-log">${ico("boek")} Terugblik in logboek zetten</button></div>`;
  return h;
}

function vwTijd() {
  const v = vandaagISO(), start = weekStart(v);
  const week = S.tijdlog.filter(l => l.datum >= start);
  const perTaak = {};
  week.forEach(l => { perTaak[l.taakId || "los"] = (perTaak[l.taakId || "los"] || 0) + l.seconden; });
  const rijen = Object.entries(perTaak).sort((a, b) => b[1] - a[1]);
  let h = `<button class="knop breed primair" style="margin:10px 0" data-act="timer-start-los">${ico("play")} Focustimer starten</button>`;
  h += `<div class="stats" style="grid-template-columns:repeat(2,1fr)">
    <div class="stat"><div class="getal">${secTekst(week.reduce((a, b) => a + b.seconden, 0))}</div><div class="lab">deze week</div></div>
    <div class="stat"><div class="getal">${secTekst(S.tijdlog.filter(l => l.datum === v).reduce((a, b) => a + b.seconden, 0))}</div><div class="lab">vandaag</div></div>
  </div>`;
  h += sectie("Per taak deze week", rijen.length);
  if (!rijen.length) return h + `<div class="card">${leeg("⏱️", "Nog geen tijd geregistreerd", "Start een timer vanuit een taak of hierboven.")}</div>`;
  h += `<div class="card">` + rijen.map(([id, sec]) => {
    const t = vind("taken", id);
    return `<div class="rijknop" ${t ? `data-act="open-taak" data-id="${t.id}"` : ""}>
      <span class="nm">${esc(t ? t.titel : "Losse focussessie")}</span>
      <span class="rechts mono">${secTekst(sec)}</span></div>`;
  }).join("") + `</div>`;
  return h;
}
</script>

function vwHelp() {
  return `
  <div class="sectie"><h2>Op je beginscherm zetten</h2></div>

  <div class="card card-pad klein">

    <code>elke maandag 7:00 sporten p1 #gezondheid ~45m</code><br>
    <code>morgen 15:00 tandarts +wilke @afspraak</code></p>

  <div class="sectie"><h2>Hoe je gegevens bewaard blijven</h2></div>
  <div class="card card-pad klein">
    <p>Alles staat in de IndexedDB van dit toestel. De app vraagt iOS om die opslag <b>vast te zetten</b>, zodat het systeem hem niet opruimt als er ruimte nodig is.</p>
    <p>Toch blijft één regel gelden: <b>verwijder je de app, dan is alles weg</b>. Maak dus af en toe een back-up via ${ico("download", "width:13px;height:13px;vertical-align:-2px")} Back-up. Bewaar dat bestand in Bestanden, iCloud Drive of mail het naar jezelf.</p>
    <p>Er gaat nooit iets naar een server. Geen account, geen tracking, geen internet nodig.</p>

    <p>• <b>Toezegging</b> — iets wat je met iemand hébt afgesproken. Datum is niet verplicht; je kunt wél een <b>deadline</b> zetten (uiterlijk klaar op) of een <b>periode</b> (van … t/m …).</p>

  </div>`;
}

/* ==========================================================================
   13. Bladen (bottom sheets)
   ========================================================================== */
let bladOpslaan = null;
function bladOpen(titel, inhoud, voet, opslaanFn) {
  $("#bladtitel").textContent = titel;
  // Vervang de inhoud door een verse node, zodat oude luisteraars verdwijnen.
  const oud = $("#bladinhoud");
  const vers = oud.cloneNode(false);
  oud.replaceWith(vers);
  vers.innerHTML = inhoud;
  const v = $("#bladvoet");
  v.innerHTML = voet || "";
  v.classList.toggle("verborgen", !voet);
  bladOpslaan = opslaanFn || null;
  $("#overlay").classList.add("open");
  $("#blad").classList.add("open");
  $("#bladinhoud").scrollTop = 0;
}
function bladSluit() {
  $("#blad").classList.remove("open");
  $("#overlay").classList.remove("open");
  bladOpslaan = null;
  setTimeout(() => { if (!$("#blad").classList.contains("open")) $("#bladinhoud").innerHTML = ""; }, 300);
}
function bladVraag(titel, waarde, plaats, klaar, meerregelig) {
  bladOpen(titel,
    meerregelig
      ? `<div class="veld"><textarea class="invoer" id="vraagveld" placeholder="${esc(plaats || "")}" style="min-height:140px">${esc(waarde || "")}</textarea></div>`
      : `<div class="veld"><input class="invoer" id="vraagveld" type="text" value="${esc(waarde || "")}" placeholder="${esc(plaats || "")}" enterkeyhint="done"></div>`,
    `<button class="knop breed primair" id="vraagok">Opslaan</button>`);
  setTimeout(() => { const v = $("#vraagveld"); if (v) { v.focus(); v.select && v.select(); } }, 250);
  $("#vraagok").onclick = () => { const w = $("#vraagveld").value.trim(); bladSluit(); klaar(w); };
  const veld = $("#vraagveld");
  if (!meerregelig) veld.onkeydown = e => { if (e.key === "Enter") $("#vraagok").click(); };
}
function bevestig(titel, tekst, knop, klaar) {
  bladOpen(titel, `<p class="klein" style="font-size:15px;margin:10px 2px 18px">${tekst}</p>`,
    `<div class="knoprij"><button class="knop rand" id="bevAnnuleer">Annuleren</button>
     <button class="knop gevaar" id="bevOk">${esc(knop)}</button></div>`);
  $("#bevAnnuleer").onclick = bladSluit;
  $("#bevOk").onclick = () => { bladSluit(); klaar(); };
}

function subtaakHTML(s, i) {

    <button class="icon-btn" style="min-width:34px;min-height:34px" data-subweg="${i}">${ico("x", "width:15px;height:15px")}</button>

function bladTaakBinden(t, isNieuw) {
  const b = $("#bladinhoud");
  const eenheid = () => {
    const s = $("#f-herhaal-soort").value, n = +$("#f-herhaal-elke").value || 1;
    $("#herhaal-eenheid").textContent = { dag: n === 1 ? "dag" : "dagen", week: n === 1 ? "week" : "weken", maand: n === 1 ? "maand" : "maanden", jaar: "jaar" }[s] || "";
    $("#herhaal-extra").style.display = s ? "" : "none";
    $("#herhaal-dagen").style.display = s === "week" ? "" : "none";
  };
  eenheid();
  $("#f-herhaal-soort").onchange = eenheid;
  $("#f-herhaal-elke").oninput = eenheid;
  $("#f-project").onchange = e => {
    if (e.target.value === "__nieuw") {
      e.target.value = "";
      bladVraag("Nieuw project", "", "Naam van het project", async naam => {
        if (!naam) { openTaakBlad(isNieuw ? null : t.id, isNieuw ? t : null); return; }
        const p = await maakProject(naam);
        t.projectId = p.id;
        openTaakBlad(isNieuw ? null : t.id, isNieuw ? t : null);
      });
    }
  };
  b.addEventListener("click", e => {
    const p = e.target.closest("[data-prio]");
    if (p) { $$("[data-prio]", b).forEach(x => x.setAttribute("aria-pressed", x === p)); return; }
    const wk = e.target.closest("[data-werk]");
    if (wk) { $$("[data-werk]", b).forEach(x => x.setAttribute("aria-pressed", x === wk)); return; }
    const en = e.target.closest("[data-energie]");
    if (en) {
      const aan = en.getAttribute("aria-pressed") === "true";
      $$("[data-energie]", b).forEach(x => x.setAttribute("aria-pressed", "false"));
      en.setAttribute("aria-pressed", aan ? "false" : "true"); return;
    }
    const d = e.target.closest("[data-hdag]");
    if (d) { d.setAttribute("aria-pressed", d.getAttribute("aria-pressed") !== "true"); return; }
    const sd = e.target.closest("[data-snel-datum]");
    if (sd) {
      const w = sd.dataset.snelDatum;
      $("#f-datum").value = w === "wis" ? "" : plusDagen(vandaagISO(), +w);
      if (w === "wis") $("#f-tijd").value = "";
      return;
    }
    const sv = e.target.closest("[data-subvink]");
    if (sv) { const i = +sv.dataset.subvink; t.subtaken[i].af = !t.subtaken[i].af; tekenSub(); return; }
    const sw = e.target.closest("[data-subweg]");
    if (sw) { leesSub(); t.subtaken.splice(+sw.dataset.subweg, 1); tekenSub(); return; }
    const bw = e.target.closest("[data-bijlageweg]");
    if (bw) { t.bijlagen = t.bijlagen.filter(x => x !== bw.dataset.bijlageweg); tekenBijlagen(); return; }
    const ta = e.target.closest("[data-taakactie]");
    if (ta) { taakActie(ta.dataset.taakactie, ta.dataset.id, t); return; }
  });
  const leesSub = () => { $$("[data-subtekst]", b).forEach(inp => { const i = +inp.dataset.subtekst; if (t.subtaken[i]) t.subtaken[i].tekst = inp.value; }); };
  const tekenSub = () => { $("#subtaken").innerHTML = t.subtaken.map((s, i) => subtaakHTML(s, i)).join(""); };
  $("#sub-toevoegen").onclick = () => {
    leesSub(); t.subtaken.push({ tekst: "", af: false }); tekenSub();
    const laatste = $$("[data-subtekst]", b).pop(); laatste && laatste.focus();
  };
  const tekenBijlagen = () => {
    $("#bijlagen").innerHTML = (t.bijlagen || []).map(id => {
      const bl = vind("bijlagen", id);
      if (!bl) return "";
      const isAfb = (bl.type || "").startsWith("image/");
      return `<div class="bijlage">${isAfb ? `<img src="${bijlageURL(bl)}" alt="">` : `<span class="bestandsnaam">${esc(bl.naam)}</span>`}
        <button class="x" data-bijlageweg="${id}">×</button></div>`;
    }).join("");
  };
  tekenBijlagen();
  $("#bijlage-toevoegen").onclick = () => {
    const k = $("#bestandkiezer");
    k.onchange = async () => {
      for (const f of Array.from(k.files || [])) {
        const bl = { id: uid(), naam: f.name, type: f.type, blob: f, ts: new Date().toISOString() };
        await bewaar("bijlagen", bl);
        t.bijlagen.push(bl.id);
      }
      k.value = ""; tekenBijlagen();
    };
    k.click();
  };
  $("#taak-opslaan").onclick = async () => {
    leesSub();
    const titel = $("#f-titel").value.trim();
    if (!titel) { toast("Geef de taak een naam"); $("#f-titel").focus(); return; }
    t.titel = titel;
    t.datum = $("#f-datum").value || null;
    t.tijd = $("#f-tijd").value || null;
    if (t.tijd && !t.datum) t.datum = vandaagISO();
    t.prioriteit = +($$("[data-prio]", b).find(x => x.getAttribute("aria-pressed") === "true") || { dataset: { prio: 4 } }).dataset.prio;
    const hs = $("#f-herhaal-soort").value;
    t.herhaal = hs ? {
      soort: hs, elke: Math.max(1, +$("#f-herhaal-elke").value || 1),
      dagen: hs === "week" ? $$("[data-hdag]", b).filter(x => x.getAttribute("aria-pressed") === "true").map(x => +x.dataset.hdag).sort() : []
    } : null;
    t.projectId = $("#f-project").value && $("#f-project").value !== "__nieuw" ? $("#f-project").value : null;
    t.duur = +$("#f-duur").value || null;
    const en = $$("[data-energie]", b).find(x => x.getAttribute("aria-pressed") === "true");
    t.energie = en ? en.dataset.energie : null;
    const wk2 = $$("[data-werk]", b).find(x => x.getAttribute("aria-pressed") === "true");
    t.werk = wk2 ? wk2.dataset.werk === "1" : !!t.werk;
    t.labels = $("#f-labels").value.split(",").map(x => x.trim()).filter(Boolean);
    t.personen = $("#f-personen").value.split(",").map(x => x.trim()).filter(Boolean);
    t.notitie = $("#f-notitie").value.trim();
    t.waarom = ($("#f-waarom") || { value: "" }).value.trim();
    t.klaarAls = ($("#f-klaarals") || { value: "" }).value.trim();
    t.subtaken = t.subtaken.filter(s => s.tekst.trim());
    const ha = $("#f-hangtaf").value;
    t.hangtAf = ha ? [ha] : [];
    await bewaar("taken", t);
    bladSluit(); teken(); plangMeldingen();
    toast(isNieuw ? "Taak toegevoegd" : "Opgeslagen");
  };
  if (isNieuw) setTimeout(() => { const f = $("#f-titel"); f && f.focus(); }, 260);
}
const bijlageCache = new Map();
function bijlageURL(bl) {
  if (!bijlageCache.has(bl.id)) bijlageCache.set(bl.id, URL.createObjectURL(bl.blob));
  return bijlageCache.get(bl.id);
}
async function taakActie(actie, id, werk) {
  const t = vind("taken", id); if (!t) return;
  if (actie === "timer") { bladSluit(); startTimer(t.id); return; }
  if (actie === "ics") { const ev = taakNaarIcs(t); if (!ev) { toast("Geef de taak eerst een datum"); return; }
    await deelOfDownload(bestandsnaam(t.titel) + ".ics", icsBestand([ev]), "text/calendar"); toast("Open het bestand om het in Agenda te zetten"); return; }
  if (actie === "snooze") { bladSluit(); openSnoozeBlad(t.id); return; }
  if (actie === "kopie") {
    const k = JSON.parse(JSON.stringify(t)); k.id = uid(); k.af = false; k.afOp = null; k.gemaakt = new Date().toISOString();
    await bewaar("taken", k); bladSluit(); teken(); toast("Kopie gemaakt"); return;
  }
  if (actie === "verwijder") {
    bevestig("Taak verwijderen?", `<b>${esc(t.titel)}</b> wordt definitief verwijderd.`, "Verwijderen", async () => {
      await verwijder("taken", t.id); teken(); toast("Verwijderd");
    });
  }
}
const bestandsnaam = s => (s || "futureme").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "futureme";

function openSnoozeBlad(id) {
  const t = vind("taken", id); if (!t) return;
  const opties = [["Tot vanavond", () => { const d = new Date(); d.setHours(19, 0, 0, 0); return d; }],
  ["Morgenochtend", () => { const d = new Date(); d.setDate(d.getDate() + 1); d.setHours(9, 0, 0, 0); return d; }],
  ["Overmorgen", () => { const d = new Date(); d.setDate(d.getDate() + 2); d.setHours(9, 0, 0, 0); return d; }],
  ["Volgende week", () => { const d = new Date(); d.setDate(d.getDate() + 7); d.setHours(9, 0, 0, 0); return d; }],
  ["Volgend weekend", () => { const d = parseISO(volgendeWeekdag(6, false)); d.setHours(10, 0, 0, 0); return d; }]];
  bladOpen("Uitstellen", `<div class="card">${opties.map(([n], i) =>
    `<button class="rijknop" data-snooze="${i}">${ico("snooze", "width:19px;height:19px;color:var(--accent)")}<span class="nm">${n}</span></button>`).join("")}
    <button class="rijknop" data-snooze="wis">${ico("x", "width:19px;height:19px;color:var(--muted)")}<span class="nm">Uitstel opheffen</span></button></div>`);
  $("#bladinhoud").onclick = async e => {
    const b = e.target.closest("[data-snooze]"); if (!b) return;
    if (b.dataset.snooze === "wis") { t.uitgesteldTot = null; }
    else {
      const d = opties[+b.dataset.snooze][1]();
      t.uitgesteldTot = d.toISOString();
      t.uitgesteld = (t.uitgesteld || 0) + 1;
      t.datum = dISO(d);
      t.tijd = pad(d.getHours()) + ":" + pad(d.getMinutes());
    }
    await bewaar("taken", t); bladSluit(); teken(); plangMeldingen();
    toast(t.uitgesteldTot ? "Uitgesteld tot " + datumLabel(t.datum) + " " + t.tijd : "Uitstel opgeheven");
  };
}

/* ---------- Overige bladen ---------- */
function openGewoonteBlad(id) {
  const bestaat = id ? vind("gewoontes", id) : null;
  const g = bestaat || { id: uid(), naam: "", dagen: [], kleur: "#12875a", gemaakt: new Date().toISOString(), archief: false };
  bladOpen(bestaat ? "Gewoonte bewerken" : "Nieuwe gewoonte", `
    <div class="veld"><label for="g-naam">Gewoonte</label>
      <input class="invoer" id="g-naam" type="text" value="${esc(g.naam)}" placeholder="Bv. 10 minuten lezen"></div>
    <div class="veld"><span class="labeltekst">Hoe wil je het bijhouden?</span>
      <div class="keuzerij">
        <button class="keuze" data-gmodus="dagen" aria-pressed="${!g.perWeek}">Vaste dagen</button>
        <button class="keuze" data-gmodus="week" aria-pressed="${!!g.perWeek}">Aantal keer per week</button>
      </div></div>
    <div class="veld" id="g-dagenveld" style="${g.perWeek ? "display:none" : ""}">
      <span class="labeltekst">Op welke dagen? (niets = elke dag)</span>
      <div class="keuzerij">${[1, 2, 3, 4, 5, 6, 0].map(d =>
        `<button class="keuze dag" data-gdag="${d}" aria-pressed="${(g.dagen || []).includes(d)}">${DAGKORT[d]}</button>`).join("")}</div></div>
    <div class="veld" id="g-weekveld" style="${g.perWeek ? "" : "display:none"}">
      <label for="g-perweek">Aantal keer per week</label>
      <input class="invoer" id="g-perweek" type="number" min="1" max="21" inputmode="numeric" value="${g.perWeek || 3}">
      <div class="klein" style="margin-top:6px">Je kiest zelf wanneer. De app telt hoe vaak je het deze week deed.</div></div>
    ${bestaat ? `<div class="hr"></div><button class="knop breed gevaar" id="g-weg">${ico("prullenbak")} Verwijderen</button>` : ""}
  `, `<button class="knop breed primair" id="g-opslaan">Opslaan</button>`);
  $("#bladinhoud").onclick = e => {
    const d = e.target.closest("[data-gdag]");
    if (d) { d.setAttribute("aria-pressed", d.getAttribute("aria-pressed") !== "true"); return; }
    const m = e.target.closest("[data-gmodus]");
    if (m) {
      $$("[data-gmodus]").forEach(x => x.setAttribute("aria-pressed", x === m));
      const week = m.dataset.gmodus === "week";
      $("#g-dagenveld").style.display = week ? "none" : "";
      $("#g-weekveld").style.display = week ? "" : "none";
    }
  };
  if (bestaat) $("#g-weg").onclick = () => bevestig("Gewoonte verwijderen?", "De reeks en geschiedenis verdwijnen ook.", "Verwijderen",
    async () => { await verwijder("gewoontes", g.id); teken(); toast("Verwijderd"); });
  $("#g-opslaan").onclick = async () => {
    const naam = $("#g-naam").value.trim();
    if (!naam) { toast("Geef de gewoonte een naam"); return; }
    g.naam = naam;
    const weekModus = ($$("[data-gmodus]").find(x => x.getAttribute("aria-pressed") === "true") || {}).dataset;
    if (weekModus && weekModus.gmodus === "week") {
      g.perWeek = clamp(+$("#g-perweek").value || 3, 1, 21);
      g.dagen = [];
    } else {
      g.perWeek = null;
      g.dagen = $$("[data-gdag]").filter(x => x.getAttribute("aria-pressed") === "true").map(x => +x.dataset.gdag).sort();
    }
    await bewaar("gewoontes", g); bladSluit(); teken(); toast("Opgeslagen");
  };
  if (!bestaat) setTimeout(() => $("#g-naam").focus(), 260);
}

function openDagboekBlad(datum) {
  datum = datum || vandaagISO();
  const bestaat = S.dagboek.find(d => d.datum === datum);
  const d = bestaat || { id: uid(), datum, stemming: null, energie: null, tekst: "", dankbaar: "", gemaakt: new Date().toISOString() };
  bladOpen(datumLabel(datum, true), `
    <div class="veld"><span class="labeltekst">Stemming</span>
      <div class="keuzerij" style="justify-content:space-between">${STEMMINGEN.map((e, i) =>
        `<button class="keuze" data-stem="${i + 1}" aria-pressed="${d.stemming === i + 1}" style="font-size:23px;min-width:52px;justify-content:center">${e}</button>`).join("")}</div></div>
    <div class="veld"><span class="labeltekst">Energie</span>
      <div class="keuzerij">${["laag", "midden", "hoog"].map(e =>
        `<button class="keuze" data-den="${e}" aria-pressed="${d.energie === e}">${ico("bliksem")} ${e}</button>`).join("")}</div></div>
    <div class="veld"><label for="d-tekst">Hoe ging het?</label>
      <textarea class="invoer" id="d-tekst" style="min-height:150px" placeholder="Wat gebeurde er? Wat viel op?">${esc(d.tekst || "")}</textarea></div>
    <div class="veld"><label for="d-dank">Waar ben je blij mee?</label>
      <input class="invoer" id="d-dank" type="text" value="${esc(d.dankbaar || "")}" placeholder="Eén ding is genoeg"></div>
    ${bestaat ? `<button class="knop breed gevaar" id="d-weg" style="margin-top:8px">${ico("prullenbak")} Notitie verwijderen</button>` : ""}

  $("#bladinhoud").onclick = e => {
    const s = e.target.closest("[data-stem]");
    if (s) { $$("[data-stem]").forEach(x => x.setAttribute("aria-pressed", x === s)); return; }
    const en = e.target.closest("[data-den]");
    if (en) { $$("[data-den]").forEach(x => x.setAttribute("aria-pressed", x === en)); }
  };
  if (bestaat) $("#d-weg").onclick = () => bevestig("Notitie verwijderen?", "Deze dagboeknotitie wordt gewist.", "Verwijderen",
    async () => { await verwijder("dagboek", d.id); teken(); toast("Verwijderd"); });
  $("#d-opslaan").onclick = async () => {
    const s = $$("[data-stem]").find(x => x.getAttribute("aria-pressed") === "true");
    const en = $$("[data-den]").find(x => x.getAttribute("aria-pressed") === "true");
    d.stemming = s ? +s.dataset.stem : null;
    d.energie = en ? en.dataset.den : null;
    d.tekst = $("#d-tekst").value.trim();
    d.dankbaar = $("#d-dank").value.trim();
    if (!d.tekst && !d.stemming && !d.dankbaar) { bladSluit(); return; }
    await bewaar("dagboek", d);
    if (!bestaat) await logGebeurtenis("dagboek", "Dagboek: " + (d.tekst.slice(0, 70) || "stemming genoteerd"), d.id);
    bladSluit(); teken(); toast("Opgeslagen");
  };
}

const PROJECTKLEUREN = ["#2f6fed", "#12875a", "#d63c42", "#b7791f", "#7a4fd6", "#0f8b8d", "#c2410c", "#be185d"];
async function maakProject(naam, kleur) {
  const bestaat = S.projecten.find(p => p.naam.toLowerCase() === naam.toLowerCase());
  if (bestaat) return bestaat;
  const p = { id: uid(), naam, kleur: kleur || PROJECTKLEUREN[S.projecten.length % PROJECTKLEUREN.length], volgorde: S.projecten.length, gemaakt: new Date().toISOString() };
  await bewaar("projecten", p);
  return p;
}
function openProjectBlad(id) {
  const bestaat = id ? vind("projecten", id) : null;
  const p = bestaat || { id: uid(), naam: "", kleur: PROJECTKLEUREN[S.projecten.length % PROJECTKLEUREN.length], volgorde: S.projecten.length };
  bladOpen(bestaat ? "Project bewerken" : "Nieuw project", `
    <div class="veld"><label for="p-naam">Naam</label>
      <input class="invoer" id="p-naam" type="text" value="${esc(p.naam)}" placeholder="Bv. Verbouwing"></div>
    <div class="veld"><span class="labeltekst">Kleur</span>
      <div class="keuzerij">${PROJECTKLEUREN.map(k =>
        `<button class="keuze" data-kleur="${k}" aria-pressed="${p.kleur === k}" style="min-width:44px;justify-content:center">
          <span class="kleurbol" style="background:${k};width:17px;height:17px"></span></button>`).join("")}</div></div>
    ${bestaat ? `<div class="hr"></div><button class="knop breed gevaar" id="p-weg">${ico("prullenbak")} Project verwijderen</button>
      <div class="klein" style="margin-top:7px">Taken in dit project blijven bestaan en gaan terug naar de inbox.</div>` : ""}
  `, `<button class="knop breed primair" id="p-opslaan">Opslaan</button>`);
  $("#bladinhoud").onclick = e => {
    const k = e.target.closest("[data-kleur]");
    if (k) $$("[data-kleur]").forEach(x => x.setAttribute("aria-pressed", x === k));
  };
  if (bestaat) $("#p-weg").onclick = () => bevestig("Project verwijderen?", `Taken uit <b>${esc(p.naam)}</b> gaan terug naar de inbox.`, "Verwijderen", async () => {
    for (const t of takenVanProject(p.id)) { t.projectId = null; await bewaar("taken", t); }
    await verwijder("projecten", p.id); ga("projecten"); toast("Project verwijderd");
  });
  $("#p-opslaan").onclick = async () => {
    const naam = $("#p-naam").value.trim();
    if (!naam) { toast("Geef het project een naam"); return; }
    p.naam = naam;
    const k = $$("[data-kleur]").find(x => x.getAttribute("aria-pressed") === "true");
    p.kleur = k ? k.dataset.kleur : p.kleur;
    await bewaar("projecten", p); bladSluit(); teken(); toast("Opgeslagen");

}

function openPersoonBlad(naam) {
  const taken = S.taken.filter(t => (t.personen || []).includes(naam));
  const afspr = S.afspraken.filter(a => (a.personen || []).includes(naam));

    <div class="veld"><label for="pp-notitie">Notitie</label>

    ${afspr.length ? `<div class="sectie"><h2>Afspraken</h2></div><div class="card">${afspr.slice(0, 10).map(afspraakRij).join("")}</div>` : ""}
    ${taken.length ? `<div class="sectie"><h2>Taken</h2></div>${takenLijst(taken.slice(0, 15))}` : ""}
  `, `<button class="knop breed primair" id="pp-opslaan">Opslaan</button>`);
  $("#pp-opslaan").onclick = async () => {
    const obj = p || { id: uid(), naam };
    obj.notitie = $("#pp-notitie").value.trim();

}

<script>
"use strict";
/* ==========================================================================
   22. Instellingen toepassen
   ========================================================================== */
function pasInstellingenToe() {
  const h = document.documentElement;
  h.dataset.tekst = inst("tekst", "normaal");
  h.dataset.dicht = inst("dicht", "normaal");
  h.dataset.thema = inst("thema", "systeem");
  h.dataset.contrast = inst("contrast", false) ? "1" : "0";
  h.dataset.rust = inst("rust", false) ? "1" : "0";
  const thema = inst("thema", "systeem");
  h.style.colorScheme = thema === "licht" ? "light" : thema === "donker" ? "dark" : "light dark";
}

/* ==========================================================================
   23. Startscherm — vastleggen via 3D-knoppen
   ========================================================================== */
function groet() {
  const u = new Date().getHours();
  if (u < 6) return "Goedenacht";
  if (u < 12) return "Goedemorgen";
  if (u < 18) return "Goedemiddag";
  return "Goedenavond";
}
function knop3d(opt) {
  return `<button class="knop3d${opt.breed ? " breed" : ""}" style="--k:${opt.kleur}"
      data-act="start-knop" data-soort="${opt.soort}" aria-label="${esc(opt.naam)}">
    <svg class="ill3d" viewBox="0 0 100 80" aria-hidden="true" focusable="false"><use href="#ill-${opt.soort}"/></svg>
    ${opt.telling ? `<span class="bal3d">${opt.telling}</span>` : ""}
    <span class="tekst3d">
      <span class="nm3d" style="display:block">${esc(opt.naam)}</span>
      ${opt.uitleg ? `<span class="ds3d" style="display:block">${esc(opt.uitleg)}</span>` : ""}
    </span>
  </button>`;
}
function vwStart() {
  const v = vandaagISO();
  const laat = openTaken().filter(t => t.datum && t.datum < v).length;
  const vandaagOpen = openTaken().filter(t => t.datum === v).length;
  const afsprVandaag = S.afspraken.filter(a => a.datum === v).length;
  const deadlineLaat = S.afspraken.filter(a => afspraakLaat(a)).length;
  const gewVandaag = gewoontesVoor(v);
  const gewOpen = gewVandaag.filter(g => !gewoonteAf(g.id, v)).length;
  const dbVandaag = S.dagboek.find(d => d.datum === v);

  let h = typeof dagPaneel === "function" ? dagPaneel() : "";

  h += `<div class="startgrid">
    ${knop3d({ soort: "snel", naam: "Snel typen", uitleg: "“morgen 15:00 tandarts #zorg”", kleur: "#2f6fed", breed: true })}
    ${knop3d({ soort: "werk", naam: "Werk", uitleg: "Meetings, plannen, strategie en reflectie", kleur: "#c0202f", breed: true, telling: (typeof werkTelling === "function" ? werkTelling() : "") })}
    ${knop3d({ soort: "financieel", naam: "Financieel", uitleg: "Dagbudget, uitgaven en incasso's", kleur: "#0f766e", breed: true, telling: (typeof geldTelling === "function" ? geldTelling() : "") })}
    ${knop3d({ soort: "taak", naam: "Taak", uitleg: "Iets wat je moet doen", kleur: "#2f6fed", telling: openTaken().length || "" })}
    ${knop3d({ soort: "gesprek", naam: "Afspraak", uitleg: "Gesprek op een moment", kleur: "#7a4fd6", telling: afsprVandaag || "" })}
    ${knop3d({ soort: "toezegging", naam: "Toezegging", uitleg: "Wat je iemand beloofde", kleur: "#4f46b8", telling: deadlineLaat || "" })}
    ${knop3d({ soort: "checklist", naam: "Checklist", uitleg: "Lijstje om af te vinken", kleur: "#0f8b6c", telling: S.checklists.filter(c => !c.sjabloon).length || "" })}
    ${knop3d({ soort: "gewoonte", naam: "Gewoonte", uitleg: gewOpen ? gewOpen + " nog te doen" : "Streak bijhouden", kleur: "#c2410c", telling: gewOpen || "" })}
    ${knop3d({ soort: "dagboek", naam: "Dagboek", uitleg: dbVandaag ? "Vandaag al geschreven" : "Hoe gaat het?", kleur: "#be185d" })}
    ${knop3d({ soort: "notitie", naam: "Notitie", uitleg: "Zomaar in je logboek", kleur: "#475569" })}
    ${knop3d({ soort: "focus", naam: "Focussessie", uitleg: "Timer op één taak", kleur: "#1f2937", breed: true })}
  </div>`;

  const vast = S.filters.filter(f => f.vast);
  if (vast.length) {
    h += sectie("Vastgezette lijsten", vast.length);
    h += `<div class="card">${vast.map(f => `<button class="rijknop" data-act="filter-open" data-id="${f.id}">
      ${ico("bliksem", "width:18px;height:18px;color:var(--accent)")}
      <span class="nm">${esc(f.naam)}</span>
      <span class="rechts">${filterTaken(f.query).length}${ico("pijlr", "width:16px;height:16px;color:var(--line2)")}</span></button>`).join("")}</div>`;
  }
  h += `<button class="startstrip" data-act="ga" data-view="logboek">
    ${ico("logboek", "width:20px;height:20px;color:var(--muted)")}
    <span class="nm">Laatst gelogd: ${esc(S.gebeurtenissen.length ? S.gebeurtenissen.slice().sort((a, b) => a.ts < b.ts ? 1 : -1)[0].tekst.slice(0, 44) : "nog niets")}</span>
    ${ico("pijlr", "width:16px;height:16px;color:var(--line2)")}</button>`;
  return h;
}

function snelVastlegBlad() {
  bladOpen("Snel typen", `
    <div class="veld">
      <input class="invoer" id="snelveld" type="text" enterkeyhint="done" autocomplete="off"
             placeholder="Bv. vrijdag 10:00 offerte nakijken p1 #werk">
      <div class="parser-uit" id="snelparser" style="padding-top:12px"></div>
    </div>
    <div class="klein">
      <p><b>Wat je kunt typen</b></p>
      <p><code>morgen</code> <code>vrijdag</code> <code>over 3 dagen</code> <code>15/3</code> <code>eind van de week</code></p>
      <p><code>15:00</code> <code>half 4</code> <code>kwart over 3</code> <code>vanavond</code> <code>over een half uur</code></p>
      <p><code>elke maandag</code> <code>elke werkdag</code> <code>om de dag</code> <code>elke 15e van de maand</code></p>
      <p><code>p1</code> prioriteit · <code>#project</code> · <code>@label</code> · <code>+persoon</code> · <code>~20m</code> duur</p>
    </div>`,
    `<button class="knop breed primair" id="snelok">Toevoegen</button>`);
  const veld = $("#snelveld");
  const teken2 = () => {
    const p = parseNL(veld.value);
    $("#snelparser").innerHTML = veld.value.trim()
      ? (p.titel ? `<span class="chip groen">${ico("check")}${esc(p.titel)}</span>` : `<span class="hint">Nog geen titel herkend</span>`) + parserChips(p)
      : `<span class="hint">Tik hierboven en zie meteen wat de app herkent.</span>`;
  };
  veld.oninput = teken2;
  veld.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); $("#snelok").click(); } };
  teken2();
  setTimeout(() => veld.focus(), 260);
  $("#snelok").onclick = async () => {
    const t = await maakTaakUitTekst(veld.value);
    if (!t) { toast("Niets herkend"); return; }
    bladSluit(); teken();
    toast("Toegevoegd" + (t.datum ? " · " + datumLabel(t.datum) : ""), "Bewerken", () => openTaakBlad(t.id));
  };
}

async function startKnopActie(soort) {
  tril(9);
  switch (soort) {
    case "snel": snelVastlegBlad(); break;
    case "taak": openTaakBlad(null); break;
    case "gesprek": openAfspraakBlad(null, { soort: "gesprek" }); break;
    case "toezegging": openAfspraakBlad(null, { soort: "toezegging" }); break;
    case "checklist": ga("checklists"); break;
    case "gewoonte": ga("gewoontes"); break;
    case "dagboek": openDagboekBlad(vandaagISO()); break;
    case "notitie":
      bladVraag("Notitie in logboek", "", "Wat wil je vastleggen?", async tekst => {
        if (!tekst) return;
        await logGebeurtenis("notitie", tekst);
        teken(); toast("In je logboek gezet");
      }, true);
      break;
    case "foto": {
      const k = $("#bestandkiezer");
      k.onchange = async () => {
        const ids = [];
        for (const f of Array.from(k.files || [])) {
          const bl = { id: uid(), naam: f.name, type: f.type, blob: f, ts: new Date().toISOString() };
          await bewaar("bijlagen", bl); ids.push(bl.id);
        }
        k.value = "";
        if (ids.length) openTaakBlad(null, { bijlagen: ids, titel: "" });
      };
      k.click();
      break;
    }
    case "focus": ga("focus"); break;
    case "werk": ga("werk"); break;
    case "financieel": ga("financieel"); break;
  }
}

        ${t.subtaken.map((s, n) => `<div class="sub-regel${s.af ? " af" : ""}" data-act="focus-sub" data-i="${n}">
          <span class="mini-vink${s.af ? "" : ""}" style="width:26px;height:26px;margin:0">${s.af ? ico("check", "opacity:1;color:var(--green)") : ""}</span>${esc(s.tekst)}</div>`).join("")}
      </div>` : ""}
    </div>
    <div class="knoprij">
      <button class="knop primair" data-act="focus-klaar">${ico("check")} Klaar</button>
      <button class="knop rand" data-act="focus-timer">${ico(bezig ? "pauze" : "play")} ${bezig ? "Pauze" : "Timer"}</button>

taakHTML = function (t, opt) {

  const binnen = `<div class="taak${t.af ? " af" : ""}${gekozen ? " gekozen" : ""}">

        data-act="sub-open" data-id="${t.id}" aria-label="${open ? "Subtaken verbergen" : "Subtaken tonen"}">
        ${ico("pijlr", "width:15px;height:15px;transform:rotate(" + (open ? "-90deg" : "90deg") + ")")}</button>` : ""}
    ${opt.sleep ? `<span class="greep" data-greep="${t.id}">${ico("greep")}</span>` : ""}

  if (!inst("vegen", true) || t.af || bulk.aan)

};
const uitgeklapt = new Set();

/* ==========================================================================
   27. Vegen over een taakregel
   ========================================================================== */
let veeg = null, veegKlaar = 0;
document.addEventListener("pointerdown", e => {
  if (!inst("vegen", true) || bulk.aan) return;
  if (e.target.closest("[data-greep]")) return;
  const rij = e.target.closest(".swipe");
  if (!rij || !$(".swipe-laag", rij)) return;
  veeg = { rij, x: e.clientX, y: e.clientY, richting: null, kaart: $(".taak", rij) };
}, { passive: true });
/* Na een echte veeg geen klik laten doorgaan (anders vink je dubbel af). */
document.addEventListener("click", e => {
  if (Date.now() - veegKlaar < 400) { e.stopPropagation(); e.preventDefault(); }
}, true);
document.addEventListener("pointermove", e => {
  if (!veeg) return;
  const dx = e.clientX - veeg.x, dy = e.clientY - veeg.y;
  if (!veeg.richting) {
    if (Math.abs(dy) > 9 && Math.abs(dy) > Math.abs(dx)) { veeg = null; return; }
    if (Math.abs(dx) > 11) { veeg.richting = "x"; veeg.rij.classList.add("sleept"); }
    else return;
  }
  e.preventDefault();
  const laag = $(".swipe-laag", veeg.rij);
  laag.classList.toggle("groen", dx > 0);
  laag.classList.toggle("oranje", dx <= 0);
  veeg.kaart.style.transform = `translateX(${clamp(dx, -150, 150)}px)`;
}, { passive: false });
document.addEventListener("pointerup", async e => {
  if (!veeg) return;
  const dx = e.clientX - veeg.x, rij = veeg.rij, kaart = veeg.kaart, id = rij.dataset.taak;
  const raak = veeg.richting === "x" && Math.abs(dx) > 84;
  if (veeg.richting === "x") veegKlaar = Date.now();
  rij.classList.remove("sleept");
  kaart.style.transform = "";
  veeg = null;
  if (!raak) return;
  if (dx > 0) vinkTaak(id);
  else openSnoozeBlad(id);
});
document.addEventListener("pointercancel", () => {
  if (veeg) { veeg.rij.classList.remove("sleept"); veeg.kaart.style.transform = ""; veeg = null; }
});

/* ==========================================================================
   28. Meerdere taken tegelijk
   ========================================================================== */
const bulk = { aan: false, ids: new Set() };
function bulkToon() {
  const b = $("#bulkbalk");
  b.classList.toggle("zicht", bulk.aan);
  $("#bulk-aantal").textContent = bulk.ids.size + " gekozen";
}
function bulkUit() { bulk.aan = false; bulk.ids.clear(); bulkToon(); teken(); }
let langTimer = null, langStart = null;
document.addEventListener("pointerdown", e => {
  const rij = e.target.closest("[data-taak]");
  if (!rij || bulk.aan || e.target.closest("[data-greep]")) return;
  langStart = { x: e.clientX, y: e.clientY };
  langTimer = setTimeout(() => {
    bulk.aan = true; bulk.ids.add(rij.dataset.taak);
    veeg = null;
    tril(14); bulkToon(); teken();
  }, 550);
}, { passive: true });
document.addEventListener("pointermove", e => {
  if (!langStart) return;
  if (Math.abs(e.clientX - langStart.x) > 10 || Math.abs(e.clientY - langStart.y) > 10) {
    clearTimeout(langTimer); langStart = null;
  }
}, { passive: true });
["pointerup", "pointercancel"].forEach(ev =>
  document.addEventListener(ev, () => { clearTimeout(langTimer); langStart = null; }, { passive: true }));

async function bulkActie(wat) {
  const ids = Array.from(bulk.ids);
  if (!ids.length) { toast("Kies eerst een paar taken"); return; }
  if (wat === "af") {
    for (const id of ids) { const t = vind("taken", id); if (t && !t.af) await vinkTaak(id); }
    bulkUit(); toast(ids.length + " taken afgevinkt");
  } else if (wat === "weg") {
    bevestig("Taken verwijderen?", `${ids.length} taken worden definitief verwijderd.`, "Verwijderen", async () => {
      for (const id of ids) await verwijder("taken", id);
      bulkUit(); toast("Verwijderd");
    });
  } else if (wat === "datum") {
    bladOpen("Datum voor " + ids.length + " taken", `<div class="card">
      ${[["Vandaag", 0], ["Morgen", 1], ["Overmorgen", 2], ["Volgende week", 7], ["Datum wissen", "wis"]].map(([n, d]) =>
        `<button class="rijknop" data-bulkdatum="${d}">${ico("komend", "width:19px;height:19px;color:var(--accent)")}<span class="nm">${n}</span></button>`).join("")}
    </div>`);
    $("#bladinhoud").onclick = async ev => {
      const k = ev.target.closest("[data-bulkdatum]"); if (!k) return;
      const w = k.dataset.bulkdatum;
      for (const id of ids) {
        const t = vind("taken", id); if (!t) continue;
        const oudeDatum = t.datum;
        t.datum = w === "wis" ? null : plusDagen(vandaagISO(), +w);
        if (w === "wis") t.tijd = null;
        if (oudeDatum && t.datum && t.datum > oudeDatum) t.uitgesteld = (t.uitgesteld || 0) + 1;
        await bewaar("taken", t);
      }
      bladSluit(); bulkUit(); toast("Datum aangepast");
    };
  } else if (wat === "project") {
    bladOpen("Project voor " + ids.length + " taken", `<div class="card">
      <button class="rijknop" data-bulkproject=""><span class="nm">Geen project (inbox)</span></button>
      ${S.projecten.map(p => `<button class="rijknop" data-bulkproject="${p.id}">
        <span class="kleurbol" style="background:${p.kleur}"></span><span class="nm">${esc(p.naam)}</span></button>`).join("")}
    </div>`);
    $("#bladinhoud").onclick = async ev => {
      const k = ev.target.closest("[data-bulkproject]"); if (!k) return;
      for (const id of ids) { const t = vind("taken", id); if (t) { t.projectId = k.dataset.bulkproject || null; await bewaar("taken", t); } }
      bladSluit(); bulkUit(); toast("Verplaatst");
    };
  }
}

/* ==========================================================================
   29. Vergrendeling met pincode (slot voor meekijkers, geen versleuteling)
   ========================================================================== */
const slot = { invoer: "", nieuw: null, stap: 0 };
function slotToon(tekst) {
  $("#slot").classList.add("zicht");
  $("#slot-tekst").textContent = tekst || "Voer je pincode in";
  $("#slot-cijfers").innerHTML =
    [1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-cijfer="${n}">${n}</button>`).join("") +
    `<button class="leeg" data-cijfer="annuleer" style="font-size:14px">${slot.nieuw !== null ? "Stop" : ""}</button>
     <button data-cijfer="0">0</button>
     <button class="leeg" data-cijfer="wis" style="font-size:14px">Wis</button>`;
  slotBolletjes();
}
function slotBolletjes() {
  $("#slot-bolletjes").innerHTML = [0, 1, 2, 3].map(i => `<i class="${i < slot.invoer.length ? "vol" : ""}"></i>`).join("");
}
$("#slot").addEventListener("click", async e => {
  const k = e.target.closest("[data-cijfer]"); if (!k) return;
  const c = k.dataset.cijfer;
  if (c === "wis") { slot.invoer = slot.invoer.slice(0, -1); slotBolletjes(); return; }
  if (c === "annuleer") { slot.nieuw = null; slot.invoer = ""; $("#slot").classList.remove("zicht"); teken(); return; }
  slot.invoer += c; tril(4); slotBolletjes();
  if (slot.invoer.length < 4) return;
  const code = slot.invoer; slot.invoer = "";
  setTimeout(async () => {
    if (slot.nieuw === "stap1") { slot.nieuw = code; slotToon("Herhaal de code"); return; }
    if (slot.nieuw) {
      if (slot.nieuw === code) { await zetInst("pincode", code); slot.nieuw = null; $("#slot").classList.remove("zicht"); teken(); toast("Pincode ingesteld"); }
      else { slot.nieuw = "stap1"; slotToon("Codes verschillen — kies opnieuw"); tril(30); }
      return;
    }
    if (code === inst("pincode", null)) { $("#slot").classList.remove("zicht"); slotBolletjes(); }
    else { slotToon("Onjuiste code — probeer opnieuw"); tril(40); }
  }, 90);
});
function pinInstellen() { slot.nieuw = "stap1"; slot.invoer = ""; slotToon("Kies een nieuwe code van 4 cijfers"); }

/* ==========================================================================
   30. Extra tikacties uit de testrondes
   ========================================================================== */
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]");
  if (el) {
    const act = el.dataset.act, id = el.dataset.id;
    switch (act) {
      case "start-knop": startKnopActie(el.dataset.soort); break;
      case "bulk-kies": {
        if (bulk.ids.has(id)) bulk.ids.delete(id); else bulk.ids.add(id);
        if (!bulk.ids.size) { bulkUit(); return; }
        bulkToon(); teken();
        break;
      }
      case "sub-open": {
        if (uitgeklapt.has(id)) uitgeklapt.delete(id); else uitgeklapt.add(id);
        teken();
        break;
      }
      case "sub-vink": {
        const t = vind("taken", id);
        t.subtaken[+el.dataset.i].af = !t.subtaken[+el.dataset.i].af;
        await bewaar("taken", t); tril(6); teken();
        break;
      }
      case "focus-klaar": {
        const lijst = focusKandidaten();
        const t = lijst[clamp(inst("focusIndex", 0), 0, lijst.length - 1)];
        if (t) await vinkTaak(t.id);
        await zetInst("focusIndex", 0); teken();
        break;
      }
      case "focus-volgende": {
        const lijst = focusKandidaten();
        await zetInst("focusIndex", (clamp(inst("focusIndex", 0), 0, lijst.length - 1) + 1) % Math.max(1, lijst.length));
        teken();
        break;
      }
      case "focus-snooze": {
        const lijst = focusKandidaten();
        const t = lijst[clamp(inst("focusIndex", 0), 0, lijst.length - 1)];
        if (t) openSnoozeBlad(t.id);
        break;
      }
      case "focus-timer": {
        const lijst = focusKandidaten();
        const t = lijst[clamp(inst("focusIndex", 0), 0, lijst.length - 1)];
        if (!t) break;
        if (T.taakId === t.id) pauzeTimer(); else startTimer(t.id);
        teken();
        break;
      }
      case "focus-sub": {
        const lijst = focusKandidaten();
        const t = lijst[clamp(inst("focusIndex", 0), 0, lijst.length - 1)];
        if (!t) break;
        t.subtaken[+el.dataset.i].af = !t.subtaken[+el.dataset.i].af;
        await bewaar("taken", t); tril(6); teken();
        break;
      }
      case "pin-wijzig": pinInstellen(); break;
      case "filter-vast": {
        const f = vind("filters", id);
        f.vast = !f.vast; await bewaar("filters", f); teken();
        toast(f.vast ? "Op het startscherm gezet" : "Van het startscherm gehaald");
        break;
      }
    }
  }
  // Instellingen: segmenten en schakelaars
  const seg = e.target.closest("[data-inst]");
  if (seg) {
    await zetInst(seg.dataset.inst, seg.dataset.waarde);
    pasInstellingenToe(); teken();
    return;
  }
  const tg = e.target.closest("[data-toggle]");
  if (tg) {
    const sleutel = tg.dataset.toggle, nu = tg.getAttribute("aria-pressed") === "true";
    if (sleutel === "pinAan") {
      if (nu) { await zetInst("pincode", null); teken(); toast("Vergrendeling uit"); }
      else pinInstellen();
      return;
    }
    if ((sleutel === "budgetDynamisch" || sleutel === "budgetMeenemen") && !nu) {
      const ander = sleutel === "budgetDynamisch" ? "budgetMeenemen" : "budgetDynamisch";
      if (inst(ander, false)) await zetInst(ander, false);
    }
    await zetInst(sleutel, !nu);
    pasInstellingenToe(); teken();
  }
});
document.addEventListener("change", async e => {

});

<script>
"use strict";
/* ==========================================================================
   14. Taken afvinken, vastleggen, herhalen
   ========================================================================== */
async function vinkTaak(id) {
  const t = vind("taken", id);
  if (!t) return;
  tril(10);
  if (t.af) {
    t.af = false; t.afOp = null;
    await bewaar("taken", t);
    teken(); return;
  }
  if (geblokkeerd(t)) {
    const wacht = (t.hangtAf || []).map(i => vind("taken", i)).filter(x => x && !x.af).map(x => x.titel);
    toast("Wacht nog op: " + wacht.join(", "));
    return;
  }
  if (t.herhaal) {
    const oud = t.datum;
    const volgende = volgendeDatum(t.datum, t.herhaal);
    await logGebeurtenis("taak", "Afgerond: " + t.titel, t.id);
    t.datum = volgende;
    t.uitgesteldTot = null;
    (t.subtaken || []).forEach(s => (s.af = false));
    await bewaar("taken", t);
    teken();
    toast("Afgerond · volgende keer " + datumLabel(volgende), "Ongedaan", async () => {
      t.datum = oud; await bewaar("taken", t);
      const g = S.gebeurtenissen.filter(x => x.refId === t.id).pop();
      if (g) await verwijder("gebeurtenissen", g.id);
      teken();
    });
    return;
  }
  t.af = true;
  t.afOp = new Date().toISOString();
  await bewaar("taken", t);
  await logGebeurtenis("taak", "Afgerond: " + t.titel, t.id);
  teken();
  toast("Afgerond", "Ongedaan", async () => {
    t.af = false; t.afOp = null; await bewaar("taken", t);
    const g = S.gebeurtenissen.filter(x => x.refId === t.id).pop();
    if (g) await verwijder("gebeurtenissen", g.id);
    teken();
  });
}

async function maakTaakUitTekst(tekst, extra) {
  const p = parseNL(tekst);
  if (!p.titel && !p.datum) return null;
  let projectId = null;

/* ==========================================================================
   15. Focustimer
   ========================================================================== */
const T = { taakId: null, start: null, opgebouwd: 0, actief: false, tick: null };
function timerToon() {
  const balk = $("#timerbalk");
  if (!T.actief && !T.start) { balk.classList.remove("zicht"); return; }
  balk.classList.add("zicht");
  const t = T.taakId ? vind("taken", T.taakId) : null;
  $("#timer-naam").textContent = t ? t.titel : "Focussessie";
  $("#timer-tijd").textContent = secTekst(timerSeconden());
  $("#timer-pauze").innerHTML = T.actief ? ico("pauze") : ico("play");
}
const timerSeconden = () => Math.floor(T.opgebouwd + (T.actief && T.start ? (Date.now() - T.start) / 1000 : 0));
function timerBewaarStatus() {
  zetInst("timer", { taakId: T.taakId, start: T.start, opgebouwd: T.opgebouwd, actief: T.actief });
}
function startTimer(taakId) {
  if (T.actief || T.start) stopTimer(true);
  T.taakId = taakId || null; T.opgebouwd = 0; T.start = Date.now(); T.actief = true;
  clearInterval(T.tick); T.tick = setInterval(timerToon, 1000);
  timerToon(); timerBewaarStatus();
  toast("Timer gestart");
}
function pauzeTimer() {
  if (T.actief) { T.opgebouwd = timerSeconden(); T.actief = false; T.start = null; }
  else { T.start = Date.now(); T.actief = true; }
  timerToon(); timerBewaarStatus();
}
async function stopTimer(stil) {
  const sec = timerSeconden();
  const taakId = T.taakId;
  clearInterval(T.tick);
  T.taakId = null; T.start = null; T.opgebouwd = 0; T.actief = false;
  timerToon(); timerBewaarStatus();
  if (sec < 20) { if (!stil) toast("Te kort om te bewaren"); return; }
  const t = taakId ? vind("taken", taakId) : null;
  await bewaar("tijdlog", { id: uid(), taakId, seconden: sec, datum: vandaagISO(), ts: new Date().toISOString() });
  await logGebeurtenis("tijd", `${secTekst(sec)} gewerkt aan ${t ? t.titel : "een focussessie"}`, taakId);
  if (!stil) { teken(); toast(secTekst(sec) + " geregistreerd"); }
}
function herstelTimer() {
  const s = inst("timer", null);
  if (!s || (!s.actief && !s.opgebouwd)) return;
  Object.assign(T, s);
  if (T.actief) { clearInterval(T.tick); T.tick = setInterval(timerToon, 1000); }
  timerToon();
}

/* ==========================================================================
   16. Meldingen (alleen terwijl de app open is)
   ========================================================================== */
let meldTimers = [];
function plangMeldingen() {
  meldTimers.forEach(clearTimeout);
  meldTimers = [];
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  const nu = Date.now();
  S.taken.filter(t => !t.af && t.datum && t.tijd).forEach(t => {
    const tijdstip = new Date(t.datum + "T" + t.tijd + ":00").getTime();
    const wacht = tijdstip - nu;
    if (wacht > 0 && wacht < 86400000 && meldTimers.length < 40) {
      meldTimers.push(setTimeout(() => {
        try { new Notification(t.titel, { body: "Gepland voor " + t.tijd, tag: t.id }); } catch (e) {}
        toast("⏰ " + t.titel);
      }, wacht));
    }
  });
}
async function vraagMeldingen() {
  if (!("Notification" in window)) { toast("Deze browser kent geen meldingen"); return; }
  try {
    const r = await Notification.requestPermission();
    if (r === "granted") { plangMeldingen(); toast("Meldingen aan — alleen terwijl de app open is"); }
    else toast("Meldingen zijn niet toegestaan");
  } catch (e) { toast("Meldingen konden niet worden aangevraagd"); }
}

/* ==========================================================================
   17. Back-up: exporteren en importeren
   ========================================================================== */
const blobNaarBase64 = blob => new Promise(res => {
  const r = new FileReader();
  r.onload = () => res(r.result);
  r.onerror = () => res(null);
  r.readAsDataURL(blob);
});
async function base64NaarBlob(dataUrl) {
  const r = await fetch(dataUrl);
  return await r.blob();
}
async function exportJSON(metBijlagen) {
  toast("Back-up wordt gemaakt…");
  const data = { app: "FutureMe", versie: 1, gemaakt: new Date().toISOString(), data: {} };
  for (const w of Object.keys(WINKELS)) {
    if (w === "instellingen") data.data.instellingen = Object.entries(S.instellingen).map(([sleutel, waarde]) => ({ sleutel, waarde }));
    else if (w === "bijlagen") {
      data.data.bijlagen = metBijlagen
        ? await Promise.all(S.bijlagen.map(async b => ({ id: b.id, naam: b.naam, type: b.type, ts: b.ts, data: await blobNaarBase64(b.blob) })))
        : [];
    } else data.data[w] = S[w];
  }
  const naam = `futureme-backup-${vandaagISO()}${metBijlagen ? "-compleet" : ""}.json`;
  await deelOfDownload(naam, JSON.stringify(data), "application/json");
  await zetInst("laatsteBackup", new Date().toISOString());
  teken();
  toast("Back-up klaar — bewaar hem in Bestanden of iCloud", null, null, 5000);
}
async function importJSON(bestand, modus) {
  let data;
  try { data = JSON.parse(await bestand.text()); }
  catch (e) { toast("Dit is geen geldig back-upbestand"); return; }
  if (!data || !data.data) { toast("Dit is geen FutureMe-back-up"); return; }
  if (modus === "vervangen") for (const w of Object.keys(WINKELS)) { await idbLeeg(w); S[w] = w === "instellingen" ? {} : []; }
  let aantal = 0;
  for (const w of Object.keys(WINKELS)) {
    const rijen = data.data[w] || [];
    for (const rij of rijen) {
      if (w === "instellingen") { S.instellingen[rij.sleutel] = rij.waarde; await idbZet(w, rij); aantal++; continue; }
      if (w === "bijlagen") {
        if (!rij.data) continue;
        if (S.bijlagen.some(b => b.id === rij.id)) continue;
        const blob = await base64NaarBlob(rij.data);
        await bewaar("bijlagen", { id: rij.id, naam: rij.naam, type: rij.type, ts: rij.ts, blob });
        aantal++; continue;
      }
      if (modus !== "vervangen" && S[w].some(x => x.id === rij.id)) continue;
      await bewaar(w, rij);
      aantal++;
    }
  }
  teken();
  toast(`${aantal} onderdelen teruggezet`, null, null, 5000);
}
async function exportICS() {
  const ev = [];
  S.taken.filter(t => !t.af && t.datum).forEach(t => { const e = taakNaarIcs(t); if (e) ev.push(e); });
  S.afspraken.forEach(a => { const e = afspraakNaarIcs(a); if (e) ev.push(e); });
  if (!ev.length) { toast("Niets met een datum om te exporteren"); return; }
  await deelOfDownload(`futureme-agenda-${vandaagISO()}.ics`, icsBestand(ev), "text/calendar");
  toast(`${ev.length} items — open het bestand om ze in Agenda te zetten`, null, null, 5000);
}
async function exportTekst() {
  const regels = [`FutureMe — logboek`, `Geëxporteerd op ${langDatumLabel(vandaagISO())}`, ""];
  let dag = "";
  S.gebeurtenissen.slice().sort((a, b) => a.ts < b.ts ? 1 : -1).forEach(g => {
    const d = g.datum || g.ts.slice(0, 10);
    if (d !== dag) { dag = d; regels.push("", "== " + langDatumLabel(d) + " =="); }
    regels.push(`${g.ts.slice(11, 16)}  [${g.soort}] ${g.tekst}`);
  });
  regels.push("", "== Dagboek ==");
  S.dagboek.slice().sort((a, b) => a.datum < b.datum ? 1 : -1).forEach(d => {
    regels.push("", `-- ${langDatumLabel(d.datum)} ${d.stemming ? STEMMINGEN[d.stemming - 1] : ""}`);
    if (d.tekst) regels.push(d.tekst);
    if (d.dankbaar) regels.push("Blij mee: " + d.dankbaar);
  });
  await deelOfDownload(`futureme-logboek-${vandaagISO()}.txt`, regels.join("\n"), "text/plain");
}

/* ==========================================================================
   18. Slepen om te herordenen
   ========================================================================== */
let sleep = null;
document.addEventListener("pointerdown", e => {
  const greep = e.target.closest("[data-greep]");
  if (!greep) return;
  const rij = greep.closest("[data-taak]"), lijst = rij && rij.parentElement;
  if (!lijst || !lijst.dataset.sleeplijst) return;
  e.preventDefault();
  sleep = { rij, lijst, y: e.clientY };
  rij.classList.add("slepen");
  tril(8);
  greep.setPointerCapture(e.pointerId);
}, { passive: false });
document.addEventListener("pointermove", e => {
  if (!sleep) return;
  e.preventDefault();
  const onder = document.elementFromPoint(e.clientX, e.clientY);
  const doel = onder && onder.closest("[data-taak]");
  if (doel && doel !== sleep.rij && doel.parentElement === sleep.lijst) {
    const rect = doel.getBoundingClientRect();
    const na = e.clientY > rect.top + rect.height / 2;
    sleep.lijst.insertBefore(sleep.rij, na ? doel.nextSibling : doel);
  }
}, { passive: false });
document.addEventListener("pointerup", async () => {
  if (!sleep) return;
  sleep.rij.classList.remove("slepen");
  const ids = Array.from(sleep.lijst.children).filter(r => r.dataset.taak).map(r => r.dataset.taak);
  sleep = null;
  let n = 0;
  for (const id of ids) { const t = vind("taken", id); if (t) { t.volgorde = n++; await bewaar("taken", t); } }
  teken();
});
