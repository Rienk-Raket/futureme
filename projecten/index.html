<!doctype html>
<html lang="nl" data-thema="donker">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FutureMe">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; font-src 'self' data:; manifest-src 'self'">
<title>FutureMe Projecten</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icoon-180.png">
<style>
/* === FutureMe Projecten: futuristische HUD, donker als standaard, licht als keuze === */
:root, [data-thema="donker"] {
  --bg: #04060c; --bg2: #0a1020; --paneel: rgba(14, 22, 40, .66); --paneel-sterk: rgba(20, 30, 54, .9); --rand: rgba(110, 200, 255, .18); --rand-sterk: rgba(110, 200, 255, .42);
  --tekst: #e9f2ff; --zacht: #93a8c8; --vaag: #8196b8; --accent: #36e2ff; --accent2: #8b7bff; --accent3: #ff5fd2; --op-accent: #021018;
  --koers: #4dffa6; --koelt: #ffb84d; --stil: #ff6b6b; --rust: #7f93b3;
  --gloed: 0 0 0 1px rgba(54, 226, 255, .25), 0 0 24px rgba(54, 226, 255, .18);
  --schaduw: 0 10px 40px rgba(0, 0, 0, .45);
  color-scheme: dark;
}
[data-thema="licht"] {
  --bg: #edf2fb; --bg2: #f7f9fe; --paneel: rgba(255, 255, 255, .78); --paneel-sterk: #fff; --rand: rgba(30, 70, 140, .16); --rand-sterk: rgba(30, 70, 140, .38);
  --tekst: #0b1530; --zacht: #46597a; --vaag: #56677f; --accent: #006f9e; --accent2: #5a46d6; --accent3: #b0237f; --op-accent: #fff;
  --koers: #0f8a55; --koelt: #a35f00; --stil: #c0302f; --rust: #5d6f8f;
  --gloed: 0 0 0 1px rgba(0, 111, 158, .25), 0 6px 18px rgba(0, 111, 158, .12);
  --schaduw: 0 8px 30px rgba(20, 40, 80, .12);
  color-scheme: light;
}
@media (prefers-color-scheme: light) {
  [data-thema="systeem"] {
    --bg: #edf2fb; --bg2: #f7f9fe; --paneel: rgba(255, 255, 255, .78); --paneel-sterk: #fff; --rand: rgba(30, 70, 140, .16); --rand-sterk: rgba(30, 70, 140, .38);
    --tekst: #0b1530; --zacht: #46597a; --vaag: #56677f; --accent: #006f9e; --accent2: #5a46d6; --accent3: #b0237f; --op-accent: #fff;
    --koers: #0f8a55; --koelt: #a35f00; --stil: #c0302f; --rust: #5d6f8f;
    --gloed: 0 0 0 1px rgba(0, 111, 158, .25), 0 6px 18px rgba(0, 111, 158, .12); --schaduw: 0 8px 30px rgba(20, 40, 80, .12); color-scheme: light;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--tekst); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; overflow: hidden; }
.mono, .ring-tekst, .teller b { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
button, input, textarea, select { font: inherit; color: inherit; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* Achtergrond: raster en twee gloedvlekken */
.achtergrond { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.raster { position: absolute; inset: -50%; background-image: linear-gradient(var(--rand) 1px, transparent 1px), linear-gradient(90deg, var(--rand) 1px, transparent 1px); background-size: 44px 44px; opacity: .35;
  transform: perspective(600px) rotateX(58deg) translateY(-8%); mask-image: radial-gradient(ellipse at 50% 30%, #000 20%, transparent 70%); -webkit-mask-image: radial-gradient(ellipse at 50% 30%, #000 20%, transparent 70%); animation: raster 30s linear infinite; }
.gloed { position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%; filter: blur(80px); opacity: .22; }
.g1 { background: var(--accent); top: -30vmax; left: -20vmax; }
.g2 { background: var(--accent3); bottom: -35vmax; right: -25vmax; opacity: .14; }
[data-thema="licht"] .gloed { opacity: .1; }
@keyframes raster { to { background-position: 0 44px, 44px 0; } }

/* Kop, scherm, onderbalk */
.kop { position: fixed; top: 0; left: 0; right: 0; z-index: 5; display: flex; align-items: center; gap: 8px; padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
  background: linear-gradient(var(--bg) 40%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.kop-tekst { flex: 1; min-width: 0; }
.kop h1 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kop p { margin: 0; color: var(--zacht); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kop-merk { color: var(--accent); font-size: 12px; letter-spacing: .2em; opacity: .7; }
.icoonknop { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--rand); background: var(--paneel); cursor: pointer; }
#scherm { position: fixed; inset: 0; z-index: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: calc(env(safe-area-inset-top) + 82px) 16px calc(env(safe-area-inset-bottom) + 110px); outline: none; }
#scherm > * { max-width: 720px; margin-left: auto; margin-right: auto; }
#tabs { position: fixed; z-index: 6; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 10px); max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center;
  padding: 6px; border-radius: 22px; background: var(--paneel-sterk); border: 1px solid var(--rand); box-shadow: var(--schaduw); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
#tabs button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 52px; border: 0; background: none; color: var(--zacht); font-size: 11px; font-weight: 600; cursor: pointer; border-radius: 16px; }
#tabs button[aria-current="page"] { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
#tabs .tab-plus { width: 56px; height: 56px; justify-self: center; border-radius: 18px; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: var(--op-accent); box-shadow: var(--gloed); }
#tabs .tab-plus .ico { width: 28px; height: 28px; stroke-width: 2.4; }

/* Panelen en tekst */
.paneel { position: relative; background: var(--paneel); border: 1px solid var(--rand); border-radius: 20px; padding: 16px; margin-bottom: 12px; box-shadow: var(--schaduw); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.paneel::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 10%, transparent), transparent 40%); }
.hud-label { margin: 0 0 4px; font: 600 11px/1.2 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
.sectie { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 22px auto 8px; }
.sectie h2 { margin: 0; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--zacht); }
.telling { color: var(--vaag); font-size: 13px; }
.klein { font-size: 13px; color: var(--zacht); }
.hint { margin: 4px 2px 8px; font-size: 14px; color: var(--koelt); min-height: 0; }
.leeg-regel { margin: 0 4px 8px; }
.voet { text-align: center; margin-top: 24px; }
.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-weight: 600; text-align: left; min-height: 44px; display: inline-flex; align-items: center; gap: 4px; }
.link.klein { font-size: 14px; }
h2 .link { min-height: 44px; font-size: inherit; font-weight: inherit; color: inherit; }

/* Knoppen */
.knop { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 14px; border: 1px solid transparent; font-weight: 700; cursor: pointer; text-decoration: none; }
.knop .ico { width: 20px; height: 20px; }
.knop.primair { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: var(--op-accent); box-shadow: var(--gloed); }
.knop.rand { background: var(--paneel); border-color: var(--rand-sterk); color: var(--tekst); }
.knop.gevaar { border-color: color-mix(in srgb, var(--stil) 60%, transparent); color: var(--stil); background: var(--paneel); }
.knop.primair.gevaar { background: var(--stil); color: #fff; }
.knop.breed { width: 100%; }
.knop:disabled { opacity: .45; cursor: default; }
.knoprij { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.knoprij .knop { flex: 1 1 140px; }
.acties { display: flex; flex-wrap: wrap; gap: 8px; }
.acties .knop { flex: 1 1 150px; }
.acties .klein { flex-basis: 100%; margin: 4px 0 0; }
.rij-knop { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; cursor: pointer; min-height: 64px; color: inherit; font: inherit; }
.rij-knop span { flex: 1; display: flex; flex-direction: column; }
.rij-knop small { color: var(--zacht); }
.rij-knop > .ico:first-child { color: var(--accent); }

/* Chips, segmenten, invoer */
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.chip-knop { min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--rand); background: var(--paneel); color: var(--zacht); font-weight: 600; font-size: 14px; cursor: pointer; }
.chip-knop[aria-pressed="true"] { color: var(--op-accent); background: var(--accent); border-color: var(--accent); }
.klein-chips .chip-knop { font-size: 13px; }
.segment { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; margin: 4px 0 12px; border-radius: 14px; background: color-mix(in srgb, var(--rand) 60%, transparent); }
.segment button { min-height: 44px; border: 0; border-radius: 10px; background: transparent; font-weight: 600; cursor: pointer; color: var(--zacht); }
.segment button[aria-pressed="true"] { background: var(--paneel-sterk); color: var(--accent); box-shadow: var(--gloed); }
.veld { margin-bottom: 12px; }
.veld label { display: block; font-weight: 600; margin-bottom: 6px; }
.veld small { color: var(--zacht); font-weight: 400; }
.invoer, select, .zoekbalk input { width: 100%; min-height: 48px; padding: 10px 14px; border-radius: 14px; border: 1px solid var(--rand-sterk); background: var(--paneel-sterk); color: var(--tekst); }
textarea.invoer { resize: vertical; }
select { width: auto; min-height: 44px; padding: 0 12px; }
.zoekbalk { position: relative; margin: 4px auto 6px; }
.zoekbalk .ico { position: absolute; left: 14px; top: 13px; color: var(--zacht); }
.zoekbalk input { padding-left: 44px; }
.regel { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin: 6px auto; }
.invoer-rij { display: flex; gap: 8px; padding: 8px; }
.invoer-rij input { flex: 1; min-height: 48px; border: 0; background: transparent; padding: 0 8px; }
.invoer-rij .knop { min-width: 48px; padding: 0; }
.waarom { margin-top: 10px; font-size: 14px; color: var(--zacht); }
.waarom summary { min-height: 44px; display: flex; align-items: center; color: var(--accent); font-weight: 600; cursor: pointer; }

/* Projectkaart */
.lijst { display: grid; gap: 10px; }
@media (min-width: 700px) { .lijst { grid-template-columns: 1fr 1fr; } }
.kaart { position: relative; display: flex; flex-direction: column; gap: 10px; width: 100%; text-align: left; padding: 14px 14px 12px 18px; border-radius: 18px; border: 1px solid var(--rand); background: var(--paneel);
  color: inherit; cursor: pointer; overflow: hidden; box-shadow: var(--schaduw); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); transition: transform .2s, border-color .2s; }
.kaart::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--pk); box-shadow: 0 0 16px var(--pk); }
.kaart:hover { border-color: var(--rand-sterk); transform: translateY(-1px); }
.kaart-kop { display: flex; align-items: center; gap: 10px; }
.fase-letter { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 10px; font: 800 16px ui-monospace, Menlo, monospace; color: var(--pk); border: 1px solid var(--pk); background: color-mix(in srgb, var(--pk) 12%, transparent); flex: none; }
.kaart-titel { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.kaart-titel b { font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kaart-titel small { color: var(--zacht); font-size: 12px; }
.balk { display: block; height: 4px; border-radius: 4px; background: color-mix(in srgb, var(--rand) 80%, transparent); overflow: hidden; }
.balk i { display: block; height: 100%; background: linear-gradient(90deg, var(--pk), color-mix(in srgb, var(--pk) 50%, var(--accent2))); box-shadow: 0 0 10px var(--pk); }
.kaart-voet { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--zacht); }
.kaart-voet .ico { width: 14px; height: 14px; vertical-align: -2px; margin-right: 2px; }
.kaart-stap { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--tekst); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid var(--rand); white-space: nowrap; }
.stip { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--rust); }
.g-koers .stip, .stip.g-koers { background: var(--koers); box-shadow: 0 0 8px var(--koers); }
.g-afkoelend .stip, .stip.g-afkoelend, .g-deadline .stip { background: var(--koelt); box-shadow: 0 0 8px var(--koelt); }
.g-stil .stip, .stip.g-stil, .g-verlopen .stip { background: var(--stil); box-shadow: 0 0 8px var(--stil); }
.chip.g-koers { color: var(--koers); } .chip.g-afkoelend, .chip.g-deadline { color: var(--koelt); } .chip.g-stil, .chip.g-verlopen { color: var(--stil); } .chip.g-rust { color: var(--rust); }

/* Commandocentrum */
.welkom h2 { margin: 4px 0 8px; font-size: 26px; }
.focus { border-color: color-mix(in srgb, var(--pk) 45%, transparent); box-shadow: var(--schaduw), 0 0 30px color-mix(in srgb, var(--pk) 18%, transparent); }
.focus-kop { display: flex; justify-content: space-between; align-items: center; }
.focus-midden { display: flex; align-items: center; gap: 14px; margin-top: 8px; }
.focus h2 { margin: 0 0 4px; font-size: 22px; line-height: 1.2; }
.focus-zin { margin: 0; color: var(--zacht); }
.tellers { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
.teller { padding: 12px 8px; border-radius: 16px; border: 1px solid var(--rand); background: var(--paneel); text-align: center; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.teller b { display: block; font-size: 22px; color: var(--accent); text-shadow: 0 0 14px color-mix(in srgb, var(--accent) 50%, transparent); }
.teller b small { font-size: 12px; color: var(--zacht); text-shadow: none; }
.teller span { font-size: 11px; color: var(--zacht); text-transform: uppercase; letter-spacing: .08em; }
.teller.te-veel b { color: var(--koelt); }
.radar { padding: 8px; display: flex; flex-direction: column; align-items: center; }
.orbit { width: 100%; max-width: 360px; height: auto; }
.orbit .baan { fill: none; stroke: var(--rand-sterk); stroke-dasharray: 2 6; }
.orbit .kruis { stroke: var(--rand); }
.orbit .kern { fill: var(--accent); filter: drop-shadow(0 0 6px var(--accent)); }
.orbit .sweep path { fill: color-mix(in srgb, var(--accent) 14%, transparent); }
.orbit .sweep { transform-origin: 160px 160px; animation: draai 6s linear infinite; }
.orbit .knoop { cursor: pointer; }
.orbit .knoop circle:first-child { filter: drop-shadow(0 0 8px currentColor); }
.orbit .knoop-halo { fill: none; stroke-width: 1.5; opacity: .5; }
.orbit .g-stil .knoop-halo, .orbit .g-afkoelend .knoop-halo { stroke-dasharray: 3 4; }
.orbit .knoop-naam { fill: var(--zacht); font-size: 10px; text-anchor: middle; }
.legenda { display: flex; gap: 12px; align-items: center; margin: 0 0 4px; }
.legenda .stip { margin-left: 4px; }
.let { border-color: color-mix(in srgb, var(--koelt) 50%, transparent); }
@keyframes draai { to { transform: rotate(360deg); } }

/* Ring */
.ring { flex: none; }
.ring-baan { fill: none; stroke: color-mix(in srgb, var(--rand) 90%, transparent); stroke-width: 8; }
.ring-voor { fill: none; stroke-width: 8; stroke-linecap: round; filter: drop-shadow(0 0 6px currentColor); transition: stroke-dashoffset .6s; }
.ring-tekst { fill: var(--tekst); font-size: 24px; font-weight: 800; text-anchor: middle; }
.ring-pct { font-size: 12px; fill: var(--zacht); }

/* Project */
.held { border-color: color-mix(in srgb, var(--pk) 40%, transparent); }
.held-kop { display: flex; align-items: center; gap: 14px; }
.held h2 { margin: 0 0 6px; font-size: 24px; line-height: 1.15; }
.fasebalk { list-style: none; display: grid; grid-template-columns: repeat(7, minmax(44px, 1fr)); gap: 3px; margin: 16px -6px 8px; padding: 0 0 2px; position: relative; overflow-x: auto; }
.fasebalk li button, .fasebalk li span { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; width: 100%; min-height: 56px; padding: 4px 0; border-radius: 12px;
  border: 1px solid var(--rand); background: var(--paneel-sterk); color: var(--vaag); cursor: pointer; }
.fasebalk b { font: 800 16px ui-monospace, Menlo, monospace; }
.fasebalk small { font-size: 9px; letter-spacing: .02em; overflow: hidden; max-width: 100%; text-overflow: ellipsis; white-space: nowrap; }
.fasebalk .gedaan button, .fasebalk .gedaan span { color: var(--pk); border-color: color-mix(in srgb, var(--pk) 40%, transparent); background: color-mix(in srgb, var(--pk) 10%, var(--paneel-sterk)); }
.fasebalk .nu button, .fasebalk .nu span { color: var(--op-accent); background: var(--pk); border-color: var(--pk); box-shadow: 0 0 18px var(--pk); }
.fase-vraag { margin: 6px 0 0; color: var(--zacht); }
.fase-vraag b { color: var(--tekst); }
.held-meta { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 12px; font-size: 13px; color: var(--zacht); }
.held-meta .ico { width: 15px; height: 15px; vertical-align: -3px; margin-right: 4px; }
.duo { display: grid; gap: 12px; }
@media (min-width: 600px) { .duo { grid-template-columns: 1fr 1fr; } }
.duo p { margin: 0; }
.stappen, .mijlpalen { list-style: none; padding: 6px 8px; }
.stappen li, .mijlpalen li { display: flex; align-items: center; gap: 6px; padding: 2px 0; border-top: 1px solid var(--rand); }
.stappen li:first-child, .mijlpalen li:first-child { border-top: 0; }
.stap-tekst, .mijlpalen li > span { flex: 1; min-width: 0; }
.mijlpalen li > span { display: flex; flex-direction: column; }
.mijlpalen small { color: var(--zacht); font-size: 12px; }
.af .stap-tekst, .mijlpalen .af b { text-decoration: line-through; color: var(--vaag); }
.gepind .stap-tekst { color: var(--accent); font-weight: 600; }
.vink { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--rand-sterk); background: transparent; color: transparent; cursor: pointer; flex: none; }
.vink[aria-pressed="true"] { background: var(--koers); border-color: var(--koers); color: #02150c; box-shadow: 0 0 12px color-mix(in srgb, var(--koers) 60%, transparent); }
.mijlpalen .vink { color: var(--zacht); }
.mijlpalen .vink[aria-pressed="true"] { color: #02150c; }
.mini { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 0; background: none; color: var(--vaag); cursor: pointer; border-radius: 10px; flex: none; }
.mini .ico { width: 18px; height: 18px; }
.mini[aria-pressed="true"] { color: var(--accent); }
.mini:disabled { opacity: .25; cursor: default; }

/* Tijdlijn */
.tijdlijn { list-style: none; margin: 0 auto; padding: 0 0 0 4px; position: relative; }
.tijdlijn::before { content: ""; position: absolute; left: 62px; top: 0; bottom: 0; width: 1px; background: linear-gradient(var(--accent), transparent); opacity: .4; }
.tijdlijn .dag { margin: 14px 0 6px; font: 600 11px ui-monospace, Menlo, monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.tijdlijn .log { display: grid; grid-template-columns: 46px 28px 1fr; align-items: start; gap: 6px; padding: 6px 0; }
.tijdlijn .tijd { color: var(--vaag); font-size: 12px; padding-top: 2px; }
.log-ico { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; background: var(--paneel-sterk); border: 1px solid var(--rand-sterk); font-size: 12px; position: relative; z-index: 1; }
.s-winst .log-ico { color: var(--koers); border-color: var(--koers); } .s-blokkade .log-ico { color: var(--stil); border-color: var(--stil); } .s-werk .log-ico { color: var(--accent); border-color: var(--accent); }
.log-tekst { font-size: 14px; display: flex; flex-direction: column; }
.log-tekst .link { min-height: 32px; }

/* Wizard en onderblad */
#dek { position: fixed; inset: 0; z-index: 20; background: rgba(0, 4, 12, .6); opacity: 0; pointer-events: none; transition: opacity .25s; }
#dek.open { opacity: 1; pointer-events: auto; }
#blad { position: fixed; z-index: 21; left: 0; right: 0; bottom: 0; max-width: 640px; margin: 0 auto; max-height: 88vh; overflow-y: auto; padding: 8px 18px calc(env(safe-area-inset-bottom) + 18px);
  background: var(--paneel-sterk); border: 1px solid var(--rand-sterk); border-bottom: 0; border-radius: 26px 26px 0 0; box-shadow: 0 -10px 50px rgba(0, 0, 0, .5); transform: translateY(105%); transition: transform .32s cubic-bezier(.2, .9, .3, 1); }
#blad.open { transform: none; visibility: visible; transition: transform .32s cubic-bezier(.2, .9, .3, 1), visibility 0s; }
#blad:not(.open) { visibility: hidden; transition: transform .32s cubic-bezier(.2, .9, .3, 1), visibility 0s .32s; }
.blad-kop { display: flex; align-items: center; justify-content: space-between; gap: 8px; position: sticky; top: -8px; padding: 10px 0; background: var(--paneel-sterk); z-index: 1; }
.blad-kop h2 { margin: 0; font-size: 19px; }
#bladknoppen { display: flex; gap: 8px; margin-top: 8px; }
#bladknoppen .knop { flex: 1; }
.wz-voortgang { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 2px 0 14px; }
.wz-voortgang i { height: 4px; border-radius: 4px; background: var(--rand); }
.wz-voortgang i.aan { background: linear-gradient(90deg, var(--accent), var(--accent2)); box-shadow: 0 0 8px var(--accent); }
.kleuren { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 12px; }
.kleur { width: 44px; height: 44px; border-radius: 50%; border: 2px solid transparent; background: var(--k); cursor: pointer; box-shadow: 0 0 12px color-mix(in srgb, var(--k) 50%, transparent); }
.kleur[aria-pressed="true"] { border-color: var(--tekst); outline: 2px solid var(--k); outline-offset: 2px; }
.instellingen .segment { margin-bottom: 14px; }

/* Melding en afronden */
#toast { position: fixed; z-index: 30; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 90px); max-width: 520px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 16px;
  background: var(--paneel-sterk); border: 1px solid var(--rand-sterk); box-shadow: var(--schaduw), var(--gloed); transform: translateY(20px); opacity: 0; pointer-events: none; transition: .25s; }
#toast.open { transform: none; opacity: 1; pointer-events: auto; }
#toast span { flex: 1; }
#toast button { min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--accent); background: none; color: var(--accent); font-weight: 700; cursor: pointer; }
.feest { position: fixed; inset: 0; z-index: 25; pointer-events: none; }
.feest i { position: absolute; left: 50%; top: 45%; width: 8px; height: 14px; border-radius: 2px; background: var(--k); box-shadow: 0 0 10px var(--k); animation: vonk 1.6s cubic-bezier(.15, .7, .3, 1) forwards; --hoek: calc(var(--i) * 12.86deg); }
@keyframes vonk { to { transform: rotate(var(--hoek)) translateY(-42vh) rotate(180deg); opacity: 0; } }

/* Minder beweging: overal */
[data-beweging="rustig"] *, [data-beweging="rustig"] *::before, [data-beweging="rustig"] *::after { animation: none !important; transition: none !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* === Fase 2: accountability === */
.checkin { border-color: color-mix(in srgb, var(--pk) 55%, transparent); box-shadow: var(--schaduw), 0 0 26px color-mix(in srgb, var(--pk) 22%, transparent); animation: puls 2.4s ease-in-out infinite; }
.checkin-zin { margin: 4px 0 12px; font-size: 17px; }
.checkin-knoppen { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 8px; }
@keyframes puls { 50% { box-shadow: var(--schaduw), 0 0 40px color-mix(in srgb, var(--pk) 35%, transparent); } }
.focusacties .knop { flex: 1 1 130px; }
.beloftes { list-style: none; padding: 8px 14px; }
.beloftes li { display: flex; gap: 12px; padding: 8px 0; border-top: 1px solid var(--rand); align-items: baseline; }
.beloftes li:first-child { border-top: 0; }
.beloftes .mono { color: var(--accent); font-size: 13px; flex: none; min-width: 96px; }
.schakel { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 56px; padding: 8px 12px; margin-bottom: 12px; border-radius: 14px; border: 1px solid var(--rand-sterk); background: var(--paneel); text-align: left; cursor: pointer; }
.schakel > span:first-child { display: flex; flex-direction: column; }
.toggle { position: relative; width: 50px; height: 30px; border-radius: 999px; background: var(--rand-sterk); flex: none; transition: background .2s; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; }
[aria-pressed="true"] > .toggle { background: var(--koers); }
[aria-pressed="true"] > .toggle::after { transform: translateX(20px); }
.blok-klaar { margin: 0 0 14px; font-size: 32px; font-weight: 800; color: var(--accent); text-shadow: 0 0 18px color-mix(in srgb, var(--accent) 50%, transparent); }
#timer { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; padding: 24px; background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--accent) 14%, var(--bg)), var(--bg) 70%); }
.timer-binnen { width: 100%; max-width: 420px; text-align: center; }
.timer-binnen h2 { margin: 4px 0; font-size: 24px; }
.timer-ring { position: relative; width: min(78vw, 320px); aspect-ratio: 1; margin: 18px auto; }
.timer-ring svg { width: 100%; height: 100%; }
.timer-ring .ring-voor { stroke: var(--pk); stroke-width: 10; }
.timer-ring .ring-baan { stroke-width: 10; }
.timer-ring b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: clamp(48px, 16vw, 72px); font-weight: 800; letter-spacing: -.02em; text-shadow: 0 0 24px color-mix(in srgb, var(--pk) 60%, transparent); }
.week-lijst { display: grid; gap: 4px; padding: 8px 14px; }
.week-rij { padding: 8px 0; border-top: 1px solid var(--rand); }
.week-rij:first-child { border-top: 0; }
.week-rij > div:first-child { display: flex; flex-direction: column; margin-bottom: 6px; }
.week-rij .segment { margin: 0; }

/* Licht thema: neonkleuren als vlak met donkere tekst, als tekst donkerder (contrast ≥ 4.5:1). */
[data-thema="licht"] .fasebalk .nu button, [data-thema="licht"] .fasebalk .nu span { color: #04060c; }
[data-thema="licht"] .fase-letter, [data-thema="licht"] .fasebalk .gedaan button, [data-thema="licht"] .fasebalk .gedaan span { color: color-mix(in srgb, var(--pk) 40%, #000); }
@media (prefers-color-scheme: light) {
  [data-thema="systeem"] .fasebalk .nu button, [data-thema="systeem"] .fasebalk .nu span { color: #04060c; }
  [data-thema="systeem"] .fase-letter, [data-thema="systeem"] .fasebalk .gedaan button, [data-thema="systeem"] .fasebalk .gedaan span { color: color-mix(in srgb, var(--pk) 40%, #000); }
}
.orbit .knoop-meer circle { fill: var(--paneel-sterk); stroke: var(--rand-sterk); }
.orbit .meer-tekst { fill: var(--tekst); font-weight: 700; font-size: 12px; }

</style>
</head>
<body>
<div class="achtergrond" aria-hidden="true"><div class="raster"></div><div class="gloed g1"></div><div class="gloed g2"></div></div>
<header class="kop">
  <button type="button" class="icoonknop" id="terugknop" aria-label="Terug" hidden><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div class="kop-tekst"><h1 id="titel">FutureMe</h1><p id="subtitel"></p></div>
  <span class="kop-merk mono" aria-hidden="true">FM//</span>
</header>
<main id="scherm" tabindex="-1"></main>

  <button type="button" data-tab="projecten"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="4" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>Projecten</span></button>
  <button type="button" data-tab="nieuw" class="tab-plus" aria-label="Nieuw project"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  <button type="button" data-tab="log"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h13"/></svg><span>Log</span></button>

</nav>
<div id="dek"></div>
<section id="blad" role="dialog" aria-modal="true" aria-labelledby="bladtitel" aria-hidden="true">
  <div class="blad-kop"><h2 id="bladtitel"></h2><button type="button" class="icoonknop" id="bladsluit" aria-label="Sluiten"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div id="bladinhoud"></div>
  <div id="bladknoppen"></div>

<div id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
// === KERN: pure functies (geen DOM, geen opslag), getest in projecten/tests/kern.test.mjs ===

/* PT-KERN-BEGIN */
const PT_FASES = [
  { id: "idee", letter: "A", naam: "Idee", vraag: "Wat wil je maken, en waarom?" },
  { id: "verkennen", letter: "B", naam: "Verkennen", vraag: "Wat weet je nog niet?" },
  { id: "plannen", letter: "C", naam: "Plannen", vraag: "Wat zijn de mijlpalen?" },
  { id: "bouwen", letter: "D", naam: "Bouwen", vraag: "Wat is de volgende handeling?" },
  { id: "afronden", letter: "E", naam: "Afronden", vraag: "Wat is nog nodig voor 'klaar'?" },
  { id: "opleveren", letter: "F", naam: "Opleveren", vraag: "Bij wie of waar komt het terecht?" },
  { id: "evalueren", letter: "G", naam: "Evalueren", vraag: "Wat neem je mee naar het volgende project?" }
];
const PT_STATUS = {
  idee: { naam: "Ideeënbak", kort: "Idee" },
  actief: { naam: "Actief", kort: "Actief" },
  wacht: { naam: "Wacht op iets", kort: "Wacht" },
  pauze: { naam: "Gepauzeerd", kort: "Pauze" },
  klaar: { naam: "Afgerond", kort: "Klaar" },
  archief: { naam: "Gearchiveerd", kort: "Archief" }
};
const PT_ENERGIE = { laag: "Weinig energie", midden: "Gemiddeld", hoog: "Veel energie" };
const PT_LOGSOORTEN = {
  werk: { naam: "Werkblok", ico: "▶" }, notitie: { naam: "Notitie", ico: "✎" }, blokkade: { naam: "Blokkade", ico: "⛔" },
  winst: { naam: "Winst", ico: "★" }, energie: { naam: "Energie", ico: "⚡" }, fase: { naam: "Fase", ico: "⇢" }
};
const PT_KLEUREN = ["#36e2ff", "#8b7bff", "#ff5fd2", "#4dffa6", "#ffb84d", "#ff6b6b", "#5d9cff", "#e6ff5c"];
const PT_DAG = 86400000;

const ptFaseIndex = id => Math.max(0, PT_FASES.findIndex(f => f.id === id));
const ptIsOpen = p => p && ["idee", "actief", "wacht", "pauze"].includes(p.status);

/** Voortgang 0–100: de fase telt mee (A=0, G≈90) en binnen de fase het deel van de stappen dat af is. */
function ptVoortgang(p, stappen) {
  if (!p) return 0;
  if (p.status === "klaar" || p.status === "archief" && p.afgerondOp) return 100;
  const i = ptFaseIndex(p.fase), stuk = 100 / PT_FASES.length;
  const eigen = (stappen || []).filter(s => s.projectId === p.id);
  const af = eigen.length ? eigen.filter(s => s.af).length / eigen.length : 0;
  return Math.min(99, Math.round(i * stuk + af * stuk));
}

/** Dagen sinds de laatste log (of sinds het project gemaakt is). */
function ptDagenStil(p, logs, nu) {
  const eigen = (logs || []).filter(l => l.projectId === p.id).map(l => Date.parse(l.ts)).filter(Boolean);
  const laatst = eigen.length ? Math.max(...eigen) : Date.parse(p.gemaakt) || nu;
  return Math.max(0, Math.floor((nu - laatst) / PT_DAG));
}

/** Gezondheid van een open project: op koers, afkoelend, stil, deadline dichtbij of verlopen. */
function ptGezondheid(p, logs, nu) {
  if (!ptIsOpen(p)) return { id: "rust", naam: PT_STATUS[p.status] ? PT_STATUS[p.status].naam : "Rust" };
  // Ideeën en gepauzeerde projecten lopen niet weg: daar geen deadline-alarm.
  if (p.deadline && ["actief", "wacht"].includes(p.status)) {
    const dagen = Math.floor((Date.parse(p.deadline + "T23:59:59") - nu) / PT_DAG);
    if (dagen < 0) return { id: "verlopen", naam: "Deadline voorbij", dagen };
    if (dagen <= 3 && p.status === "actief") return { id: "deadline", naam: dagen === 0 ? "Deadline vandaag" : `Deadline over ${dagen} ${dagen === 1 ? "dag" : "dagen"}`, dagen };
  }
  if (p.status !== "actief") return { id: "rust", naam: PT_STATUS[p.status].naam };
  const stil = ptDagenStil(p, logs, nu);
  if (stil >= 14) return { id: "stil", naam: `${stil} dagen stil`, dagen: stil };
  if (stil >= 7) return { id: "afkoelend", naam: "Koelt af", dagen: stil };
  return { id: "koers", naam: "Op koers", dagen: stil };
}

/** De volgende stap: eerst een gepinde, dan de eerste open stap op volgorde. */
function ptVolgendeStap(p, stappen) {
  const open = (stappen || []).filter(s => s.projectId === p.id && !s.af).sort((a, b) => (b.pin ? 1 : 0) - (a.pin ? 1 : 0) || (a.volgorde || 0) - (b.volgorde || 0));
  return open[0] || null;
}

const ptNorm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
/** Filteren. f: { status: [..] | "open" | "alles", fase, cluster, tag, energie, zoek }. */
function ptFilter(projecten, f) {
  const o = f || {};
  return (projecten || []).filter(p => {
    if (o.status === "open" ? !ptIsOpen(p) : Array.isArray(o.status) && o.status.length && !o.status.includes(p.status)) return false;
    if (o.fase && p.fase !== o.fase) return false;
    if (o.cluster && (p.cluster || "") !== o.cluster) return false;
    if (o.tag && !(p.tags || []).includes(o.tag)) return false;
    if (o.energie && p.energie !== o.energie) return false;
    if (o.zoek) {
      const w = ptNorm(o.zoek).trim();
      if (w && !ptNorm([p.titel, p.waarom, p.klaar, p.cluster, (p.tags || []).join(" ")].join(" ")).includes(w)) return false;
    }
    return true;
  });
}

/** Sorteren: prioriteit, deadline, voortgang, bijgewerkt of titel. */
function ptSorteer(projecten, op, stappen) {
  const l = (projecten || []).slice(), d = p => p.deadline || "9999-12-31";
  const cmp = {
    prioriteit: (a, b) => (b.prioriteit || 0) - (a.prioriteit || 0) || d(a).localeCompare(d(b)),
    deadline: (a, b) => d(a).localeCompare(d(b)),
    voortgang: (a, b) => ptVoortgang(b, stappen) - ptVoortgang(a, stappen),
    bijgewerkt: (a, b) => String(b.bijgewerkt || "").localeCompare(String(a.bijgewerkt || "")),
    titel: (a, b) => String(a.titel).localeCompare(String(b.titel), "nl")
  }[op] || ((a, b) => 0);
  return l.sort(cmp);
}

/** Clusteren in groepen, op een vaste volgorde. op: fase | status | cluster | energie | deadline. */
function ptCluster(projecten, op, nu) {
  const groepen = new Map();
  const zet = (sleutel, naam, p) => { if (!groepen.has(sleutel)) groepen.set(sleutel, { sleutel, naam, projecten: [] }); groepen.get(sleutel).projecten.push(p); };
  const volgorde = {
    fase: PT_FASES.map(f => f.id), status: Object.keys(PT_STATUS), energie: ["hoog", "midden", "laag", ""],
    deadline: ["verlopen", "week", "maand", "later", "geen"]
  }[op];
  for (const p of projecten || []) {
    if (op === "fase") { const f = PT_FASES[ptFaseIndex(p.fase)]; zet(f.id, `${f.letter} · ${f.naam}`, p); }
    else if (op === "status") zet(p.status, PT_STATUS[p.status] ? PT_STATUS[p.status].naam : p.status, p);
    else if (op === "energie") zet(p.energie || "", PT_ENERGIE[p.energie] || "Energie onbekend", p);
    else if (op === "deadline") {
      if (!p.deadline) zet("geen", "Geen deadline", p);
      else { const dg = Math.floor((Date.parse(p.deadline + "T23:59:59") - nu) / PT_DAG);
        if (dg < 0) zet("verlopen", "Deadline voorbij", p); else if (dg <= 7) zet("week", "Binnen een week", p); else if (dg <= 31) zet("maand", "Binnen een maand", p); else zet("later", "Later", p); }
    } else zet(p.cluster || "", p.cluster || "Zonder cluster", p);
  }
  const l = [...groepen.values()];
  if (volgorde) l.sort((a, b) => volgorde.indexOf(a.sleutel) - volgorde.indexOf(b.sleutel));
  else l.sort((a, b) => (a.sleutel === "") - (b.sleutel === "") || a.naam.localeCompare(b.naam, "nl"));
  return l;
}

/** De draad: op hoeveel van de laatste n dagen heb je iets gelogd (geen streak, geen schuld). */
function ptDraad(logs, nu, n, projectId) {
  const dagen = n || 14, set = new Set(), begin = new Date(nu);
  begin.setHours(0, 0, 0, 0); begin.setDate(begin.getDate() - (dagen - 1));   // kalenderdagen: vandaag plus de n-1 dagen ervoor
  for (const l of logs || []) {
    if (projectId && l.projectId !== projectId) continue;
    const t = Date.parse(l.ts); if (!t || t < begin.getTime() || t > nu) continue;
    const d = new Date(t); set.add(d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate());
  }
  return { actief: set.size, van: dagen };
}

/** Minuten gewerkt (werkblokken) vanaf een moment, optioneel per project. */
function ptMinuten(logs, vanaf, projectId) {
  return (logs || []).filter(l => l.soort === "werk" && Date.parse(l.ts) >= vanaf && (!projectId || l.projectId === projectId)).reduce((s, l) => s + (+l.minuten || 0), 0);
}

/** WIP: mag er nog een project actief? Geeft het aantal actief en de limiet terug. */
function ptWip(projecten, limiet, behalveId) {
  const actief = (projecten || []).filter(p => p.status === "actief" && p.id !== behalveId).length;
  return { actief, limiet, vrij: actief < limiet };
}

/** Werkwoordcheck light: is een eerste stap concreet genoeg (begint met een handeling)? */
const PT_VAAG = ["regelen", "fixen", "uitzoeken", "oppakken", "afhandelen", "organiseren", "iets", "dingen", "zaken", "nadenken", "bezig", "werken"];
const PT_GEBIEDEND = ["ga", "doe", "neem", "kijk", "geef", "loop", "fiets", "rij", "bel", "mail", "app", "koop", "schrijf", "maak", "stuur", "betaal", "plan", "lees", "zoek", "pak", "leg", "zet", "breng", "haal", "check", "vul", "print", "open", "teken", "scan", "bestel", "vraag", "test", "bouw", "kies", "noteer", "lijst", "schets", "kopieer", "installeer", "maak", "zoek", "bekijk", "sorteer", "verwijder", "ruim"];
function ptStapVaag(tekst) {
  const w = ptNorm(tekst).replace(/[^a-z0-9 ]+/g, " ").trim().split(/\s+/).filter(Boolean);
  if (!w.length) return true;
  if (PT_GEBIEDEND.includes(w[0])) return false;               // gebiedende wijs vooraan: concreet ("Bel Jan over iets")
  if (w.some(x => PT_VAAG.includes(x))) return true;
  if (w.length === 1) return true;                             // één woord ("Facturen", "Website") is te kaal
  return !w.some(x => x.length >= 5 && /(en|eren|elen)$/.test(x));
}

/** Een project in één zin voor het commandocentrum. */
function ptStatusZin(p, g, stap) {
  if (!p) return "Geen project in focus.";
  if (g.id === "verlopen") return `${p.titel}: de deadline is voorbij. Een nieuwe datum is ook een plan.`;
  if (g.id === "stil") return `${p.titel} ligt ${g.dagen} dagen stil. Eén kleine stap brengt hem weer in beweging.`;
  if (g.id === "afkoelend") return `${p.titel} koelt af. Vijf minuten vandaag houdt de draad vast.`;

"use strict";
// === OPSLAG: IndexedDB op het toestel. Alles staat ook in het geheugen (S), zodat lezen synchroon is. ===
const DB_NAAM = "futureme-projecten", DB_VERSIE = 2;   // 2: beloftes (fase 2)
const WINKELS = ["projecten", "stappen", "mijlpalen", "logs", "beloftes", "instellingen"];
const S = { projecten: [], stappen: [], mijlpalen: [], logs: [], beloftes: [], instellingen: {} };
let DB = null;

function dbOpen() {
  return new Promise((ok, fout) => {
    if (!("indexedDB" in window)) return ok(null);
    const r = indexedDB.open(DB_NAAM, DB_VERSIE);
    r.onupgradeneeded = () => {
      const db = r.result;
      for (const w of WINKELS) if (!db.objectStoreNames.contains(w)) db.createObjectStore(w, { keyPath: w === "instellingen" ? "sleutel" : "id" });
    };
    r.onsuccess = () => ok(r.result);
    r.onerror = () => fout(r.error);
  });
}
function dbAlles(w) {
  return new Promise((ok, fout) => {
    if (!DB) return ok([]);
    const r = DB.transaction(w).objectStore(w).getAll();
    r.onsuccess = () => ok(r.result || []); r.onerror = () => fout(r.error);
  });
}
function dbZet(w, obj) {
  return new Promise((ok, fout) => {
    if (!DB) return ok();
    const t = DB.transaction(w, "readwrite"); t.objectStore(w).put(obj);
    t.oncomplete = () => ok(); t.onerror = () => fout(t.error);
  });
}
function dbWis(w, id) {
  return new Promise((ok, fout) => {
    if (!DB) return ok();
    const t = DB.transaction(w, "readwrite"); t.objectStore(w).delete(id);
    t.oncomplete = () => ok(); t.onerror = () => fout(t.error);
  });
}
async function dbLaad() {
  try { DB = await dbOpen(); } catch (e) { DB = null; }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  for (const w of WINKELS) {
    const l = await dbAlles(w).catch(() => []);
    if (w === "instellingen") { S.instellingen = {}; for (const x of l) S.instellingen[x.sleutel] = x.waarde; }
    else S[w] = l;
  }
}

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const vind = (w, id) => S[w].find(x => x.id === id) || null;
async function bewaar(w, obj) {
  obj.bijgewerkt = new Date().toISOString();
  const l = S[w], i = l.findIndex(x => x.id === obj.id);
  if (i >= 0) l[i] = obj; else l.push(obj);
  try { await dbZet(w, obj); } catch (e) { toast("Opslaan lukte niet. Maak een export als dat vaker gebeurt."); }
  return obj;
}
async function verwijder(w, id, geenSpoor) {
  const i = S[w].findIndex(x => x.id === id); if (i >= 0) S[w].splice(i, 1);
  try { await dbWis(w, id); } catch (e) {}
  // Een spoor van wat weg is, zodat samenvoegen met een oude export het niet terugbrengt.
  if (!geenSpoor) { const weg = Object.assign({}, inst("weg", {})); weg[w + ":" + id] = new Date().toISOString(); await zetInst("weg", weg); }
}
const inst = (k, std) => S.instellingen[k] === undefined ? std : S.instellingen[k];
async function zetInst(k, v) { S.instellingen[k] = v; try { await dbZet("instellingen", { sleutel: k, waarde: v }); } catch (e) {} }

/* ---------- Export en import (één JSON-bestand) ---------- */
function exportJSON() {
  return JSON.stringify({ app: "FutureMe Projecten", versie: 1, gemaakt: new Date().toISOString(),
    projecten: S.projecten, stappen: S.stappen, mijlpalen: S.mijlpalen, logs: S.logs, beloftes: S.beloftes, instellingen: S.instellingen }, null, 1);
}
/** Importeren: samenvoegen (nieuwste per id wint) of vervangen. Geeft het aantal per winkel terug. */
const IMPORT_WINKELS = ["projecten", "stappen", "mijlpalen", "logs", "beloftes"];
async function importJSON(tekst, vervangen) {
  let d;
  try { d = JSON.parse(tekst); } catch (e) { throw new Error("Dit bestand is geen geldige export."); }
  if (!d || d.app !== "FutureMe Projecten") throw new Error("Dit is geen export van FutureMe Projecten.");
  // Eerst alles controleren, pas daarna iets wissen: een kapot bestand laat je gegevens met rust.
  for (const w of IMPORT_WINKELS) if (d[w] !== undefined && (!Array.isArray(d[w]) || d[w].some(x => !x || typeof x !== "object" || !x.id)))
    throw new Error("Dit bestand is beschadigd. Er is niets veranderd.");
  if (!Array.isArray(d.projecten)) throw new Error("Dit bestand bevat geen projecten. Er is niets veranderd.");
  const tel = {}, weg = vervangen ? {} : inst("weg", {}) || {};
  for (const w of IMPORT_WINKELS) {
    const nieuw = d[w] || [];
    if (vervangen) for (const x of S[w].slice()) await verwijder(w, x.id, true);
    let n = 0;
    for (const x of nieuw) {
      const verwijderd = weg[w + ":" + x.id];
      if (verwijderd && verwijderd >= String(x.bijgewerkt || "")) continue;   // hier al verwijderd, na deze versie
      const oud = vind(w, x.id);
      if (!oud || String(x.bijgewerkt || "") >= String(oud.bijgewerkt || "")) {
        const i = S[w].findIndex(y => y.id === x.id); if (i >= 0) S[w][i] = x; else S[w].push(x);
        try { await dbZet(w, x); } catch (e) {}
        n++;
      }
    }
    tel[w] = n;
  }
  if (d.instellingen && typeof d.instellingen === "object") for (const [k, v] of Object.entries(d.instellingen)) {
    if (k === "weg" && !vervangen) await zetInst("weg", Object.assign({}, v || {}, inst("weg", {})));
    else if (vervangen || S.instellingen[k] === undefined) await zetInst(k, v);
  }
  return tel;
}

function tijdlijn(logs, metProject) {

    const p = metProject ? vind("projecten", l.projectId) : null, s = PT_LOGSOORTEN[l.soort] || PT_LOGSOORTEN.notitie;

        <div class="lijst">${S.projecten.filter(x => x.status === "actief").map(x => `<button class="knop rand breed" data-wip-pauze="${esc(x.id)}" data-nieuw="${esc(p.id)}">${esc(x.titel)} pauzeren</button>`).join("")}</div>`,

const BEZIG = new Set(), PRULLENBAK = [];

/* ---------- Eén klikafhandeling voor alles ---------- */
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-wz],[data-wz-vb],[data-wz-energie],[data-wz-kleur],[data-wz-status],[data-stap-af],[data-stap-vink],[data-stap-pin],[data-stap-op],[data-stap-weg],[data-mijl-nieuw],[data-mijl-vink],[data-mijl-weg],[data-snel-log],[data-status],[data-wip-pauze],[data-wip-toch],[data-project-bewerk],[data-project-weg],[data-fase],[data-filter-status],[data-filter-cluster],[data-filter-tag],[data-log-filter],[data-inst],[data-export],[data-focus-kies],[data-focus-zet]");

  if (d.wzEnergie) { wizardLees(); WZ.d.energie = WZ.d.energie === d.wzEnergie ? "" : d.wzEnergie; return wizardTeken(); }
  if (d.wzKleur) { wizardLees(); WZ.d.kleur = d.wzKleur; return wizardTeken(); }
  if (d.wzStatus) { wizardLees(); WZ.d.status = d.wzStatus; return wizardTeken(); }
  if (d.stapAf || d.stapVink) {

    if (d.stapAf && s.af) return;   // "Stap klaar" zet af, nooit terug

    s.af = !s.af; s.afOp = s.af ? new Date().toISOString() : null; await bewaar("stappen", s);
    if (s.af) await log(s.projectId, "winst", `Stap: ${s.tekst}`);
    tril(s.af ? 12 : 6); teken();
    if (s.af) { const p = vind("projecten", s.projectId), v = p && ptVolgendeStap(p, S.stappen); toast(v ? `Mooi. Volgende: ${v.tekst}` : "Mooi. Wat is de volgende stap?"); }
    return;

    return;

});

/* De app is je accountabilitypartner: je spreekt iets af met jezelf, de app vraagt

/* PT-ACC-BEGIN */
const PT_REDENEN = [["groot", "Te groot"], ["tijd", "Geen tijd"], ["vergeten", "Vergeten"], ["zin", "Geen zin"], ["onduidelijk", "Onduidelijk"], ["anders", "Iets anders"]];

/** Lokaal moment als "YYYY-MM-DDTHH:MM" naar milliseconden. */
const ptMomentMs = m => Date.parse(m);
/** Open beloftes waarvan het moment voorbij is: tijd voor een check-in. Oudste eerst. */
function ptCheckinsNodig(beloftes, nu) {
  return (beloftes || []).filter(b => b.status === "open" && ptMomentMs(b.moment) <= nu).sort((a, b) => a.moment.localeCompare(b.moment));
}
/** Hoe gaan je beloftes (vanaf een moment)? Half telt voor de helft; losgelaten telt niet mee. */
function ptBeloftesCijfers(beloftes, vanaf, projectId) {
  const l = (beloftes || []).filter(b => b.antwoordOp && Date.parse(b.antwoordOp) >= (vanaf || 0) && (!projectId || b.projectId === projectId));
  const tel = { gedaan: 0, half: 0, niet: 0, los: 0 };
  for (const b of l) if (tel[b.status] !== undefined) tel[b.status]++;

/** De meest voorkomende reden bij "niet gelukt" (voor een tip), of null. */

      <div class="segment" role="group" aria-label="Hoe verder met ${esc(p.titel)}">${[["door", "Door"], ["pauze", "Pauze"], ["idee", "Ideeën"]].map(([k, l]) => `<button type="button" data-wk-keuze="${k}" data-id="${esc(p.id)}" aria-pressed="${(V.weekKeuzes || {})[p.id] === k || (!(V.weekKeuzes || {})[p.id] && k === "door")}">${l}</button>`).join("")}</div></div>`; }).join("")}</div>`
    : `<p class="klein leeg-regel">Geen actieve projecten deze week.</p>`);
  h += sectie("Volgende week") + `<div class="paneel"><div class="veld"><label for="wk-mee">Wat neem je mee naar volgende week?</label><textarea class="invoer" id="wk-mee" rows="3" maxlength="400" placeholder="Eén ding is genoeg">${esc(V.weekTekst || "")}</textarea></div>
    <button class="knop primair breed" data-wk-klaar>${weekGedaan() ? "Opnieuw opslaan" : "Weekreview afronden"}</button>
    <details class="waarom"><summary>Waarom een weekreview?</summary><p>Eens per week kort terugkijken en bewust kiezen wat doorgaat, houdt je projecten in beweging en voorkomt dat er te veel tegelijk loopt. Indirect: terugkijken en bijsturen zijn onderdeel van ADHD-gerichte coaching en CGT, niet als losse oefening onderzocht.</p></details></div>`;
  return h;
}
KOPPEN.week = () => ["Weekreview", `week van ${datumKort((d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`)(new Date(ptWeekStart(Date.now()))))}`];
VIEWS.week = vwWeek;

/* ---------- Commandocentrum en projectscherm uitbreiden ---------- */
{
  const _cmd = VIEWS.commando;
  VIEWS.commando = function () {
    let h = _cmd.apply(this, arguments);
    if (!S.projecten.length) return h;
    const ci = checkinHTML();
    // Weer in beweging: afkoelende en stille projecten met één tik naar een blok van 5 minuten.
    const koud = S.projecten.filter(p => p.status === "actief" && ["afkoelend", "stil"].includes(ptGezondheid(p, S.logs, Date.now()).id));
    const beweging = koud.length ? `<section class="paneel"><p class="hud-label">Weer in beweging</p><p class="klein">Vijf minuten is genoeg om de draad weer op te pakken.</p>
      <div class="lijst">${koud.slice(0, 3).map(p => `<button class="knop rand breed" data-focus-start="${esc(p.id)}" data-duur="5">${ico("klok")} 5 minuten aan ${esc(p.titel)}</button>`).join("")}</div></section>` : "";
    const dag = new Date().getDay(), week = !weekGedaan() && [0, 1, 5, 6].includes(dag) ? `<button class="paneel rij-knop" data-ga="week">${ico("log")}<span><b>Weekreview</b><small>Tien minuten terugkijken en kiezen wat doorgaat.</small></span>${ico("pijl")}</button>` : "";
    // Check-ins bovenaan, de rest onder de focus.
    const i = h.indexOf('<section class="tellers"');
    return ci + (i < 0 ? h + beweging + week : h.slice(0, i) + beweging + h.slice(i) + week);
  };
  const _proj = VIEWS.project;
  VIEWS.project = function () {
    let h = _proj.apply(this, arguments);
    const p = vind("projecten", V.param); if (!p || !ptIsOpen(p)) return h;
    const open = S.beloftes.filter(b => b.projectId === p.id && b.status === "open").sort((a, b) => a.moment.localeCompare(b.moment));
    const c = ptBeloftesCijfers(S.beloftes, 0, p.id);
    const blok = `<div class="paneel acties focusacties"><button class="knop primair" data-focus-start="${esc(p.id)}">${ico("klok")} Focusblok</button><button class="knop rand" data-belofte="${esc(p.id)}">${ico("vlag")} Belofte</button></div>
      ${open.length ? `<ul class="paneel beloftes">${open.map(b => `<li><span class="mono">${esc(momentTekst(b.moment))}</span><span>${esc(b.tekst)}</span></li>`).join("")}</ul>` : ""}
      ${c.totaal ? `<p class="klein leeg-regel">Beloftes: ${c.gedaan} gedaan, ${c.half} half, ${c.niet} niet gelukt.</p>` : ""}`;
    const i = h.indexOf('<div class="sectie"><h2>Stappen</h2>');
    return i < 0 ? h + blok : h.slice(0, i) + blok + h.slice(i);
  };
  // Op de focuskaart: ook een focusblok en een belofte.
  const _cmd2 = VIEWS.commando;
  VIEWS.commando = function () {
    return _cmd2.apply(this, arguments).replace(/<button class="knop rand" data-snel-log="([^"]+)">[^]*?<\/button>/, (m, id) => `<button class="knop rand" data-focus-start="${id}">${ico("klok")} Focusblok</button><button class="knop rand" data-belofte="${id}">${ico("vlag")} Belofte</button>`);
  };
}
// Meer: weekreview erbij
{
  const _meer = VIEWS.meer;
  VIEWS.meer = function () {
    return `<button class="paneel rij-knop" data-ga="week">${ico("log")}<span><b>Weekreview</b><small>${weekGedaan() ? "Deze week gedaan" : "Kijk terug op deze week"}</small></span>${ico("pijl")}</button>` + _meer.apply(this, arguments);
  };
}

/* ---------- Klikken ---------- */
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-ci],[data-belofte],[data-focus-start],[data-wk-keuze],[data-wk-klaar]"); if (!el) return;
  const d = el.dataset;
  if (d.ci) {
    if (d.ci === "niet") return nietGeluktBlad(d.id);
    await belofteAntwoord(d.id, d.ci); tril(d.ci === "gedaan" ? [15, 30, 15] : 8); teken();
    const b = vind("beloftes", d.id);
    if (d.ci === "gedaan") toast("Gedaan. Afspraak met jezelf nagekomen.");
    else toast("Half is ook vooruit.", "Rest beloven", () => belofteBlad(b.projectId, `Rest van: ${b.tekst}`));
    return;
  }
  if (d.belofte) return belofteBlad(d.belofte);
  if (d.focusStart) {
    if (d.duur) { await zetInst("timer", { projectId: d.focusStart, stapId: (ptVolgendeStap(vind("projecten", d.focusStart), S.stappen) || {}).id || null, start: Date.now(), duur: +d.duur, pauzeOp: null, gepauzeerd: 0 }); tril(10); return timerTeken(); }
    return focusBlad(d.focusStart);
  }
  if (d.wkKeuze) { V.weekKeuzes = Object.assign({}, V.weekKeuzes, { [d.id]: d.wkKeuze }); V.weekTekst = ($("#wk-mee") || {}).value || V.weekTekst; return teken(); }
  if (d.wkKlaar !== undefined) {
    const tekst = $("#wk-mee").value.trim(), w = ptWeekStart(Date.now());
    for (const [id, k] of Object.entries(V.weekKeuzes || {})) {
      const p = vind("projecten", id); if (!p || k === "door" || p.status === k) continue;
      const oud = p.status; p.status = k; await bewaar("projecten", p); await log(p.id, "fase", `Weekreview: ${PT_STATUS[oud].naam} → ${PT_STATUS[k].naam}`);
    }
    await zetInst("weekreviews", (inst("weekreviews", []) || []).filter(r => r.week !== w).concat({ week: w, tekst, ts: new Date().toISOString() }).slice(-104));
    V.weekKeuzes = {}; V.weekTekst = "";
    tril([15, 30, 15]); ga("commando"); toast("Weekreview klaar. Volgende week begint met een plan.");
  }
});
// Een lopend blok overleeft herladen en schermwissel.
NA_TEKENEN.push(() => { if (inst("timer", null) && !$("#timer")) timerTeken(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && inst("timer", null)) timerTeken(); });

start();
</script>
</body>
